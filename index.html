        '<div class="stack" data-ex-list' + (settingsOpen[w.id] ? '' : ' hidden') + '>';
      w.exercises.forEach(function(e){
        html += '<div class="settings-ex" data-ex-row="' + e.id + '">' +
          '<div class="top"><input type="text" data-f="name" value="' + escapeAttr(e.name) + '" placeholder="Nom">' +
          '<button class="icon-btn" data-del="' + e.id + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
          '<input type="text" data-f="machine" value="' + escapeAttr(e.machine) + '" placeholder="Machine / description">' +
          '<label class="row" style="font-size:12.5px; gap:6px;"><input type="checkbox" data-f="trackWeight" ' + (e.trackWeight?"checked":"") + '> Suivre un poids (décoche pour un exercice au poids du corps)</label>' +
          '<div class="def-grid">' + state.people.map(function(pl){
            var d = e.defaults[pl.id];
            return '<div class="def-cell ' + (pl.id==="p2"?"p2":"") + '"><div class="pname">' + escapeAttr(pl.name) + '</div>' +
              '<div class="inline"><input type="number" data-def="weight" data-person="' + pl.id + '" value="' + d.weight + '" title="poids kg">' +
              '<input type="number" data-def="reps" data-person="' + pl.id + '" value="' + d.reps + '" title="répétitions"></div></div>';
          }).join("") + '</div>' +
          '<textarea data-f="howTo" placeholder="Comment faire l’exercice (optionnel) — affiché via le bouton (i) pendant la séance" rows="2" style="width:100%; resize:vertical; font-family:inherit; font-size:12.5px; background:rgba(255,255,255,.05); border:1px solid var(--glass-border); color:var(--ink); border-radius:10px; padding:8px 10px;">' + escapeAttr(e.howTo||"") + '</textarea>' +
        '</div>';
      });
      html += '<button class="btn btn-ghost btn-sm" data-addex="' + w.id + '">+ Ajouter un exercice</button></div></div>';
    });

    html += '<div class="card stack"><div class="section-title">Sauvegarde</div>' +
      '<div class="faint">Sauvegardée automatiquement dans le cloud à chaque modification, partagée entre tous tes appareils. Exporte aussi en local de temps en temps si tu veux une copie portable.</div>' +
      '<label class="pf-field">Nom de cet appareil<input type="text" id="device-name-input" placeholder="ex: iPhone d’Am" value="' + escapeAttr(getDeviceName()) + '"></label>' +
      '<div class="row" style="gap:10px;"><button class="btn btn-line" id="export-btn" style="flex:1;">Exporter</button>' +
      '<button class="btn btn-line" id="import-btn" style="flex:1;">Importer</button></div>' +
      '<div class="faint">Dernière sauvegarde manuelle : ' + fmtBackupAge(state.lastBackupAt) + '</div>' +
      '<div class="faint" id="cloud-sync-status">Sauvegarde cloud : ' + fmtBackupAge(state.lastCloudSyncAt) + '</div>' +
      '<div class="faint" id="cloud-remote-status">Dernière synchro : inconnue</div>' +
      '<button class="btn btn-line" id="cloud-restore-btn">Restaurer depuis le cloud</button>' +
      '<button class="btn btn-line" id="reset-btn" style="color:var(--accent); border-color:var(--accent);">Réinitialiser toutes les données</button></div>';
    html += '</div>';
    $view.innerHTML = html;
    refreshRemoteStatusUI();
    document.getElementById("device-name-input").addEventListener("change", function(){ setDeviceName(this.value.trim()); });

    $view.querySelectorAll("[data-edit-muscles]").forEach(function(btn){
      btn.addEventListener("click", function(){ showMuscleEditor(btn.getAttribute("data-edit-muscles")); });
    });
    $view.querySelectorAll("[data-toggle-workout]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var card = btn.closest("[data-workout]");
        var list = card.querySelector("[data-ex-list]");
        var chevron = btn.querySelector(".chevron");
        list.hidden = !list.hidden;
        chevron.classList.toggle("open", !list.hidden);
        settingsOpen[card.getAttribute("data-workout")] = !list.hidden;
      });
    });
    $view.querySelectorAll("[data-theme-pick]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.theme = btn.getAttribute("data-theme-pick");
        applyTheme(); save(); renderSettings();
      });
    });
    document.getElementById("rest-duration-input").addEventListener("change", function(){
      var v = parseInt(this.value, 10);
      if(isNaN(v) || v < 10) v = state.restDurationDefault;
      this.value = v;
      state.restDurationDefault = v;
      save();
    });
    $view.querySelectorAll("[data-quicklog-duration]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var w = findWorkout(inp.getAttribute("data-quicklog-duration"));
        var v = parseInt(inp.value, 10);
        if(isNaN(v) || v < 1) v = w.defaultDurationMin;
        inp.value = v;
        w.defaultDurationMin = v;
        save();
      });
    });
    document.getElementById("gemini-key-input").addEventListener("change", function(){
      state.geminiApiKey = this.value.trim();
      save();
    });
    $view.querySelectorAll("[data-person-name]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var pl = state.people.find(function(p){return p.id===inp.getAttribute("data-person-name");});
        pl.name = inp.value || pl.name; save(); render();
      });
    });
    $view.querySelectorAll("[data-person-bw]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var v = parseFloat(inp.value); if(!isNaN(v)&&v>0) state.bodyWeights[inp.getAttribute("data-person-bw")] = v; save();
      });
    });
    $view.querySelectorAll("[data-person-h]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var v = parseFloat(inp.value);
        state.bodyProfiles[inp.getAttribute("data-person-h")].heightCm = (!isNaN(v)&&v>0) ? v : null;
        save();
      });
    });
    $view.querySelectorAll("[data-person-age]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var v = parseInt(inp.value,10);
        state.bodyProfiles[inp.getAttribute("data-person-age")].age = (!isNaN(v)&&v>0) ? v : null;
        save();
      });
    });
    $view.querySelectorAll("[data-person-sex]").forEach(function(sel){
      sel.addEventListener("change", function(){
        state.bodyProfiles[sel.getAttribute("data-person-sex")].sex = sel.value; save();
      });
    });
    $view.querySelectorAll("[data-person-activity]").forEach(function(sel){
      sel.addEventListener("change", function(){
        state.bodyProfiles[sel.getAttribute("data-person-activity")].activity = sel.value; save();
        // Unlike the other profile fields, this one has a computed number right below it
        // (the calories-burned goal) that would otherwise go stale until the next visit —
        // worth the re-render, since a <select>'s change (unlike a text input's) never has
        // a cursor position or focus to lose.
        renderSettings();
      });
    });
    $view.querySelectorAll("[data-person-goal]").forEach(function(sel){
      sel.addEventListener("change", function(){
        state.bodyProfiles[sel.getAttribute("data-person-goal")].goal = sel.value; save();
        // Same reasoning as data-person-activity above: the goal also feeds the computed
        // calories-brûlées line right below, so re-render to keep it in sync.
        renderSettings();
      });
    });
    $view.querySelectorAll("[data-ex-row]").forEach(function(row){
      var exId = row.getAttribute("data-ex-row");
      row.querySelectorAll("[data-f]").forEach(function(inp){
        inp.addEventListener("change", function(){
          var w = state.workouts.find(function(w){ return w.exercises.some(function(e){return e.id===exId;}); });
          var e = findExercise(w, exId), f = inp.getAttribute("data-f");
          e[f] = inp.type==="checkbox" ? inp.checked : inp.value;
          e._custom = true;
          save();
        });
      });
      row.querySelectorAll("[data-def]").forEach(function(inp){
        inp.addEventListener("change", function(){
          var w = state.workouts.find(function(w){ return w.exercises.some(function(e){return e.id===exId;}); });
          var e = findExercise(w, exId), pid = inp.getAttribute("data-person"), f = inp.getAttribute("data-def");
          var v = parseFloat(inp.value); if(isNaN(v)) v = 0;
          e.defaults[pid][f] = v; e._custom = true; save();
        });
      });
    });
    $view.querySelectorAll("[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var exId = btn.getAttribute("data-del");
        var w = state.workouts.find(function(w){ return w.exercises.some(function(e){return e.id===exId;}); });
        showConfirm("Supprimer cet exercice ?", "Cette action est définitive.", "Supprimer", function(){
          w.exercises = w.exercises.filter(function(e){return e.id!==exId;}); save(); renderSettings();
        }, true);
      });
    });
    $view.querySelectorAll("[data-addex]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var w = findWorkout(btn.getAttribute("data-addex"));
        w.exercises.push(ex(uid(), "Nouvel exercice", "Machine / description", true, 3, 10,10, 10,10));
        save(); renderSettings();
      });
    });
    document.getElementById("export-btn").addEventListener("click", exportData);
    document.getElementById("import-btn").addEventListener("click", function(){ document.getElementById("import-input").click(); });
    document.getElementById("cloud-restore-btn").addEventListener("click", function(){
      showConfirm("Restaurer depuis le cloud", "Remplace toutes les données de cet appareil par la dernière sauvegarde cloud partagée. Continuer ?", "Restaurer", function(){
        if(!window.__cloudSync){ showAlert("La connexion au cloud n'est pas prête, réessaie dans un instant."); return; }
        window.__cloudSync.restore().then(function(result){
          if(!result){ showAlert("Aucune sauvegarde cloud trouvée."); return; }
          lastRemoteInfo = { device: result.device, updatedAtMs: result.updatedAtMs };
          adoptRemoteState(result.state);
          applyTheme(); render();
        }).catch(function(){ showAlert("Impossible de contacter le cloud pour le moment — vérifie ta connexion internet."); });
      }, true);
    });
    document.getElementById("reset-btn").addEventListener("click", function(){
      showConfirm("Tout réinitialiser ?", "Toutes les séances enregistrées seront perdues et les exercices reviendront à leurs valeurs par défaut.", "Réinitialiser", function(){
        state = defaultState(); applyTheme(); save(); render();
      }, true);
    });
  }

  async function exportData(){
    var filename = "sport-" + new Date().toISOString().slice(0,10) + ".json";
    var data = JSON.stringify(state, null, 2);
    var blob = new Blob([data], {type:"application/json"});
    try{
      var downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if(downloads){ await downloads.save({ filename:filename, data:blob }); markBackedUp(); return; }
    }catch(e){}
    // On iPhone, the share sheet is what actually gets a backup OFF the device — straight to
    // iCloud Drive, Mail, Messages, AirDrop, whatever — instead of a plain download that just
    // lands quietly in the Files app's Downloads folder (still on the same phone).
    try{
      var file = new File([blob], filename, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:"Sauvegarde Sport", text:"Sauvegarde des données Sport (" + new Date().toLocaleDateString("fr-FR") + ")" });
        markBackedUp();
        return;
      }
    }catch(e){ if(e && e.name === "AbortError") return; /* user cancelled the share sheet, not an error */ }
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      markBackedUp();
    }catch(e){ showAlert("L'export a échoué sur cet appareil."); }
  }
  function markBackedUp(){ state.lastBackupAt = new Date().toISOString(); save(); }
  function daysSince(iso){ if(!iso) return Infinity; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
  function fmtBackupAge(iso){
    if(!iso) return "jamais";
    var d = daysSince(iso);
    if(d <= 0) return "aujourd’hui";
    if(d === 1) return "hier";
    return "il y a " + d + " jours";
  }
  document.getElementById("import-input").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(parsed && parsed.workouts && parsed.people){ state = ensureRestDuration(ensureBodyWeightLog(ensureBodyProfiles(parsed))); applyTheme(); save(); render(); showAlert("Données importées."); }
        else showAlert("Fichier invalide.");
      }catch(err){ showAlert("Fichier invalide."); }
    };
    reader.readAsText(file);
  });

  function boot(){ applyTheme(); render(); }
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {}; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
  } else { boot(); }

  // Pulls whatever another of your iPhones may have pushed since this device last looked —
  // on load (module is generally ready by then, see the comment on window.__cloudSync
  // further down) and every time the app comes back to the foreground.
  window.addEventListener("load", function(){ checkCloudForUpdates(); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkCloudForUpdates(); });

  // Auto-update: without this, a new deploy never reaches the phone until you delete
  // the app from the home screen and clear site data — the OS only re-checks for a new
  // service-worker.js on its own schedule, which in practice is unreliable for a
  // standalone PWA. Forcing a check on every launch/resume (visibilitychange, which the
  // scroll-fix code at the top of <head> already hooks for the same "just reopened the
  // app" moment) and reloading as soon as the new one takes over means a fresh deploy
  // shows up just by reopening the app, no manual reset needed.
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then(function(reg){
        reg.update().catch(function(){});
        document.addEventListener("visibilitychange", function(){
          if(!document.hidden) reg.update().catch(function(){});
        });
      }).catch(function(){});
    });
    var reloadingForUpdate = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloadingForUpdate) return;
      reloadingForUpdate = true;
      // Mid-workout, force-reloading would cut you off in the middle of a set — ask
      // first (your data is already saved on every change, so nothing is lost either
      // way, but the interruption itself is worth a heads-up). Otherwise just refresh.
      if(state.activeSession){
        showConfirm("Nouvelle version", "Une mise à jour de l'app est prête. Actualiser maintenant ?", "Actualiser", function(){ window.location.reload(); });
        reloadingForUpdate = false;
      } else {
        window.location.reload();
      }
    });
  }
})();
</script>

<script type="module">
  // Shared cloud backup: mirrors the same JSON export() already produces up to Firestore,
  // under ONE fixed document shared by every iPhone running this app (SHARED_DOC_ID below) —
  // that's what lets a session logged on iPhone 1 on Monday show up in the history on
  // iPhone 2 on Tuesday (see checkCloudForUpdates in the main script). Anonymous auth is
  // still used (each device signs itself in) purely so Firestore's rules can require
  // request.auth != null; it's no longer part of the document path. Since this file — and
  // the Firebase config and SHARED_DOC_ID in it — are public in the GitHub repo, the real
  // security boundary is the Firestore rule restricting reads/writes to exactly this one
  // document id, not the id being secret.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyBgjzTjhPxx5GBUFavZ_rR0aZ1QdpnmPm4",
    authDomain: "sport-app-debe7.firebaseapp.com",
    projectId: "sport-app-debe7",
    storageBucket: "sport-app-debe7.firebasestorage.app",
    messagingSenderId: "992408391096",
    appId: "1:992408391096:web:5fac245f218b2e7480934d"
  };
  var SHARED_DOC_ID = "d31a77a5-baf0-4bb1-a3e3-845de0de61cc";

  var app = initializeApp(firebaseConfig);
  var auth = getAuth(app);
  // persistentLocalCache is what lets a write made with no signal at the gym sit queued in
  // IndexedDB and go out on its own once the phone has a connection again, with no retry
  // logic of our own needed — the SDK handles that.
  var db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager({}) }) });
  var sharedDoc = doc(db, "backups", SHARED_DOC_ID);

  var authReady = new Promise(function(resolve){
    onAuthStateChanged(auth, function(user){ if(user) resolve(); });
    signInAnonymously(auth).catch(function(err){ console.warn("cloud auth failed", err); });
  });

  window.__cloudSync = {
    // deviceName is metadata ABOUT the push (who made it), stored as its own field
    // alongside the data rather than inside the JSON blob — adopting a pull overwrites
    // the whole app state, and a device's own name must never get clobbered by that.
    save: function(stateObj, deviceName){
      return authReady.then(function(){
        return setDoc(sharedDoc, { json: JSON.stringify(stateObj), updatedAt: serverTimestamp(), device: deviceName || "" });
      });
    },
    restore: function(){
      return authReady.then(function(){ return getDoc(sharedDoc); }).then(function(snap){
        if(!snap.exists()) return null;
        var data = snap.data();
        var st = null;
        try{ st = JSON.parse(data.json); }catch(e){ return null; }
        var ts = data.updatedAt && data.updatedAt.toMillis ? data.updatedAt.toMillis() : null;
        return { state: st, device: data.device || "", updatedAtMs: ts };
      });
    }
  };
</script>
