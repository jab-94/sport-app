    cursor.setDate(cursor.getDate() - (cursor.getDay()===0?6:cursor.getDay()-1));
    for(var i=9;i>=0;i--){
      var d = new Date(cursor); d.setDate(d.getDate() - i*7);
      weeks.push({ key: isoWeekKey(d), label:(d.getDate())+"/"+(d.getMonth()+1), count:0 });
    }
    sessions.forEach(function(s){ var w = weeks.find(function(x){return x.key===isoWeekKey(new Date(s.date));}); if(w) w.count++; });
    var max = Math.max(1, Math.max.apply(null, weeks.map(function(w){return w.count;})));
    var bw = 96/weeks.length;
    var bars = weeks.map(function(w,i){
      var h = (w.count/max) * (H - pad - 14);
      var x = 2 + i*bw, y = H - pad - h, isCurrent = i===weeks.length-1;
      return '<rect x="' + x + '%" y="' + y + '" width="' + (bw*0.62) + '%" height="' + h + '" rx="2" fill="' + (isCurrent?'var(--accent)':'var(--surface-2)') + '" stroke="var(--line)"/>' +
        (w.count>0 ? '<text x="' + (x+bw*0.31) + '%" y="' + (y-4) + '" text-anchor="middle">' + w.count + '</text>' : '') +
        '<text x="' + (x+bw*0.31) + '%" y="' + (H-4) + '" text-anchor="middle">' + w.label + '</text>';
    }).join("");
    return '<svg viewBox="0 0 400 ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" style="overflow:visible;">' +
      '<line x1="0" y1="' + (H-pad) + '" x2="400" y2="' + (H-pad) + '" stroke="var(--line)"/>' + bars + '</svg>';
  }

  // Shared by the exercise-load chart and the body-weight chart: a simple line+dots SVG
  // over dated {date, value} points, labelling only the endpoints (first/last date, last
  // value) to keep it readable at this size. Returns null when there isn't enough data to
  // draw a line, so callers can show their own "not enough data yet" message instead.
  function renderLineChartSvg(points, unitSuffix){
    if(points.length < 2) return null;
    var H=130, W=400, padL=8, padR=8, padT=14, padB=20;
    var min = Math.min.apply(null, points.map(function(p){return p.value;}));
    var max = Math.max.apply(null, points.map(function(p){return p.value;}));
    if(min===max){ min-=1; max+=1; }
    function X(i){ return padL + (i/(points.length-1)) * (W-padL-padR); }
    function Y(v){ return padT + (1 - (v-min)/(max-min)) * (H-padT-padB); }
    var path = points.map(function(p,i){ return (i===0?"M":"L") + X(i).toFixed(1) + "," + Y(p.value).toFixed(1); }).join(" ");
    var dots = points.map(function(p,i){
      var last = i===points.length-1;
      return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.value).toFixed(1) + '" r="' + (last?4:2.5) + '" fill="' + (last?'var(--accent)':'var(--ink-faint)') + '"/>' +
        (last ? '<text x="' + X(i).toFixed(1) + '" y="' + (Y(p.value)-9).toFixed(1) + '" text-anchor="end" fill="var(--accent)" font-weight="600">' + p.value + unitSuffix + '</text>' : '');
    }).join("");
    var labels = '<text x="' + X(0).toFixed(1) + '" y="' + (H-4) + '">' + fmtDate(points[0].date) + '</text>' +
      '<text x="' + X(points.length-1).toFixed(1) + '" y="' + (H-4) + '" text-anchor="end">' + fmtDate(points[points.length-1].date) + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' +
      '<line x1="' + padL + '" y1="' + (H-padB) + '" x2="' + (W-padR) + '" y2="' + (H-padB) + '" stroke="var(--line)"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2"/>' + dots + labels + '</svg>';
  }

  // Same idea as renderLineChartSvg, but two series (Am/Jab) sharing one set of axes instead
  // of one merged/summed line — "Nous deux" compares, it doesn't average two people's intake
  // into a single meaningless curve. Both series are expected to have the same length/dates
  // (same `days` window from nutritionTrendPoints), so they share one x-scale by index and one
  // y-scale across both series' combined min/max.
  function renderDualLineChartSvg(pointsA, pointsB, colorA, colorB, unitSuffix){
    if(pointsA.length < 2 || pointsB.length < 2) return null;
    var H=130, W=400, padL=8, padR=8, padT=14, padB=20;
    var allValues = pointsA.map(function(p){return p.value;}).concat(pointsB.map(function(p){return p.value;}));
    var min = Math.min.apply(null, allValues), max = Math.max.apply(null, allValues);
    if(min===max){ min-=1; max+=1; }
    function X(i, n){ return padL + (i/(n-1)) * (W-padL-padR); }
    function Y(v){ return padT + (1 - (v-min)/(max-min)) * (H-padT-padB); }
    function seriesSvg(points, color){
      var n = points.length;
      var path = points.map(function(p,i){ return (i===0?"M":"L") + X(i,n).toFixed(1) + "," + Y(p.value).toFixed(1); }).join(" ");
      var last = points[n-1], lastX = X(n-1,n), lastY = Y(last.value);
      return '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2"/>' +
        '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="4" fill="' + color + '"/>' +
        '<text x="' + lastX.toFixed(1) + '" y="' + (lastY-9).toFixed(1) + '" text-anchor="end" fill="' + color + '" font-weight="600">' + last.value + unitSuffix + '</text>';
    }
    var labels = '<text x="' + X(0,pointsA.length).toFixed(1) + '" y="' + (H-4) + '">' + fmtDate(pointsA[0].date) + '</text>' +
      '<text x="' + X(pointsA.length-1,pointsA.length).toFixed(1) + '" y="' + (H-4) + '" text-anchor="end">' + fmtDate(pointsA[pointsA.length-1].date) + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' +
      '<line x1="' + padL + '" y1="' + (H-padB) + '" x2="' + (W-padR) + '" y2="' + (H-padB) + '" stroke="var(--line)"/>' +
      seriesSvg(pointsA, colorA) + seriesSvg(pointsB, colorB) + labels + '</svg>';
  }

  // A dual ring (see dualRingSvg) plus a two-color legend underneath, for a continuous goal
  // (calories/protéines) rather than a session count — "profil incomplet" per person instead
  // of a bogus "X/undefined" when that person's nutrition target isn't computable yet.
  function nutrientRingTileHtml(label, vA, goalA, colorA, nameA, vB, goalB, colorB, nameB, unit){
    function legendPart(v, goal, color, name){
      return '<span style="color:' + color + '; font-weight:600;">' + escapeAttr(name) + ' ' +
        (goal==null ? "profil incomplet" : (Math.round(v) + "/" + Math.round(goal) + unit)) + '</span>';
    }
    return '<div class="stat-tile" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;">' +
      dualRingSvg(vA, goalA||0, colorA, vB, goalB||0, colorB, 72) +
      '<div class="stack" style="gap:2px; font-size:11.5px; align-items:center;">' + legendPart(vA,goalA,colorA,nameA) + legendPart(vB,goalB,colorB,nameB) + '</div>' +
      '<div class="l" style="text-align:center;">' + label + '</div>' +
    '</div>';
  }

  function drawExerciseChart(exId, pid, el){
    var points = [];
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(e){
        if(e.exId===exId && e.trackWeight && e.entries[pid] && e.entries[pid].done) points.push({ date:s.date, value:e.entries[pid].weight });
      });
    });
    var svg = renderLineChartSvg(points, " kg");
    el.innerHTML = svg || ('<div class="faint">Pas encore assez de séances enregistrées pour tracer une courbe' + (points.length===1?" (poids actuel : "+points[0].value+" kg)":"") + '.</div>');
  }

  // ---------- BODY WEIGHT LOG ----------
  // Overwrites the same day's entry rather than appending, so fixing a typo (or just
  // re-logging the same morning) doesn't create a second point for one real reading.
  function logBodyWeight(pid, weight){
    state.bodyWeights[pid] = weight;
    if(!state.bodyWeightLog) state.bodyWeightLog = {};
    var log = state.bodyWeightLog[pid] || (state.bodyWeightLog[pid] = []);
    var today = new Date().toISOString().slice(0,10);
    var idx = log.findIndex(function(entry){ return entry.date.slice(0,10) === today; });
    var entry = { date: new Date().toISOString(), weight: weight };
    if(idx >= 0) log[idx] = entry; else log.push(entry);
    log.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    save();
  }

  // ---------- NUTRITION LOG (meal cards + food diary) ----------
  // A "dish" is a reusable card (home-cooked meal, restaurant dish, or a packaged product's
  // label values) — either "per portion" (fixed serving, scaled by a portion count when
  // logged) or "per 100g" (scaled by grams eaten, like a nutrition label). Logging a dish
  // snapshots the computed totals into foodLog rather than storing a live reference to the
  // dish, so editing or deleting a card later never rewrites what was actually eaten that day.
  var MEALS = { petitdej:"Petit déjeuner", dejeuner:"Déjeuner", collation:"Collation", diner:"Dîner" };
  // Fixed display/filter order for "Mes plats" tags — anything not listed here (an unknown
  // tag, or none at all) sorts after all of these, in whatever order it was already in.
  var DISH_TAG_ORDER = ["plat", "plat préparé", "produit", "fruit", "légume", "féculent", "viande", "poisson"];
  function dishTagRank(tag){
    var i = DISH_TAG_ORDER.indexOf(tag);
    return i === -1 ? DISH_TAG_ORDER.length : i;
  }
  // Which day the journal (and any new log entry) currently points at — resets to today on
  // reload, like historyFilter/settingsOpen elsewhere. Navigating back a day lets you log a
  // meal you forgot yesterday, the same spirit as editing a past session in Historique.
  var nutritionViewDate = new Date();
  var nutritionPeriod = "day";
  var dishSearch = "", dishTagFilter = "all";
  // Date to stamp a newly-logged entry with: the exact day being browsed (so looking back at
  // yesterday backdates correctly) when the journal is in "Jour" mode, but just "now" in
  // Semaine/Mois/Année mode — there's no single unambiguous day to backdate to when you're
  // looking at a whole month, so logging there always lands on today.
  function nutritionEntryDate(){
    var now = new Date();
    if(nutritionPeriod !== "day") return now;
    var d = new Date(nutritionViewDate);
    d.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
    return d;
  }
  function dayKey(d){ return new Date(d).toDateString(); }

  // ---------- PERIOD NAVIGATION (jour/semaine/mois/année) ----------
  // Shared by the Progrès and Nutrition tabs' date nav — both used to only understand "one
  // day at a time" (dayKey equality); this generalizes that into a selectable period whose
  // start/end bracket a whole week/month/year instead of a single day, so "today"'s stat
  // block becomes "this week/month/year"'s when you switch the period pill.
  var PERIODS = { day:"Jour", week:"Semaine", month:"Mois", year:"Année" };
  function periodStart(type, d){
    var s = new Date(d);
    s.setHours(0,0,0,0);
    if(type === "week"){
      var dow = s.getDay(); // 0=dimanche..6=samedi
      s.setDate(s.getDate() - (dow===0 ? 6 : dow-1)); // recule jusqu'au lundi
    } else if(type === "month"){
      s.setDate(1);
    } else if(type === "year"){
      s.setMonth(0, 1);
    }
    return s;
  }
  function periodEnd(type, d){ // exclusive
    var e = new Date(periodStart(type, d));
    if(type === "day") e.setDate(e.getDate()+1);
    else if(type === "week") e.setDate(e.getDate()+7);
    else if(type === "month") e.setMonth(e.getMonth()+1);
    else if(type === "year") e.setFullYear(e.getFullYear()+1);
    return e;
  }
  function shiftPeriod(type, d, dir){
    var r = new Date(d);
    if(type === "day") r.setDate(r.getDate()+dir);
    else if(type === "week") r.setDate(r.getDate()+dir*7);
    else if(type === "month") r.setMonth(r.getMonth()+dir);
    else if(type === "year") r.setFullYear(r.getFullYear()+dir);
    return r;
  }
  function isCurrentPeriod(type, d){ return periodStart(type, d).getTime() === periodStart(type, new Date()).getTime(); }
  function periodLabel(type, d){
    var start = periodStart(type, d);
    if(type === "day") return isCurrentPeriod(type, d) ? "Aujourd’hui" : fmtDateFull(start.toISOString());
    if(type === "week"){
      var endIncl = new Date(periodEnd(type, d)); endIncl.setDate(endIncl.getDate()-1);
      var range = fmtDate(start.toISOString()) + " – " + fmtDate(endIncl.toISOString());
      return isCurrentPeriod(type, d) ? "Cette semaine (" + range + ")" : range;
    }
    if(type === "month"){
      var label = start.toLocaleDateString("fr-FR", { month:"long", year:"numeric" });
      return isCurrentPeriod(type, d) ? "Ce mois-ci (" + label + ")" : label;
    }
    // year
    return isCurrentPeriod(type, d) ? "Cette année (" + start.getFullYear() + ")" : String(start.getFullYear());
  }
  // Sessions/food-log-style filtering shared by both tabs: true if `date` falls in [start,end).
  function inPeriod(date, start, end){ var t = new Date(date).getTime(); return t >= start.getTime() && t < end.getTime(); }

  function guessMealForNow(){
    var h = new Date().getHours();
    if(h < 10) return "petitdej";
    if(h < 15) return "dejeuner";
    if(h < 19) return "collation";
    return "diner";
  }
  // Sum of a composite dish's ingredients at their own default gram quantities — used for
  // the "Mes plats" card summary. openLogCompositeDishModal computes the same thing but from
  // whatever quantities are on screen at that moment, which may differ from these defaults.
  function compositeDefaultTotal(dish){
    var t = { kcal:0, protein:0, carbs:0, fat:0 };
    dish.ingredients.forEach(function(ing){
      var scale = (ing.defaultQty||0) / 100;
      t.kcal += ing.kcal*scale; t.protein += ing.protein*scale;
      t.carbs += (ing.carbs||0)*scale; t.fat += (ing.fat||0)*scale;
    });
    return t;
  }
  // Daily totals for one macro field over the last `days` days (today inclusive), for the
  // trend charts — reuses renderLineChartSvg, the same line-chart helper as the body-weight
  // and exercise-load charts in Progrès.
  function nutritionTrendPoints(pid, field, days){
    var ids = personIdsFor(pid);
    var points = [];
    for(var i=days-1; i>=0; i--){
      var d = new Date(); d.setDate(d.getDate()-i);
      var key = dayKey(d);
      var total = state.foodLog.filter(function(e){ return ids.indexOf(e.personId)!==-1 && dayKey(e.date)===key; })
        .reduce(function(a,e){ return a + (e[field]||0); }, 0);
      points.push({ date: d.toISOString(), value: Math.round(total) });
    }
    return points;
  }
  function renderNutrition(){
    var pid = state.currentPerson || "p1";
    var ids = personIdsFor(pid);
    var pStart = periodStart(nutritionPeriod, nutritionViewDate), pEnd = periodEnd(nutritionPeriod, nutritionViewDate);
    var isCurrentP = isCurrentPeriod(nutritionPeriod, nutritionViewDate);
    var periodNow = { day:"aujourd’hui", week:"cette semaine", month:"ce mois-ci", year:"cette année" }[nutritionPeriod];
    var periodThen = { day:"ce jour-là", week:"cette semaine-là", month:"ce mois-là", year:"cette année-là" }[nutritionPeriod];

    var periodEntries = state.foodLog.filter(function(e){ return ids.indexOf(e.personId)!==-1 && inPeriod(e.date, pStart, pEnd); })
      .slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    var eatenKcal = periodEntries.reduce(function(a,e){ return a+e.kcal; }, 0);
    var eatenProtein = periodEntries.reduce(function(a,e){ return a+e.protein; }, 0);
    var nut = calcNutritionTargetsFor(pid);
    // Un objectif "par jour" affiché tel quel sur une semaine/un mois/une année n'aurait pas
    // de sens — mis à l'échelle du nombre de jours réellement couverts par la période affichée.
    var daysInPeriod = Math.max(1, Math.round((pEnd - pStart) / 86400000));
    var nutScaled = nut ? { calories: Math.round(nut.calories*daysInPeriod), protein: Math.round(nut.protein*daysInPeriod) } : null;
    // Per-person breakdown for "Nous deux" — a merged total told you nothing about who's
    // actually hitting their own goal, hence two rings (one color each) instead.
    var p1Entries = periodEntries.filter(function(e){ return e.personId==="p1"; });
    var p2Entries = periodEntries.filter(function(e){ return e.personId==="p2"; });
    var p1Kcal = p1Entries.reduce(function(a,e){ return a+e.kcal; }, 0);
    var p2Kcal = p2Entries.reduce(function(a,e){ return a+e.kcal; }, 0);
    var p1Protein = p1Entries.reduce(function(a,e){ return a+e.protein; }, 0);
    var p2Protein = p2Entries.reduce(function(a,e){ return a+e.protein; }, 0);
    var p1Nut = calcNutritionTargets("p1"), p2Nut = calcNutritionTargets("p2");
    var p1NutScaled = p1Nut ? { calories: Math.round(p1Nut.calories*daysInPeriod), protein: Math.round(p1Nut.protein*daysInPeriod) } : null;
    var p2NutScaled = p2Nut ? { calories: Math.round(p2Nut.calories*daysInPeriod), protein: Math.round(p2Nut.protein*daysInPeriod) } : null;

    var html = '<div class="stack enter-anim" style="margin-top:6px;">';
    html += '<div class="pill-group">' + state.people.map(function(pl){
      return '<button class="pill ' + (pl.id===pid?"active":"") + ' ' + (pl.id==="p2"?"p2":"") + '" data-person-select="' + pl.id + '">' + escapeAttr(pl.name) + '</button>';
    }).join("") +
      '<button class="pill ' + (pid==="both"?"active":"") + '" data-person-select="both">Nous deux</button>' +
    '</div>';

    html += '<div class="pill-group">' + Object.keys(PERIODS).map(function(pk){
      return '<button class="pill neutral' + (nutritionPeriod===pk?" active":"") + '" type="button" data-period-select="' + pk + '">' + PERIODS[pk] + '</button>';
    }).join("") + '</div>';

    html += '<div class="row between" style="align-items:center;">' +
      '<button class="icon-btn" type="button" id="nutri-day-prev"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>' +
      '<div style="font-weight:600; text-align:center; flex:1;">' + periodLabel(nutritionPeriod, nutritionViewDate) + '</div>' +
      '<button class="icon-btn" type="button" id="nutri-day-next" ' + (isCurrentP ? 'style="opacity:.3;" disabled' : '') + '><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>' +
    '</div>';

    html += '<div class="section-title">' + escapeAttr(personName(pid)) + '</div>';
    if(pid === "both"){
      // Deux anneaux comparables plutôt qu'un total fusionné (même logique que Progrès) :
      // chacun contre son PROPRE objectif, pas une moyenne ou une somme qui ne dirait pas qui
      // mange trop ou pas assez.
      html += '<div class="stat-grid">' +
        nutrientRingTileHtml("Calories", p1Kcal, p1NutScaled&&p1NutScaled.calories, "var(--p1)", personName("p1"), p2Kcal, p2NutScaled&&p2NutScaled.calories, "var(--p2)", personName("p2"), " kcal") +
        nutrientRingTileHtml("Protéines", p1Protein, p1NutScaled&&p1NutScaled.protein, "var(--p1)", personName("p1"), p2Protein, p2NutScaled&&p2NutScaled.protein, "var(--p2)", personName("p2"), " g") +
      '</div>';
    } else {
      html += '<div class="stat-grid">' +
        stat(Math.round(eatenKcal) + (nutScaled ? " / " + nutScaled.calories : "") + " kcal", "Calories") +
        stat(Math.round(eatenProtein) + (nutScaled ? " / " + nutScaled.protein : "") + " g", "Protéines") +
      '</div>';
    }
    if(!nut) html += '<div class="faint">Renseigne le profil de ' + escapeAttr(personNamesJoined(pid)) + ' dans Réglages pour voir aussi ' + (pid==="both"?"leurs":"ses") + ' objectifs.</div>';

    if(periodEntries.length){
      html += '<div class="stack" style="gap:12px;">' + Object.keys(MEALS).map(function(mk){
        var items = periodEntries.filter(function(e){ return (e.meal||"collation") === mk; });
        if(!items.length) return "";
        var mealKcal = items.reduce(function(a,e){ return a+e.kcal; }, 0);
        return '<div class="stack" style="gap:6px;">' +
          '<div class="faint" style="font-weight:600; font-size:12px;">' + MEALS[mk] + ' · ' + Math.round(mealKcal) + ' kcal</div>' +
          items.map(function(e){
            // Un repas listé pour "Nous deux" ou sur plusieurs jours (semaine/mois/année) a
            // besoin de dire qui et/ou quel jour, sinon les entrées se mélangent sans repère.
            var meta = round1(e.quantity) + ' ' + e.unit + ' · ' + Math.round(e.kcal) + ' kcal · ' + Math.round(e.protein) + ' g prot.';
            var tags = [];
            if(pid==="both") tags.push(personName(e.personId));
            if(nutritionPeriod!=="day") tags.push(fmtDate(e.date));
            if(tags.length) meta += ' · ' + tags.join(" · ");
            return '<div class="card row between" style="padding:10px 14px;">' +
              '<div><div style="font-weight:600; font-size:13.5px;">' + escapeAttr(e.dishName) + '</div>' +
              '<div class="faint" style="font-size:11.5px;">' + meta + '</div></div>' +
              '<div class="row" style="gap:6px; flex-shrink:0;">' +
                '<button class="icon-btn" data-edit-food="' + e.id + '"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/><path d="M13 7l4 4"/></svg></button>' +
                '<button class="icon-btn" data-del-food="' + e.id + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
              '</div>' +
            '</div>';
          }).join("") +
        '</div>';
      }).join("") + '</div>';
    } else {
      html += '<div class="empty">Rien d’enregistré ' + (isCurrentP?periodNow:periodThen) + ' pour ' + escapeAttr(personName(pid)) + '.</div>';
    }

    html += '<div class="section-title">Tendance (14 derniers jours) — ' + escapeAttr(personName(pid)) + '</div>';
    if(pid === "both"){
      // Une courbe par personne sur le même graphique plutôt que deux graphiques fusionnés —
      // demandé explicitement pour gagner de la place et pouvoir comparer Am/Jab d'un coup
      // d'œil, couleur par couleur, plutôt qu'une seule courbe additionnée qui ne dit rien de
      // qui a mangé quoi.
      var kcalP1 = nutritionTrendPoints("p1", "kcal", 14), kcalP2 = nutritionTrendPoints("p2", "kcal", 14);
      var proteinP1 = nutritionTrendPoints("p1", "protein", 14), proteinP2 = nutritionTrendPoints("p2", "protein", 14);
      if(kcalP1.concat(kcalP2).some(function(p){ return p.value>0; })){
        html += '<div class="faint" style="font-size:11.5px;">Calories / jour — <span style="color:var(--p1);">' + escapeAttr(personName("p1")) + '</span> · <span style="color:var(--p2);">' + escapeAttr(personName("p2")) + '</span></div>' +
          '<div class="chart-wrap">' + renderDualLineChartSvg(kcalP1, kcalP2, "var(--p1)", "var(--p2)", " kcal") + '</div>' +
          '<div class="faint" style="font-size:11.5px;">Protéines / jour — <span style="color:var(--p1);">' + escapeAttr(personName("p1")) + '</span> · <span style="color:var(--p2);">' + escapeAttr(personName("p2")) + '</span></div>' +
          '<div class="chart-wrap">' + renderDualLineChartSvg(proteinP1, proteinP2, "var(--p1)", "var(--p2)", " g") + '</div>';
      } else {
        html += '<div class="faint">Enregistre quelques repas pour voir la tendance.</div>';
      }
    } else {
      var kcalPoints = nutritionTrendPoints(pid, "kcal", 14);
      var proteinPoints = nutritionTrendPoints(pid, "protein", 14);
      if(kcalPoints.some(function(p){ return p.value>0; })){
        html += '<div class="faint" style="font-size:11.5px;">Calories / jour</div>' +
          '<div class="chart-wrap">' + renderLineChartSvg(kcalPoints, " kcal") + '</div>' +
          '<div class="faint" style="font-size:11.5px;">Protéines / jour</div>' +
          '<div class="chart-wrap">' + renderLineChartSvg(proteinPoints, " g") + '</div>';
      } else {
        html += '<div class="faint">Enregistre quelques repas pour voir la tendance.</div>';
      }
    }

    html += '<div class="section-title">Mes plats</div>';
    var sortedDishes = state.dishes.slice().sort(function(a,b){ return dishTagRank(a.tag) - dishTagRank(b.tag); });
    if(state.dishes.length){
      var tags = sortedDishes.reduce(function(acc,d){ if(d.tag && acc.indexOf(d.tag)===-1) acc.push(d.tag); return acc; }, []);
      html += '<input type="text" id="dish-search" placeholder="Rechercher un plat…" value="' + escapeAttr(dishSearch) + '" style="width:100%;">';
      if(tags.length){
        html += '<div class="pill-group scroll" style="margin-top:8px;">' +
          '<button class="pill neutral' + (dishTagFilter==="all"?" active":"") + '" type="button" data-dish-tag-filter="all">Tous</button>' +
          tags.map(function(t){
            return '<button class="pill neutral' + (dishTagFilter===t?" active":"") + '" type="button" data-dish-tag-filter="' + escapeAttr(t) + '">' + escapeAttr(t) + '</button>';
          }).join("") +
        '</div>';
      }
    }
    html += '<button class="btn btn-line btn-block" type="button" id="new-dish-btn" style="margin-top:8px;">+ Nouveau plat</button>';
    if(state.dishes.length){
      // Composite dishes ("plats") get the bigger 2-up grid card, with room for a photo —
      // simple foods (fruit, produit, viande...) stay in the compact single-line list below.
      var compositeDishes = sortedDishes.filter(function(d){ return d.basis === "composite"; });
      var otherDishes = sortedDishes.filter(function(d){ return d.basis !== "composite"; });

      if(compositeDishes.length){
        html += '<div class="dish-grid" id="dish-grid-plats">' + compositeDishes.map(function(d){
          var t = compositeDefaultTotal(d);
          var meta = Math.round(t.kcal) + ' kcal · ' + Math.round(t.protein) + ' g prot.';
          return '<div class="card dish-card-big" data-dish-card="' + d.id + '" data-dish-name="' + escapeAttr(d.name.toLowerCase()) + '" data-dish-tag="' + escapeAttr(d.tag||"") + '">' +
            (d.photoThumb ? '<img class="thumb" src="' + d.photoThumb + '">' : '') +
            '<div class="body">' +
              '<div class="name">' + escapeAttr(d.name) + '</div>' +
              '<div class="faint meta">' + meta + '</div>' +
            '</div>' +
          '</div>';
        }).join("") + '</div>';
      }

      if(otherDishes.length){
        html += '<div class="stack" style="gap:8px; margin-top:' + (compositeDishes.length?"8px":"0") + ';">' + otherDishes.map(function(d){
          var unitLabel = d.basis === "100g" ? "/ 100g" : "/ portion";
          var summary = Math.round(d.kcal) + ' kcal · ' + Math.round(d.protein) + ' g prot. ' + unitLabel;
          if(d.tag) summary += ' · ' + escapeAttr(d.tag);
          return '<div class="card" style="padding:12px 14px; cursor:pointer;" data-dish-card="' + d.id + '" data-dish-name="' + escapeAttr(d.name.toLowerCase()) + '" data-dish-tag="' + escapeAttr(d.tag||"") + '">' +
            '<div class="row" style="align-items:center; gap:10px;">' +
              (d.photoThumb ? '<img src="' + d.photoThumb + '" style="width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0;">' : '') +
              '<div style="flex:1; min-width:0;"><div style="font-weight:600; font-size:13.5px;">' + escapeAttr(d.name) + '</div>' +
              '<div class="faint" style="font-size:11.5px;">' + summary + '</div></div>' +
            '</div>' +
          '</div>';
        }).join("") + '</div>';
      }
      html += '<div class="empty" id="dish-empty-filtered" hidden>Aucun plat ne correspond à ta recherche.</div>';
    } else {
      html += '<div class="empty">Aucun plat enregistré — ajoute tes plats habituels pour les logger en un tap.</div>';
    }
    html += '</div>';
    $view.innerHTML = html;

    $view.querySelectorAll("[data-person-select]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.currentPerson = btn.getAttribute("data-person-select"); save(); renderNutrition(); });
    });
    $view.querySelectorAll("[data-period-select]").forEach(function(btn){
      btn.addEventListener("click", function(){ nutritionPeriod = btn.getAttribute("data-period-select"); renderNutrition(); });
    });
    document.getElementById("nutri-day-prev").addEventListener("click", function(){
      nutritionViewDate = shiftPeriod(nutritionPeriod, nutritionViewDate, -1); renderNutrition();
    });
    var nextBtn = document.getElementById("nutri-day-next");
    if(!isCurrentP) nextBtn.addEventListener("click", function(){
      nutritionViewDate = shiftPeriod(nutritionPeriod, nutritionViewDate, 1); renderNutrition();
    });
    $view.querySelectorAll("[data-edit-food]").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        openEditFoodEntryModal(btn.getAttribute("data-edit-food"));
      });
    });
    $view.querySelectorAll("[data-del-food]").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var id = btn.getAttribute("data-del-food");
        state.foodLog = state.foodLog.filter(function(e){ return e.id !== id; });
        save(); renderNutrition();
      });
    });
    document.getElementById("new-dish-btn").addEventListener("click", function(){ openDishModal(); });
    // No permanent delete button on a dish card — a quick tap logs it, holding it down for
    // 4s (attachLongPress) asks to delete instead. The click handler has to ignore the click
    // that follows a long-press release, or logging would fire right after confirming delete.
    $view.querySelectorAll("[data-dish-card]").forEach(function(card){
      card.addEventListener("click", function(){
        if(card._longPressFired){ card._longPressFired = false; return; }
        openLogDishModal(card.getAttribute("data-dish-card"));
      });
      attachLongPress(card, function(){
        var id = card.getAttribute("data-dish-card");
        var dish = state.dishes.find(function(d){ return d.id === id; });
        if(!dish) return;
        showConfirm("Supprimer « " + dish.name + " » ?", "Il sera retiré de tes plats — les entrées déjà enregistrées dans ton journal ne changent pas.", "Supprimer", function(){
          state.dishes = state.dishes.filter(function(d){ return d.id !== id; });
          save(); renderNutrition();
        }, true);
      }, 4000);
    });

    // Filtering the catalog happens in-place (show/hide already-rendered cards) rather than
    // through a full renderNutrition() — re-rendering on every keystroke would rebuild
    // #dish-search itself and drop focus/cursor position mid-typing.
    function filterDishCards(){
      var q = dishSearch.toLowerCase();
      var anyVisible = false;
      $view.querySelectorAll("[data-dish-card]").forEach(function(card){
        var matches = (!q || card.getAttribute("data-dish-name").indexOf(q)!==-1) &&
          (dishTagFilter==="all" || card.getAttribute("data-dish-tag")===dishTagFilter);
        card.style.display = matches ? "" : "none";
        if(matches) anyVisible = true;
      });
      var emptyEl = document.getElementById("dish-empty-filtered");
      if(emptyEl) emptyEl.hidden = anyVisible;
    }
    var searchInput = document.getElementById("dish-search");
    if(searchInput) searchInput.addEventListener("input", function(){ dishSearch = this.value; filterDishCards(); });
    $view.querySelectorAll("[data-dish-tag-filter]").forEach(function(btn){
      btn.addEventListener("click", function(){
        dishTagFilter = btn.getAttribute("data-dish-tag-filter");
        $view.querySelectorAll("[data-dish-tag-filter]").forEach(function(b){ b.classList.toggle("active", b===btn); });
        filterDishCards();
      });
    });
    filterDishCards();
  }

  // Downscales+recompresses an uploaded/captured photo client-side before it ever touches
  // localStorage — an uncompressed phone photo (several MB) would blow through the ~5-10MB
  // localStorage quota after just a handful of dishes; a small JPEG thumbnail keeps years of
  // cards affordable.
  function compressImageToThumb(file, maxSize, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = function(){};
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // Add-or-edit form for a meal card. Pass an existing dish's id to edit it in place; omit it
  // to create a new one.
  // Add-or-edit form for a meal card. Three shapes: "portion" (fixed serving) and "100g"
  // (scaled by grams eaten) are a single flat kcal/protein/carbs/fat; "composite" is a plate
  // built from several ingredients (e.g. riz/poulet/brocolis), each with its own per-100g
  // values and a default gram quantity — there's no single flat macro for the dish itself,
  // only a total computed from its ingredients (see compositeDefaultTotal, and
  // openLogCompositeDishModal for how logging lets you adjust those grams).
  function openDishModal(dishId){
    var existing = dishId ? state.dishes.find(function(d){ return d.id === dishId; }) : null;
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    var photoThumb = existing ? existing.photoThumb : null;
    var selectedBasis = existing ? existing.basis : "portion";
    var ingredients = (existing && existing.basis === "composite")
      ? JSON.parse(JSON.stringify(existing.ingredients))
      : [{ name:"", kcal:0, protein:0, carbs:0, fat:0, defaultQty:100 }];
    // Top-level fields, tracked outside the DOM the same way `ingredients` is — switching the
    // basis radio (or add/remove-ingredient) rebuilds the whole sheet, and without this
    // whatever you'd already typed into the name/tag/flat-macro fields would be silently
    // discarded the moment you touched anything else.
    var fields = {
      name: existing ? existing.name : "",
      tag: existing ? (existing.tag||"") : "",
      unit: existing && existing.basis!=="composite" ? (existing.unit||"") : "",
      kcal: existing && existing.basis!=="composite" ? existing.kcal : "",
      protein: existing && existing.basis!=="composite" ? existing.protein : "",
      carbs: existing && existing.basis!=="composite" && existing.carbs!=null ? existing.carbs : "",
      fat: existing && existing.basis!=="composite" && existing.fat!=null ? existing.fat : ""
    };

    // Pulls whatever's currently on screen back into `fields`/`ingredients` before a
    // re-render (add row / remove row / switch basis) would otherwise throw those
    // in-progress edits away.
    function syncFormToLocals(){
      var nameEl = document.getElementById("dish-name"); if(nameEl) fields.name = nameEl.value;
      var tagEl = document.getElementById("dish-tag"); if(tagEl) fields.tag = tagEl.value;
      var unitEl = document.getElementById("dish-unit"); if(unitEl) fields.unit = unitEl.value;
      ["kcal","protein","carbs","fat"].forEach(function(f){
        var el = document.getElementById("dish-" + f);
        if(el) fields[f] = el.value;
      });
      ingredients.forEach(function(ing, i){
        var ingNameEl = sheet.querySelector('[data-ing-name="' + i + '"]');
        if(ingNameEl) ing.name = ingNameEl.value;
        ["kcal","protein","carbs","fat"].forEach(function(f){
          var el = sheet.querySelector('[data-ing-' + f + '="' + i + '"]');
          if(el) ing[f] = parseFloat(el.value) || 0;
        });
        var qtyEl = sheet.querySelector('[data-ing-qty="' + i + '"]');
        if(qtyEl) ing.defaultQty = parseFloat(qtyEl.value) || 0;
      });
    }

    function renderForm(){
      var html = '<h2 class="disp">' + (existing ? "Modifier le plat" : "Nouveau plat") + '</h2>' +
        '<div class="stack" style="gap:10px; margin-bottom:18px;">' +
          '<input type="text" id="dish-name" placeholder="Nom du plat" value="' + escapeAttr(fields.name) + '" style="width:100%;">' +
          '<div class="row" style="gap:14px; font-size:12.5px; flex-wrap:wrap;">' +
            '<label class="row" style="gap:5px;"><input type="radio" name="dish-basis" value="portion" ' + (selectedBasis==="portion"?"checked":"") + '> Par portion</label>' +
            '<label class="row" style="gap:5px;"><input type="radio" name="dish-basis" value="100g" ' + (selectedBasis==="100g"?"checked":"") + '> Pour 100g</label>' +
            '<label class="row" style="gap:5px;"><input type="radio" name="dish-basis" value="composite" ' + (selectedBasis==="composite"?"checked":"") + '> Plusieurs ingrédients</label>' +
          '</div>';

      if(selectedBasis === "composite"){
        html += '<div class="faint" style="font-size:11.5px;">Un plat composé de plusieurs aliments, chacun avec sa propre quantité par défaut (modifiable au moment de logger).</div>';
        ingredients.forEach(function(ing, i){
          html += '<div class="card" style="padding:12px;">' +
            '<div class="row" style="gap:8px; margin-bottom:8px;">' +
              '<input type="text" data-ing-name="' + i + '" value="' + escapeAttr(ing.name) + '" placeholder="Nom de l’ingrédient" style="flex:1;">' +
              '<button class="icon-btn" type="button" data-remove-ing="' + i + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
            '</div>' +
            '<div class="row" style="gap:8px; margin-bottom:6px;">' +
              '<input type="number" data-ing-kcal="' + i + '" placeholder="kcal /100g" min="0" step="1" value="' + (ing.kcal||"") + '" style="flex:1;">' +
              '<input type="number" data-ing-protein="' + i + '" placeholder="Protéines /100g" min="0" step="0.1" value="' + (ing.protein||"") + '" style="flex:1;">' +
            '</div>' +
            '<div class="row" style="gap:8px; margin-bottom:6px;">' +
              '<input type="number" data-ing-carbs="' + i + '" placeholder="Glucides /100g" min="0" step="0.1" value="' + (ing.carbs||"") + '" style="flex:1;">' +
              '<input type="number" data-ing-fat="' + i + '" placeholder="Lipides /100g" min="0" step="0.1" value="' + (ing.fat||"") + '" style="flex:1;">' +
            '</div>' +
            '<label class="stack" style="gap:4px;"><span class="faint" style="font-size:11.5px;">Quantité par défaut (g)</span>' +
            '<input type="number" data-ing-qty="' + i + '" min="0" step="10" value="' + (ing.defaultQty||"") + '" style="width:100%;"></label>' +
          '</div>';
        });
        html += '<button class="btn btn-line btn-block" type="button" id="add-ingredient-btn">+ Ajouter un ingrédient</button>';
      } else {
        html += '<input type="text" id="dish-unit" placeholder="Unité si « par portion » (optionnel, ex: œufs, tranches — sinon « portions »)" value="' + escapeAttr(fields.unit) + '" style="width:100%;">' +
          '<div class="row" style="gap:8px;">' +
            '<input type="number" id="dish-kcal" placeholder="kcal" min="0" step="1" value="' + escapeAttr(fields.kcal) + '" style="flex:1;">' +
            '<input type="number" id="dish-protein" placeholder="Protéines (g)" min="0" step="0.1" value="' + escapeAttr(fields.protein) + '" style="flex:1;">' +
          '</div>' +
          '<div class="row" style="gap:8px;">' +
            '<input type="number" id="dish-carbs" placeholder="Glucides (g, optionnel)" min="0" step="0.1" value="' + escapeAttr(fields.carbs) + '" style="flex:1;">' +
            '<input type="number" id="dish-fat" placeholder="Lipides (g, optionnel)" min="0" step="0.1" value="' + escapeAttr(fields.fat) + '" style="flex:1;">' +
          '</div>';
      }

      html += '<input type="text" id="dish-tag" placeholder="Tag (maison, resto, produit... optionnel)" value="' + escapeAttr(fields.tag) + '" style="width:100%;">' +
          '<label class="stack" style="gap:6px;"><span class="faint" style="font-size:12.5px;">Photo (optionnel)</span>' +
          '<input type="file" id="dish-photo" accept="image/*" capture="environment"></label>' +
          '<img id="dish-photo-preview" src="' + (photoThumb||"") + '" style="' + (photoThumb?"":"display:none;") + ' width:100%; max-height:160px; object-fit:cover; border-radius:12px;">' +
        '</div>' +
        '<div class="row" style="gap:10px;">' +
          '<button class="btn btn-ghost btn-block" id="dish-cancel">Annuler</button>' +
          '<button class="btn btn-accent btn-block" id="dish-confirm">' + (existing ? "Enregistrer" : "Ajouter") + '</button>' +
        '</div>';
      sheet.innerHTML = html;

      sheet.querySelectorAll('input[name="dish-basis"]').forEach(function(radio){
        radio.addEventListener("change", function(){
          syncFormToLocals();
          selectedBasis = this.value;
          if(selectedBasis === "composite" && !ingredients.length){
            ingredients.push({ name:"", kcal:0, protein:0, carbs:0, fat:0, defaultQty:100 });
          }
          renderForm();
        });
      });
      document.getElementById("dish-photo").addEventListener("change", function(ev){
        var file = ev.target.files[0]; if(!file) return;
        compressImageToThumb(file, 160, function(dataUrl){
          photoThumb = dataUrl;
          var img = document.getElementById("dish-photo-preview");
          img.src = dataUrl; img.style.display = "block";
        });
      });
      document.getElementById("dish-cancel").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
      if(selectedBasis === "composite"){
        sheet.querySelectorAll("[data-remove-ing]").forEach(function(btn){
          btn.addEventListener("click", function(){
            syncFormToLocals();
            ingredients.splice(+btn.getAttribute("data-remove-ing"), 1);
            renderForm();
          });
        });
        document.getElementById("add-ingredient-btn").addEventListener("click", function(){
          syncFormToLocals();
          ingredients.push({ name:"", kcal:0, protein:0, carbs:0, fat:0, defaultQty:100 });
          renderForm();
        });
      }
      document.getElementById("dish-confirm").addEventListener("click", function(){
        syncFormToLocals();
        var name = fields.name.trim();
        if(!name){ showAlert("Donne un nom au plat."); return; }
        var tag = fields.tag.trim();
        var dish = existing || { id: uid(), createdAt: new Date().toISOString() };

        if(selectedBasis === "composite"){
          var cleanIngredients = ingredients.filter(function(ing){ return ing.name && ing.name.trim(); });
          if(!cleanIngredients.length){ showAlert("Ajoute au moins un ingrédient nommé."); return; }
          dish.basis = "composite"; dish.ingredients = cleanIngredients;
          delete dish.kcal; delete dish.protein; delete dish.carbs; delete dish.fat; delete dish.unit;
        } else {
          var kcal = parseFloat(fields.kcal);
          var protein = parseFloat(fields.protein);
          if(!isFinite(kcal) || !isFinite(protein)){ showAlert("Renseigne au moins les calories et les protéines."); return; }
          var carbsVal = parseFloat(fields.carbs);
          var fatVal = parseFloat(fields.fat);
          var unit = fields.unit.trim();
          dish.basis = selectedBasis; dish.kcal = kcal; dish.protein = protein;
          dish.carbs = isFinite(carbsVal) ? carbsVal : null;
          dish.fat = isFinite(fatVal) ? fatVal : null;
          dish.unit = unit || null;
          delete dish.ingredients;
        }
        dish.name = name; dish.tag = tag; dish.photoThumb = photoThumb;
        // Marks a hand-edited card so a future basic-foods refresh (migrateBasicFoods) never
        // overwrites your own numbers — same _custom convention as edited exercises.
        if(existing) dish._custom = true;
        if(!existing) state.dishes.push(dish);
        save();
        closeOverlay(overlay, sheet);
        renderNutrition();
      });
    }

    overlay.classList.add("show");
    renderForm();
  }

  // Shared by openLogDishModal and openLogCompositeDishModal: steppers ("+"/"-") on every
  // qty field instead of having to type, and a checkbox per person so unchecking one hands
  // their share to whoever's left checked (rather than leaving it split 50/50 with someone
  // who didn't actually eat any). `sheet` must already contain #log-qty-total, one
  // .log-qty-person + .log-qty-check pair per person (same data-person value), and stepper
  // buttons tagged data-qty-target ("total" or a person id) + data-qty-step (the signed delta).
  function wireQtySplit(sheet, totalInput, people, onChange){
    var rows = people.map(function(pl){
      return {
        pid: pl.id,
        checkbox: sheet.querySelector('.log-qty-check[data-person="' + pl.id + '"]'),
        input: sheet.querySelector('.log-qty-person[data-person="' + pl.id + '"]')
      };
    });
    function checkedRows(){ return rows.filter(function(r){ return r.checkbox.checked; }); }
    function setRowEnabled(r){
      r.input.disabled = !r.checkbox.checked;
      r.input.style.opacity = r.checkbox.checked ? "1" : ".4";
      sheet.querySelectorAll('[data-qty-target="' + r.pid + '"]').forEach(function(btn){
        btn.disabled = !r.checkbox.checked;
        btn.style.opacity = r.checkbox.checked ? "1" : ".3";
      });
    }
    // Split `total` evenly across whoever's still checked; anyone unchecked gets 0 — this is
    // what turns "décoche Am" into "Jab prend 100% du total" instead of staying at 50/50.
    function distributeTotal(total){
      var checked = checkedRows();
      rows.forEach(function(r){
        r.input.value = r.checkbox.checked ? round1(checked.length ? total/checked.length : 0) : 0;
      });
    }
    function syncTotalFromPersons(){
      totalInput.value = round1(rows.reduce(function(a,r){ return a + (parseFloat(r.input.value)||0); }, 0));
    }
    totalInput.addEventListener("input", function(){
      distributeTotal(parseFloat(this.value)||0);
      onChange();
    });
    rows.forEach(function(r){
      setRowEnabled(r);
      r.input.addEventListener("input", function(){ syncTotalFromPersons(); onChange(); });
      r.checkbox.addEventListener("change", function(){
        setRowEnabled(r);
        distributeTotal(parseFloat(totalInput.value)||0);
        onChange();
      });
    });
    var stepperSelector = '[data-qty-target="total"]' + rows.map(function(r){ return ', [data-qty-target="' + r.pid + '"]'; }).join("");
    sheet.querySelectorAll(stepperSelector).forEach(function(btn){
      btn.addEventListener("click", function(){
        var delta = parseFloat(btn.getAttribute("data-qty-step"));
        var target = btn.getAttribute("data-qty-target");
        if(target === "total"){
          totalInput.value = round1(Math.max(0, (parseFloat(totalInput.value)||0) + delta));
          distributeTotal(parseFloat(totalInput.value)||0);
        } else {
          var row = rows.filter(function(r){ return r.pid === target; })[0];
          if(!row || row.input.disabled) return;
          row.input.value = round1(Math.max(0, (parseFloat(row.input.value)||0) + delta));
          syncTotalFromPersons();
        }
        onChange();
      });
    });
  }
  function qtyStepperHtml(target, step, inputAttrs, value){
    return '<div class="stepper">' +
      '<button type="button" data-qty-target="' + target + '" data-qty-step="-' + step + '">−</button>' +
      '<input type="number" ' + inputAttrs + ' min="0" step="' + step + '" value="' + value + '">' +
      '<button type="button" data-qty-target="' + target + '" data-qty-step="' + step + '">+</button>' +
    '</div>';
  }

  // Logs a quantity of an existing dish into today's food diary for the current person —
  // scales the card's per-portion or per-100g macros by the quantity entered, and snapshots
  // the result (see the NUTRITION LOG comment above for why it's a snapshot, not a reference).
  // You often eat the same dish together, so this logs for both of you in one go rather than
  // making you repeat the whole flow per person. "Quantité globale" is a convenience that
  // fills the two per-person fields 50/50 — editing either person's field afterward (uneven
  // split, or only one of you actually had it) updates the total to match, never the other
  // way round. Unchecking someone (see wireQtySplit) hands their share to whoever's left
  // checked instead of leaving the total half-eaten by nobody. A person left at 0 (or
  // unchecked) simply gets no entry.
  function openLogDishModal(dishId){
    var dish = state.dishes.find(function(d){ return d.id === dishId; });
    if(!dish) return;
    if(dish.basis === "composite") return openLogCompositeDishModal(dishId);
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    var isGrams = dish.basis === "100g";
    var unitLabel = isGrams ? "grammes" : (dish.unit || "portions");
    var defaultTotal = isGrams ? 100 : 1;
    var step = isGrams ? 10 : 0.5;
    var selectedMeal = guessMealForNow();
    var people = state.people;

    sheet.innerHTML = '<h2 class="disp">' + escapeAttr(dish.name) + '</h2>' +
      '<div class="stack" style="gap:10px; margin-bottom:18px;">' +
        '<div class="row" style="gap:10px; align-items:center;">' +
          '<span class="faint" style="font-size:12.5px; flex:1; min-width:0;">Quantité globale (' + unitLabel + ')</span>' +
          '<div style="width:150px; flex-shrink:0;">' + qtyStepperHtml("total", step, 'id="log-qty-total"', defaultTotal) + '</div>' +
        '</div>' +
        '<div class="row" style="gap:8px;">' + people.map(function(pl){
          return '<div class="stack" style="gap:4px; flex:1;">' +
            '<label class="row" style="gap:6px; align-items:center;">' +
              '<input type="checkbox" class="log-qty-check" data-person="' + pl.id + '" checked style="width:15px;height:15px; accent-color:var(--accent); flex-shrink:0;">' +
              '<span class="faint" style="font-size:12.5px;">' + escapeAttr(pl.name) + '</span>' +
            '</label>' +
            qtyStepperHtml(pl.id, step, 'class="log-qty-person" data-person="' + pl.id + '"', round1(defaultTotal/people.length)) +
          '</div>';
        }).join("") + '</div>' +
        '<div class="faint" id="log-qty-preview"></div>' +
        '<div class="pill-group">' + Object.keys(MEALS).map(function(mk){
          return '<button class="pill neutral' + (mk===selectedMeal?" active":"") + '" type="button" data-meal-pick="' + mk + '">' + MEALS[mk] + '</button>';
        }).join("") + '</div>' +
        '<button class="btn btn-ghost btn-sm" type="button" id="edit-dish-from-log" style="align-self:flex-start;">Modifier ce plat</button>' +
      '</div>' +
      '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="log-qty-cancel">Annuler</button>' +
        '<button class="btn btn-accent btn-block" id="log-qty-confirm">Ajouter</button>' +
      '</div>';
    overlay.classList.add("show");

    var totalInput = document.getElementById("log-qty-total");
    var personInputs = Array.prototype.slice.call(sheet.querySelectorAll(".log-qty-person"));
    function scaleFor(qty){ return isGrams ? qty/100 : qty; }
    function updatePreview(){
      var lines = personInputs.map(function(inp){
        var qty = parseFloat(inp.value) || 0;
        if(qty <= 0) return null;
        var scale = scaleFor(qty);
        return escapeAttr(personName(inp.getAttribute("data-person"))) + " : " + Math.round(dish.kcal*scale) + " kcal · " + Math.round(dish.protein*scale) + " g prot.";
      }).filter(Boolean);
      document.getElementById("log-qty-preview").innerHTML = lines.length ? lines.join("<br>") : "Renseigne une quantité pour au moins une personne.";
    }
    wireQtySplit(sheet, totalInput, people, updatePreview);
    updatePreview();
    sheet.querySelectorAll("[data-meal-pick]").forEach(function(btn){
      btn.addEventListener("click", function(){
        selectedMeal = btn.getAttribute("data-meal-pick");
        sheet.querySelectorAll("[data-meal-pick]").forEach(function(b){ b.classList.toggle("active", b===btn); });
      });
    });
    document.getElementById("log-qty-cancel").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
    document.getElementById("edit-dish-from-log").addEventListener("click", function(){ openDishModal(dishId); });
    document.getElementById("log-qty-confirm").addEventListener("click", function(){
      var entryDate = nutritionEntryDate();
      var any = false;
      personInputs.forEach(function(inp){
        var qty = parseFloat(inp.value) || 0;
        if(qty <= 0) return;
        any = true;
        var scale = scaleFor(qty);
        state.foodLog.push({
          id: uid(), personId: inp.getAttribute("data-person"), date: entryDate.toISOString(), meal: selectedMeal,
          dishId: dish.id, dishName: dish.name, quantity: qty, unit: unitLabel,
          kcal: dish.kcal*scale, protein: dish.protein*scale,
          carbs: dish.carbs!=null ? dish.carbs*scale : null, fat: dish.fat!=null ? dish.fat*scale : null
        });
      });
      if(!any){ showAlert("Renseigne une quantité pour au moins une personne."); return; }
      save();
      closeOverlay(overlay, sheet);
      renderNutrition();
    });
  }

  // Composite dishes (several ingredients, e.g. riz/poulet/brocolis) don't have a single
  // per-unit kcal to scale — each ingredient has its own per-100g values and a default gram
  // quantity instead. This lets you adjust those grams (defaults pre-filled from the dish),
  // computes the resulting plate total live, then hands off into the exact same quantité
  // globale/Am/Jab split as any other dish — from that point on it behaves like a "per
  // portion" log where 1 portion is this specific plate as just adjusted.
  function openLogCompositeDishModal(dishId){
    var dish = state.dishes.find(function(d){ return d.id === dishId; });
    if(!dish) return;
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    var selectedMeal = guessMealForNow();
    var people = state.people;

    sheet.innerHTML = '<h2 class="disp">' + escapeAttr(dish.name) + '</h2>' +
      '<div class="stack" style="gap:10px; margin-bottom:18px;">' +
        // Repliée par défaut : les quantités par défaut suffisent la plupart du temps, et les
        // dérouler à chaque log rendait l'écran "trop chargé" (retour utilisateur) — seul le
        // total de l'assiette reste visible tant qu'on ne va pas les ajuster.
        '<button class="workout-toggle" type="button" id="ing-toggle">' +
          '<span class="faint" style="font-size:12.5px;">Ajuster les ingrédients</span>' +
          '<span class="chevron"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>' +
        '</button>' +
        '<div class="stack" id="ing-list" style="gap:8px;" hidden>' +
        dish.ingredients.map(function(ing, i){
          return '<div class="row" style="gap:10px; align-items:center;">' +
            '<span class="faint" style="font-size:12.5px; flex:1; min-width:0;">' + escapeAttr(ing.name) + ' (g)</span>' +
            '<div style="width:150px; flex-shrink:0;">' + qtyStepperHtml("ing" + i, 10, 'class="ing-qty-input" data-ing="' + i + '"', ing.defaultQty) + '</div>' +
          '</div>';
        }).join("") +
        '</div>' +
        '<div class="card" style="padding:10px 14px;"><div class="faint" style="font-size:11.5px;">Total de l’assiette (aux quantités ci-dessus)</div>' +
        '<div id="composite-total" style="font-weight:700;"></div></div>' +
        '<div class="row" style="gap:10px; align-items:center;">' +
          '<span class="faint" style="font-size:12.5px; flex:1; min-width:0;">Quantité globale (portions)</span>' +
          '<div style="width:150px; flex-shrink:0;">' + qtyStepperHtml("total", 0.5, 'id="log-qty-total"', 1) + '</div>' +
        '</div>' +
        '<div class="row" style="gap:8px;">' + people.map(function(pl){
          return '<div class="stack" style="gap:4px; flex:1;">' +
            '<label class="row" style="gap:6px; align-items:center;">' +
              '<input type="checkbox" class="log-qty-check" data-person="' + pl.id + '" checked style="width:15px;height:15px; accent-color:var(--accent); flex-shrink:0;">' +
              '<span class="faint" style="font-size:12.5px;">' + escapeAttr(pl.name) + '</span>' +
            '</label>' +
            qtyStepperHtml(pl.id, 0.5, 'class="log-qty-person" data-person="' + pl.id + '"', round1(1/people.length)) +
          '</div>';
        }).join("") + '</div>' +
        '<div class="faint" id="log-qty-preview"></div>' +
        '<div class="pill-group">' + Object.keys(MEALS).map(function(mk){
          return '<button class="pill neutral' + (mk===selectedMeal?" active":"") + '" type="button" data-meal-pick="' + mk + '">' + MEALS[mk] + '</button>';
        }).join("") + '</div>' +
        '<button class="btn btn-ghost btn-sm" type="button" id="edit-dish-from-log" style="align-self:flex-start;">Modifier ce plat</button>' +
      '</div>' +
      '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="log-qty-cancel">Annuler</button>' +
        '<button class="btn btn-accent btn-block" id="log-qty-confirm">Ajouter</button>' +
      '</div>';
    overlay.classList.add("show");

    document.getElementById("ing-toggle").addEventListener("click", function(){
      var list = document.getElementById("ing-list");
      list.hidden = !list.hidden;
      this.querySelector(".chevron").classList.toggle("open", !list.hidden);
    });

    var ingInputs = Array.prototype.slice.call(sheet.querySelectorAll(".ing-qty-input"));
    var totalInput = document.getElementById("log-qty-total");
    var personInputs = Array.prototype.slice.call(sheet.querySelectorAll(".log-qty-person"));

    function computeTotal(){
      var t = { kcal:0, protein:0, carbs:0, fat:0 };
      ingInputs.forEach(function(inp){
        var ing = dish.ingredients[+inp.getAttribute("data-ing")];
        var scale = (parseFloat(inp.value)||0) / 100;
        t.kcal += ing.kcal*scale; t.protein += ing.protein*scale;
        t.carbs += (ing.carbs||0)*scale; t.fat += (ing.fat||0)*scale;
      });
      return t;
    }
    function updatePreview(){
      var total = computeTotal();
      document.getElementById("composite-total").textContent = Math.round(total.kcal) + " kcal · " + Math.round(total.protein) + " g prot.";
      var lines = personInputs.map(function(inp){
        var qty = parseFloat(inp.value) || 0;
        if(qty <= 0) return null;
        return escapeAttr(personName(inp.getAttribute("data-person"))) + " : " + Math.round(total.kcal*qty) + " kcal · " + Math.round(total.protein*qty) + " g prot.";
      }).filter(Boolean);
      document.getElementById("log-qty-preview").innerHTML = lines.length ? lines.join("<br>") : "Renseigne une quantité pour au moins une personne.";
    }
    ingInputs.forEach(function(inp){ inp.addEventListener("input", updatePreview); });
    sheet.querySelectorAll('[data-qty-target^="ing"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var target = btn.getAttribute("data-qty-target");
        var inp = ingInputs.filter(function(i){ return "ing" + i.getAttribute("data-ing") === target; })[0];
        if(!inp) return;
        inp.value = round1(Math.max(0, (parseFloat(inp.value)||0) + parseFloat(btn.getAttribute("data-qty-step"))));
        updatePreview();
      });
    });
    wireQtySplit(sheet, totalInput, people, updatePreview);
    updatePreview();

    sheet.querySelectorAll("[data-meal-pick]").forEach(function(btn){
      btn.addEventListener("click", function(){
        selectedMeal = btn.getAttribute("data-meal-pick");
        sheet.querySelectorAll("[data-meal-pick]").forEach(function(b){ b.classList.toggle("active", b===btn); });
      });
    });
    document.getElementById("log-qty-cancel").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
    document.getElementById("edit-dish-from-log").addEventListener("click", function(){ openDishModal(dishId); });
    document.getElementById("log-qty-confirm").addEventListener("click", function(){
      var total = computeTotal();
      var entryDate = nutritionEntryDate();
      var any = false;
      personInputs.forEach(function(inp){
        var qty = parseFloat(inp.value) || 0;
        if(qty <= 0) return;
        any = true;
        state.foodLog.push({
          id: uid(), personId: inp.getAttribute("data-person"), date: entryDate.toISOString(), meal: selectedMeal,
          dishId: dish.id, dishName: dish.name, quantity: qty, unit: "portions",
          kcal: total.kcal*qty, protein: total.protein*qty, carbs: total.carbs*qty, fat: total.fat*qty
        });
      });
      if(!any){ showAlert("Renseigne une quantité pour au moins une personne."); return; }
      save();
      closeOverlay(overlay, sheet);
      renderNutrition();
    });
  }

  // Corrects an already-logged entry (wrong quantity, wrong meal, a typo'd value...) in place
  // — the entry itself stays the source of truth (see the NUTRITION LOG comment above), this
  // just edits that snapshot directly rather than deleting and re-logging it. When the entry
  // still points at an existing dish (dishId), changing the quantity recalculates kcal/protein
  // from that dish's per-unit values, same as logging fresh — but the fields stay directly
  // editable too, since older entries (or ones whose dish was since deleted) have nothing to
  // recompute from.
  function openEditFoodEntryModal(entryId){
    var entry = state.foodLog.find(function(e){ return e.id === entryId; });
    if(!entry) return;
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    // A composite dish (several ingredients) has no single flat kcal to scale by, so it's
    // treated the same as a deleted/missing dish here: kcal/protein stay directly editable
    // instead of auto-recomputing from a quantity.
    var linkedDish = entry.dishId ? state.dishes.find(function(d){ return d.id === entry.dishId && d.basis !== "composite"; }) : null;
    var isGrams = entry.unit === "grammes";
    var selectedMeal = entry.meal || "collation";

    sheet.innerHTML = '<h2 class="disp">Modifier l’entrée</h2>' +
      '<div class="stack" style="gap:10px; margin-bottom:18px;">' +
        '<input type="text" id="edit-food-name" value="' + escapeAttr(entry.dishName) + '" style="width:100%;">' +
        '<label class="stack" style="gap:4px;"><span class="faint" style="font-size:12.5px;">Quantité (' + entry.unit + ')</span>' +
        '<input type="number" id="edit-food-qty" min="0" step="' + (isGrams?10:0.5) + '" value="' + entry.quantity + '" style="width:100%;"></label>' +
        (linkedDish ? '<div class="faint" style="font-size:11.5px;">Recalculé depuis « ' + escapeAttr(linkedDish.name) + ' » quand tu changes la quantité — modifiable ensuite si besoin.</div>' : '') +
        '<div class="row" style="gap:8px;">' +
          '<input type="number" id="edit-food-kcal" placeholder="kcal" min="0" step="1" value="' + Math.round(entry.kcal) + '" style="flex:1;">' +
          '<input type="number" id="edit-food-protein" placeholder="Protéines (g)" min="0" step="0.1" value="' + round1(entry.protein) + '" style="flex:1;">' +
        '</div>' +
        '<div class="pill-group">' + Object.keys(MEALS).map(function(mk){
          return '<button class="pill neutral' + (mk===selectedMeal?" active":"") + '" type="button" data-meal-pick="' + mk + '">' + MEALS[mk] + '</button>';
        }).join("") + '</div>' +
      '</div>' +
      '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="edit-food-cancel">Annuler</button>' +
        '<button class="btn btn-accent btn-block" id="edit-food-save">Enregistrer</button>' +
      '</div>';
    overlay.classList.add("show");

    sheet.querySelectorAll("[data-meal-pick]").forEach(function(btn){
      btn.addEventListener("click", function(){
        selectedMeal = btn.getAttribute("data-meal-pick");
        sheet.querySelectorAll("[data-meal-pick]").forEach(function(b){ b.classList.toggle("active", b===btn); });
      });
    });
    if(linkedDish){
      document.getElementById("edit-food-qty").addEventListener("input", function(){
        var qty = parseFloat(this.value) || 0;
        var scale = isGrams ? qty/100 : qty;
        document.getElementById("edit-food-kcal").value = Math.round(linkedDish.kcal*scale);
        document.getElementById("edit-food-protein").value = round1(linkedDish.protein*scale);
      });
    }
    document.getElementById("edit-food-cancel").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
    document.getElementById("edit-food-save").addEventListener("click", function(){
      var name = document.getElementById("edit-food-name").value.trim();
      if(!name){ showAlert("Donne un nom à ce plat."); return; }
      var qty = parseFloat(document.getElementById("edit-food-qty").value);
      var kcal = parseFloat(document.getElementById("edit-food-kcal").value);
      var protein = parseFloat(document.getElementById("edit-food-protein").value);
      if(!isFinite(qty) || !isFinite(kcal) || !isFinite(protein)){ showAlert("Renseigne au moins la quantité, les calories et les protéines."); return; }
      entry.dishName = name; entry.quantity = qty; entry.kcal = kcal; entry.protein = protein; entry.meal = selectedMeal;
      if(linkedDish){
        var scale = isGrams ? qty/100 : qty;
        entry.carbs = linkedDish.carbs!=null ? linkedDish.carbs*scale : null;
        entry.fat = linkedDish.fat!=null ? linkedDish.fat*scale : null;
      }
      save();
      closeOverlay(overlay, sheet);
      renderNutrition();
    });
  }

  // ---------- SETTINGS ----------
  var settingsOpen = {}; // which workout accordions are expanded (resets on page reload, that's fine)
  function renderSettings(){
    var html = '<div class="stack enter-anim" style="margin-top:6px;">';
    html += '<div class="card stack">' +
      '<div class="section-title">Couleur d’accent</div>' +
      '<div class="theme-swatches">' + Object.keys(ACCENT_THEMES).map(function(key){
        var t = ACCENT_THEMES[key];
        var active = (state.theme||"orange") === key;
        return '<button class="theme-swatch' + (active?" active":"") + '" data-theme-pick="' + key + '" style="background:' + t.accent + ';" title="' + t.label + '"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></button>';
      }).join("") + '</div>' +
      '<div class="faint">' + escapeAttr((ACCENT_THEMES[state.theme||"orange"]).label) + ' — change ta couleur quand l’humeur te prend.</div>' +
    '</div>';

    html += '<div class="card row between" style="gap:12px;">' +
      '<div><div class="section-title" style="margin:0;">Minuteur de repos</div>' +
      '<div class="faint" style="margin-top:2px;">Durée par défaut entre les séries.</div></div>' +
      '<div class="row" style="gap:4px; flex-shrink:0;">' +
        '<input type="number" id="rest-duration-input" min="10" step="5" value="' + state.restDurationDefault + '" style="width:56px; text-align:center;">' +
        '<span class="muted">sec</span>' +
      '</div>' +

    html += '<div class="card stack" data-workout="vousdeux">' +
      '<button class="workout-toggle" data-toggle-workout="vousdeux" type="button">' +
        '<h3>Vous deux</h3>' +
        '<span class="chevron"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>' +

            '</select></label>' +

              Object.keys(ACTIVITY_LEVELS).map(function(k){

              }).join("") +
            '</select></label>' +
            '<label class="pf-field" style="grid-column:span 3;">Objectif<select data-person-goal="' + pl.id + '">' +
              Object.keys(GOALS).map(function(k){

            '</select></label>' +
          '</div>' +
          '<div class="faint" style="margin-top:6px; font-size:11.5px;">' + (calcBurnGoal(pl.id) ?
            'Objectif calories brûlées : ' + calcBurnGoal(pl.id) + ' kcal/jour, calculé depuis le poids/taille/âge/activité/objectif ci-dessus (visible dans Progrès).' :
            'Renseigne la taille et l’âge ci-dessus pour calculer l’objectif de calories brûlées (visible dans Progrès).') + '</div>' +
        '</div>';
      }).join("") +
      '<div class="faint">Le poids sert à estimer les calories dépensées pendant les séances. Taille + âge + sexe + activité donnent les calories & protéines à viser chaque jour (visible dans Progrès).</div>' +
      '</div>' +
    '</div>';

    html += '<div class="card stack">' +
      '<div class="section-title">Estimation des macros par photo (Nutrition)</div>' +
      '<label class="pf-field">Clé API Gemini<input type="password" id="gemini-key-input" placeholder="Colle ta clé ici" value="' + escapeAttr(state.geminiApiKey||"") + '"></label>' +
      '<div class="faint">Gratuite sur aistudio.google.com/apikey. Reste uniquement sur tes appareils (jamais dans le code de l’app) — pense à la restreindre par "HTTP referrer" à ce site dans Google Cloud Console.</div>' +
    '</div>';

    state.workouts.forEach(function(w){
      // A video course has no exercise list to edit here — the settings accordion for
      // adding/editing exercises would just be a dead end (renderSession() never surfaces
      // them for a video workout), so skip it rather than show an editor that does nothing.
      if(w.type === "video") return;
      // A quicklog activity (Five, Danse...) has nothing to edit either, except the default
      // duration proposed each time you log it — a small inline card instead of the full
      // exercise-editing accordion.
      if(w.type === "quicklog"){
        html += '<div class="card row between" style="gap:12px;">' +
          '<div><div class="row" style="gap:6px; align-items:center;"><div class="section-title" style="margin:0;">' + escapeAttr(w.name) + '</div>' +
            '<button class="icon-btn info-btn" data-edit-muscles="' + w.id + '" type="button" aria-label="Muscles travaillés">' + MUSCLE_BTN_ICON + '</button></div>' +
          '<div class="faint" style="margin-top:2px;">Durée proposée par défaut au moment de logger. La silhouette règle les muscles travaillés.</div></div>' +
          '<div class="row" style="gap:4px; flex-shrink:0;">' +
            '<input type="number" data-quicklog-duration="' + w.id + '" min="1" step="5" value="' + w.defaultDurationMin + '" style="width:56px; text-align:center;">' +
            '<span class="muted">min</span>' +

        '</div>';
        return;
      }
      html += '<div class="card stack" data-workout="' + w.id + '">' +
        '<button class="workout-toggle" data-toggle-workout="' + w.id + '" type="button">' +
          '<h3>' + w.name + '</h3>' +
