<!doctype html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<script>
// Neither 100% nor 100dvh survives Safari's own toolbar hiding/showing reliably on every
// device — dvh is supposed to track it live but doesn't always repaint in time, which is
// what left a blank (black) gap below the tab bar. Measuring the real visible height in JS
// and writing it as a custom property is the classic, reliable fix: it reacts to the same
// events Safari's chrome animation fires, so the app frame is always sized to what's
// actually on screen right now.
//
// Confirmed via on-device measurement: in this standalone (home-screen) PWA, WebKit's
// visualViewport.height/innerHeight under-report the true screen height by exactly the
// top safe-area inset (873px reported vs 932px real, a 59px shortfall == the 59px status
// bar/notch height) even though viewport-fit=cover lets the page paint the FULL screen.
// That's what left a genuine, un-fillable 59px dead strip at the very bottom — no CSS
// margin/padding can reach space our own layout was never told exists. window.screen.height
// is the physical device resolution and isn't affected by this viewport-measurement bug,
// so in standalone mode we use it (whichever is taller) as the source of truth instead.
(function(){
  // Locking/dimming the phone mid-session and coming back can (a) fire a resize event with
  // a bogus transient height while the screen is mid-animation, which then gets baked into
  // --vvh and never gets corrected, silently shrinking the scrollable area, and (b) leave
  // WKWebView's own momentum-scrolling engine "stuck" sluggish on whatever scroll container
  // was active when it got backgrounded — a known WKWebView bug, unrelated to our CSS. A
  // sane-value guard fixes (a); forcing a reflow on the scroll container when the page
  // becomes visible again fixes (b).
  var MIN_VALID_H = 200;
  function setVVH(){
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    if (window.navigator.standalone && window.screen) {
      // window.screen.width/height don't reliably rotate with the device on iOS — confirmed
      // on an iPad in LANDSCAPE, where screen.height stayed pinned at the portrait value
      // (1180) while the real visible height was 820 (the physically SHORTER dimension in
      // landscape). Blindly using screen.height there inflated the page to 1180px tall,
      // pushing the nav bar 327px below the visible 820px window — you had to scroll to
      // reach it. Picking whichever of screen.width/height matches the current orientation
      // (the larger one in portrait, the smaller one in landscape) fixes that on any device.
      // The 150px cap keeps this limited to correcting the known small iPhone shortfall
      // (== the safe-area-inset-top) instead of ever overriding by hundreds of pixels again.
      var landscape = window.innerWidth > window.innerHeight;
      var physical = landscape ? Math.min(window.screen.width, window.screen.height) : Math.max(window.screen.width, window.screen.height);
      if (physical > h && (physical - h) < 150) h = physical;
    }
    if (h < MIN_VALID_H) return; // ignore a bogus mid-transition reading, keep the last good one
    document.documentElement.style.setProperty("--vvh", (h * 0.01) + "px");
  }
  function kickScroll(){
    var el = document.getElementById("view");
    if(!el) return;
    el.style.webkitOverflowScrolling = "auto";
    void el.offsetHeight; // force layout to actually apply the change before flipping it back
    requestAnimationFrame(function(){
      el.style.webkitOverflowScrolling = "touch";
      // The overflow-scrolling toggle above is the original (iOS 8-10 era) fix and is
      // close to a no-op on current iOS — it's the reflow it forces that helps, not the
      // property itself. Nudging scrollTop by a pixel and back is what actually forces
      // WKWebView's separate scrolling thread to resync with the main thread on modern
      // versions, which the toggle alone wasn't reliably doing (see closeOverlay for the
      // video-modal case, where this alone still wasn't enough).
      var prev = el.scrollTop;
      el.scrollTop = prev + 1;
      el.scrollTop = prev;
    });
  }
  function onResume(){
    // The screen doesn't finish settling the instant visibilitychange/pageshow fires, so
    // re-measure a couple of times shortly after rather than trusting the very first tick.
    setVVH(); kickScroll();
    setTimeout(function(){ setVVH(); kickScroll(); }, 60);
    setTimeout(function(){ setVVH(); kickScroll(); }, 350);
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) onResume(); });
  window.addEventListener("pageshow", onResume);
  window.addEventListener("focus", onResume);
  // Exposed so the app script (further down the page) can trigger the same fix after closing
  // the exercise-video modal — playing an inline <video> and dismissing it leaves WKWebView's
  // scroll engine in the exact same "stuck" state as a lock/unlock, but that doesn't fire
  // visibilitychange/pageshow/focus (the page was never actually backgrounded), so nothing
  // above would otherwise catch it.
  window.__kickScrollAfterOverlay = onResume;
  setVVH();
  window.addEventListener("resize", setVVH);
  window.addEventListener("orientationchange", setVVH);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", setVVH);
    window.visualViewport.addEventListener("scroll", setVVH);
  }
})();
</script>

<style>
/* Deliberately dark-only: this is a gym log meant to be read under bad lighting and
   glanced at mid-set, so the palette is fixed regardless of the phone's system theme. */
:root{
  --bg:#0d0f10; --surface:#181d1e; --surface-2:#212728; --surface-3:#2a3132;
  --ink:#f1f4f2; --ink-soft:#9aa4a3; --ink-faint:#616b6a;
  --accent:#ff5a33; --accent-ink:#181005;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
  --accent-dim: color-mix(in srgb, var(--accent) 48%, var(--bg));
  --p1:#e2677c; --p1-soft:#2a1620;
  --p2:#5fb2ea; --p2-soft:#122430;
  --good:#57d68a; --good-soft:#0f2a1c;
  --line:#2a3132; --line-soft:#20262728;
  --shadow: 0 2px 4px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
  /* "liquid glass" surface tokens: translucent panels that let the glowing background
     show through, blurred, with a thin bright rim to catch the light like real glass. */
  --glass-bg: color-mix(in srgb, var(--surface) 62%, transparent);
  --glass-bg-strong: color-mix(in srgb, var(--surface) 78%, transparent);
  --glass-border: rgba(255,255,255,.09);
  --glass-hi: rgba(255,255,255,.14);
  --glass-blur: blur(22px) saturate(170%);
  /* iOS 27 "Liquid Glass - Regular - Small" material, dark mode, as measured from Apple's
     official Figma UI kit (see ios27-design-system project) — used for the floating tab bar,
     which is exactly the "toolbars, tab bars, floating controls" use-case that material spec
     calls out. Much lighter tint + lighter blur than our old hand-tuned --glass-* tokens:
     real Liquid Glass barely tints the surface, the see-through + saturation boost carry it. */
  --ios27-tab-bg: rgba(118,118,128,.16);
  --ios27-tab-blur: blur(4px) saturate(180%);
  --ios27-tab-rim: rgba(230,230,230,.22);
  --ios27-tab-hi: rgba(230,230,230,.5);
  --ios27-tab-lo: rgba(26,26,26,.4);
  --ios27-tab-shadow: 0 8px 20px rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.3);
  /* MOCKUP EXPERIMENT: same material family, "Regular" size (a full sheet, not a compact
     control) — a bit more tint and blur than the tab bar's "Small" variant, which is what
     the real material spec calls for at this size, so text over varied content stays readable. */
  --ios27-sheet-bg: rgba(118,118,128,.20);
  --ios27-sheet-blur: blur(24px) saturate(180%);
}
*{box-sizing:border-box}
/* The claude.ai artifact preview silently injects this reset for us; a plain self-hosted
   page doesn't get it for free. Without it, [hidden] and a class like .stack{display:flex}
   have equal CSS specificity, so the LAST one written wins the cascade regardless of which
   is "more correct" — here that was .stack, which made toggling `hidden` on the workout
   accordion's exercise list a no-op visually (only the chevron icon actually flipped). */
[hidden]{display:none!important;}
button, .card, .ex-card, .workout-tile, .theme-swatch, .icon-btn, .check{ transition:transform .12s ease; }
button:active, .theme-swatch:active, .icon-btn:active{ transform:scale(.93); }
.workout-tile:active{ transform:scale(.97); }
.check:active{ transform:scale(.85); }
@keyframes enterFade{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.enter-anim{ animation:enterFade .32s cubic-bezier(.2,.8,.3,1); }
@media (prefers-reduced-motion: reduce){
  button, .card, .ex-card, .workout-tile, .theme-swatch, .icon-btn, .check{ transition:none; }
  button:active, .theme-swatch:active, .icon-btn:active, .workout-tile:active, .check:active{ transform:none; }
  .enter-anim{ animation:none; }
}
/* Only ONE element paints the app's background: body. Two earlier attempts split the
   gradient across html (for the safe-area strips) AND body, kept in sync only by
   background-attachment:fixed — that mostly lined up, but iOS still rendered a visibly
   flatter, seam-bounded patch in the bottom strip (confirmed by pixel-sampling a real
   screenshot: the safe-area region came out as flat --bg with none of the radial glow,
   while the area just above it clearly had it). Two independently-painted boxes can
   always drift apart like this. The robust fix is to not have two boxes: html carries
   no background and no padding at all, body is sized to the FULL device screen (not to
   html's inset-reduced box) and puts the safe-area insets on its own padding instead —
   so the exact same paint operation that colors the visible content also colors the
   notch and home-indicator strips, with no possible seam. */
html{ color-scheme:dark; }
/* --vvh is set by the inline script in <head> from the real, live visible height (see the
   comment there) — calc() with it is the authoritative value; the 100%/100dvh chain before
   it is only there so the page isn't unstyled for the one frame before that script runs.
   Both html and body now share the same full-device-height sizing (see comment above:
   body owns the background and the safe-area padding, so it has to be exactly as tall as
   html, not merely 100% of a padded box). */
html{ height:100%; height:100dvh; height:calc(var(--vvh, 1vh) * 100); overflow:hidden; }
body{
  height:100%; height:100dvh; height:calc(var(--vvh, 1vh) * 100);
  overflow:hidden; overscroll-behavior:none;
  margin:0; color:var(--ink);
  background:
    radial-gradient(900px circle at 15% -8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 60%),
    radial-gradient(800px circle at 100% 15%, color-mix(in srgb, var(--p2) 16%, transparent), transparent 55%),
    radial-gradient(700px circle at 30% 110%, color-mix(in srgb, var(--good) 10%, transparent), transparent 55%),
    var(--bg);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  /* No padding-bottom here (unlike padding-top above): reserving it as body padding was
     what left a flat, un-blurred dead strip at the very bottom — #view's scrolled content
     never reached into it, unlike iOS's own Réglages, where content visibly continues,
     blurred, all the way to the physical edge behind the home indicator. #app now extends
     the full height instead; nav#tabs/#session-bar each add the safe-area inset to their
     own "bottom" offset below instead, so the pill itself still clears the home indicator
     without capping how far #view's content can reach. */
  padding-left:16px; padding-right:16px;
  display:flex; flex-direction:column;
  -webkit-text-size-adjust:100%;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3,.disp{font-family:"Oswald",system-ui,sans-serif; text-transform:uppercase; letter-spacing:.02em; text-wrap:balance;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
a{color:var(--accent);}

/* #app is the whole screen. #topbar and nav#tabs float as absolutely-positioned overlays
   ON TOP of #view (which fills the full height behind them) rather than being flex siblings
   that just push #view into the remaining space — that's what makes scrolled content visibly
   continue, blurred, underneath them, the way iOS's own Réglages does it. #view's own
   top/bottom padding (--topbar-h/--navbar-h, measured live by syncBarHeights() further down
   the page) reserves just enough room that content starts out below/above the bars, same as
   before, but can then scroll fully behind them.
   Deliberately position:absolute, NOT position:sticky: sticky is what caused the bottom nav
   to vanish entirely when this was tried before on the iPhone home screen — in standalone
   mode the browser's own scroll-position bookkeeping for sticky is unreliable. Absolute
   positioning here is anchored to #app's own box, which doesn't scroll and is already sized
   from the JS-corrected --vvh (not the browser's live/buggy viewport figures), so it isn't
   exposed to that same failure mode. */
#app{
  position:relative;
  height:100%;
  max-width:520px; width:100%; margin:0 auto;
}
/* iPad (and any wider viewport, e.g. a resized iPadOS Split View window): the same
   phone-first layout just centered with a moderately wider column instead of a narrow
   strip lost in a sea of side padding. Deliberately NOT restructuring the grids (workout
   tiles, person columns, stat tiles...) into more columns here — the "last odd tile spans
   full width" logic in renderHome() assumes a 2-column grid, so widening the container is
   the low-risk way to use the extra space without having to touch that logic too. Split
   View/Slide Over at narrower widths than this simply falls back to the phone layout above,
   which is exactly the right behavior already. */
@media (min-width: 700px){
  #app{ max-width:640px; }
}
#topbar{
  position:absolute; top:0; left:0; right:0; z-index:2;
  padding:14px 0 8px;
  /* No background/backdrop-filter here on purpose, after TWO separate on-device rendering
     bugs (a washed-out white/lavender patch, then a solid black band) both traced to giving
     this specific bar a blur right at the safe-area-inset-top boundary — a spot nav#tabs and
     #session-bar never sit near, which is presumably why they never showed either symptom.
     Rather than guess at a third combination of blur/tint values blind, this stays fully
     transparent like the pre-v47 topbar; it still keeps the absolute-overlay positioning
     from v47 (so title text sits above scrolled content instead of pushing it down), just
     without any glass material of its own. */
}
#topbar h1{font-size:21px; margin:0; color:var(--ink); display:flex; align-items:center; gap:9px;}
#topbar h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block; box-shadow:0 0 0 4px var(--accent-soft);}
#resume-banner{
  display:none; align-items:center; gap:10px; color:var(--ink);
  background:color-mix(in srgb, var(--accent) 20%, var(--glass-bg));
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--accent-dim); border-radius:16px; padding:11px 13px; margin-top:10px; font-size:13px;
  box-shadow:inset 0 1px 0 var(--glass-hi); overflow:hidden;
}
#resume-banner.show{display:flex}
#resume-banner b{color:var(--accent)}
#resume-banner button{
  margin-left:auto; background:var(--accent); color:var(--accent-ink); border:none;
  padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; flex-shrink:0;
}

#view{
  position:absolute; top:0; left:0; right:0; bottom:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-top:var(--topbar-h, 64px);
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + var(--navbar-h, 84px) + var(--sessionbar-h, 0px) + 18px);
}

nav#tabs{
  position:absolute; left:0; right:0; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); z-index:2; overflow:hidden;
  /* WebKit doesn't always clip backdrop-filter's blur to border-radius on its own — without
     overflow:hidden here, whatever sits directly behind the bar can bleed through as a
     hard rectangular edge exactly at the rounded corners (confirmed on-device: a stat-tile's
     square corner showing through right at the pill's curve). box-shadow is unaffected by
     overflow:hidden on the element that casts it, so the outer drop shadow below still shows. */
  display:flex; gap:2px;
  background:var(--ios27-tab-bg); backdrop-filter:var(--ios27-tab-blur); -webkit-backdrop-filter:var(--ios27-tab-blur);
  border:1px solid var(--ios27-tab-rim); border-radius:26px;
  box-shadow:var(--ios27-tab-shadow), inset 0 1px 0 var(--ios27-tab-hi), inset 0 -1px 0 var(--ios27-tab-lo);
  padding:6px;
}
/* The floating "glass pill" that slides under whichever tab is active — its own little
   raised capsule of Liquid Glass, tinted with the accent colour and catching light on top,
   the way the selected tab lifts off the bar in Apple's own apps (Music, App Store, ...). */
#tab-highlight{
  position:absolute; top:6px; left:6px; height:calc(100% - 12px); width:0; border-radius:18px;
  /* Neutral "Liquid Glass — Regular Small — Active" material, measured (bg #999 @ .17) —
     no accent tint here, just a brighter, slightly raised patch of the same glass so it
     reads as "this piece of the bar is pressed/lit", not as a coloured badge. */
  background:rgba(153,153,153,.17);
  box-shadow:
    0 4px 14px rgba(0,0,0,.35),
    0 1px 0 rgba(0,0,0,.2),
    inset 0 1px 0 rgba(230,230,230,.45),
    inset 0 -6px 10px -6px rgba(0,0,0,.4);
  border:1px solid rgba(230,230,230,.22);
  transition:transform .38s cubic-bezier(.34,1.28,.64,1), width .38s cubic-bezier(.34,1.28,.64,1), opacity .2s ease;
  opacity:0; pointer-events:none;
}
#tab-highlight.show{opacity:1;}
nav#tabs button{
  position:relative; z-index:1;
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:8px 2px; color:var(--ink-faint); font-size:10.5px; font-weight:500; border-radius:18px;
  transition:color .2s;
}
nav#tabs button svg{width:21px;height:21px;stroke:var(--ink-faint); fill:none; stroke-width:1.8; transition:stroke .2s;}
nav#tabs button.active{color:var(--accent);}
nav#tabs button.active svg{stroke:var(--accent);}

.card{
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:20px; overflow:hidden;
  padding:16px; box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
}

/* "Mes plats" — composite dishes get a bigger 2-up grid card (room for a photo, name always
   at least 2 lines tall) instead of the compact single-line list rows simple foods use. */
.dish-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.dish-card-big{ padding:0; display:flex; flex-direction:column; cursor:pointer; transition:opacity .15s, transform .15s; }
.dish-card-big .thumb{ width:100%; height:168px; object-fit:cover; display:block; }
.dish-card-big .body{ padding:10px 12px; flex:1; display:flex; flex-direction:column; gap:4px; min-height:112px; }
.dish-card-big .name{ font-weight:600; font-size:13px; line-height:1.3; }
.dish-card-big .meta{ font-size:11px; margin-top:auto; }
/* Hold-to-delete feedback (see attachLongPress): the dim+shrink itself takes as long as the
   hold threshold, so releasing early just eases back with nothing having "happened" yet. */
.card.pressing, .dish-card-big.pressing{ transition:opacity 4s linear, transform 4s linear; opacity:.4; transform:scale(.96); }
.stack{display:flex; flex-direction:column; gap:12px;}
.row{display:flex; align-items:center; gap:10px;}
.between{justify-content:space-between;}
.muted{color:var(--ink-soft); font-size:13px;}
.faint{color:var(--ink-faint); font-size:12px;}

.workout-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
.workout-tile{
  grid-column:span 1; background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); overflow:hidden;
  border-radius:22px; padding:22px 14px 18px; box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:5px;
}
.workout-tile.span2{grid-column:1 / -1; flex-direction:row; text-align:left; align-items:center; justify-content:space-between; padding:16px 18px;}
.workout-tile.span2 .wicon{margin-bottom:0;}
.workout-tile.span2 .tinfo{text-align:left; align-items:flex-start;}
.wicon{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); background:color-mix(in srgb, var(--tile-c, var(--accent)) 18%, var(--surface)); margin-bottom:4px; flex-shrink:0;
}
.wicon svg{width:22px; height:22px; stroke:var(--tile-c, var(--accent)); fill:none; stroke-width:1.8;}
.tinfo{display:flex; flex-direction:column; align-items:center; gap:2px;}
.workout-tile .name{font-size:16px; margin:0;}
.workout-tile .meta{font-size:11.5px; color:var(--ink-soft);}
.btn{border:none; border-radius:10px; padding:11px 16px; font-weight:600; font-size:14px;}
.btn-accent{background:var(--accent); color:var(--accent-ink);}
.btn-ghost{
  background:var(--glass-bg); color:var(--ink); border:1px solid var(--glass-border);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); box-shadow:inset 0 1px 0 var(--glass-hi);
  overflow:hidden;
}
.btn-line{background:rgba(255,255,255,.04); border:1px solid var(--glass-border); color:var(--ink);}
.btn-danger{background:#e5484d; color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:7px 10px; font-size:12.5px; border-radius:8px;}
.btn-pill{padding:8px 18px; border-radius:99px; font-size:12.5px; margin-top:8px;}
.btn:disabled{opacity:.45;}

.badge{
  display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 8px;
  border-radius:999px; background:rgba(255,255,255,.08); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;
  border:1px solid var(--glass-border);
}

.pill-group{
  display:flex; gap:6px; padding:4px; border-radius:16px; overflow:hidden;
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
}
/* For a filter row whose pill count isn't fixed (workout types, dish tags) — flex:1 sharing
   the row evenly (the default, right for 2-4 fixed choices like the person or meal picker)
   would instead squeeze every label illegibly, and old overflow:hidden would just clip
   whatever didn't fit. Scrolls horizontally instead, each pill sized to its own label. */
.pill-group.scroll{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.pill-group.scroll::-webkit-scrollbar{ display:none; }
.pill-group.scroll .pill{ flex:0 0 auto; white-space:nowrap; }
.pill{flex:1; text-align:center; padding:9px 6px; border-radius:12px; font-size:13px; font-weight:600; border:none; background:none; color:var(--ink-soft); transition:background .2s, color .2s;}
.pill.active{background:rgba(255,255,255,.1); color:var(--p1); box-shadow:inset 0 1px 0 var(--glass-hi);}
.pill.active.p2{color:var(--p2);}
.pill.active.neutral{color:var(--accent);}

.ex-card{
  border:1px solid var(--glass-border); border-radius:18px; padding:14px; overflow:hidden;
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
}
.ex-card.collapsed{
  display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer;
  background:color-mix(in srgb, var(--good) 16%, var(--glass-bg)); border-color:var(--good);
}
.ex-card.collapsed .done-badge{
  width:24px; height:24px; border-radius:7px; background:var(--good); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ex-card.collapsed .done-badge svg{width:14px; height:14px; stroke:var(--bg); fill:none; stroke-width:3.2;}
.ex-card.collapsed .ex-title{font-size:14px; margin:0;}
.ex-card.collapsed .collapsed-meta{margin-left:auto; font-size:11.5px; color:var(--ink-soft); text-align:right; flex-shrink:0;}
.ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.ex-title{font-weight:600; font-size:15px; line-height:1.3;}
.ex-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.sets-badge{flex-shrink:0; background:rgba(255,255,255,.07); border:1px solid var(--glass-border); border-radius:12px; padding:6px 10px; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
.sets-badge .n{font-family:"IBM Plex Mono"; color:var(--ink);}

.person-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.person-cols.solo{grid-template-columns:1fr; max-width:200px;}
.person-col{
  border:1px solid var(--glass-border); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px;
  background:rgba(0,0,0,.16); transition:border-color .15s, background .15s;
}
.person-col.done{border-color:var(--good); background:var(--good-soft);}
.person-col.skipped{opacity:.55;}
.skipped-note{font-size:12px; color:var(--ink-faint); padding:8px 0; text-align:center; line-height:1.6;}
.skipped-hint{font-size:9.5px; opacity:.7;}
/* Long-press target: no visible affordance at rest — just a barely-there dimming while held,
   so the gesture feels responsive without adding a permanent on-screen button. */
.person-name{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; transition:opacity .15s;}
.person-name.pressing{opacity:.45;}
.ex-card.collapsed.all-skipped{background:var(--glass-bg); border-color:var(--glass-border);}
.ex-card.collapsed.all-skipped .done-badge{background:var(--ink-faint);}
.person-col .phead{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.person-name{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft);}
.person-col.p2 .person-name{color:var(--p2);}
.person-col:not(.p2) .person-name{color:var(--p1);}
.check{
  width:26px; height:26px; border-radius:8px; border:2px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.check svg{width:14px;height:14px; stroke:var(--bg); fill:none; stroke-width:3.2; opacity:0;}
.person-col.done .check{background:var(--good); border-color:var(--good);}
.person-col.done .check svg{opacity:1;}

.stepper{display:flex; align-items:center; border:1px solid var(--glass-border); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.05); width:100%;}
.stepper button{background:none; border:none; width:30px; height:36px; font-size:17px; color:var(--ink-soft); flex-shrink:0;}
.stepper button:active{background:var(--surface-2);}
.stepper button.nudge{
  color:var(--accent); font-weight:700;
  animation:nudgeGlow 2.2s ease-in-out infinite;
}
@keyframes nudgeGlow{
  0%,100%{ text-shadow:0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); transform:scale(1); }
  50%{ text-shadow:0 0 9px color-mix(in srgb, var(--accent) 90%, transparent); transform:scale(1.18); }
}
@media (prefers-reduced-motion: reduce){ .stepper button.nudge{ animation:none; } }
.stepper input{
  width:100%; border:none; background:none; text-align:center; font-size:14px; font-weight:600; color:var(--ink); min-width:0;
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.field-line{display:flex; align-items:center; gap:6px;}
.unit{font-size:10px; color:var(--ink-faint); flex-shrink:0; width:26px;}

#session-bar{
  position:absolute; left:0; right:0; bottom:calc(8px + env(safe-area-inset-bottom, 0px) + var(--navbar-h, 84px) + 10px); z-index:2;
  padding:12px 16px; overflow:hidden;
  /* Its own height (rest-row present or not) feeds --sessionbar-h via syncBarHeights(), which
     is what #view's padding-bottom reserves room for — see the comment on #app. */
  /* MOCKUP EXPERIMENT: the same measured iOS 27 "Regular Small" material as the tab bar,
     instead of the heavier hand-tuned --glass-* tokens — a floating toolbar is exactly
     what that material is specced for. */
  background:var(--ios27-tab-bg); backdrop-filter:var(--ios27-tab-blur); -webkit-backdrop-filter:var(--ios27-tab-blur);
  border:1px solid var(--ios27-tab-rim); border-radius:20px;
  box-shadow:var(--ios27-tab-shadow), inset 0 1px 0 var(--ios27-tab-hi), inset 0 -6px 10px -6px var(--ios27-tab-lo);
  display:flex; flex-direction:column; gap:10px;
}
#session-bar .prog{font-size:12.5px; color:var(--ink-soft); flex-shrink:0;}
#session-bar .time{font-size:12.5px; margin-left:auto; margin-right:2px; color:var(--ink-soft); flex-shrink:0;}
.progress-track{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; flex:1;}
.progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .2s;}
#rest-row{border-top:1px solid var(--glass-border); padding-top:10px;}
#rest-time{font-family:"IBM Plex Mono"; font-size:15px; font-weight:600; min-width:46px; text-align:center;}
#rest-time.done{ color:var(--accent); animation:nudgeGlow 1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ #rest-time.done{ animation:none; } }

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-tile{
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:16px; padding:12px 14px; box-shadow:inset 0 1px 0 var(--glass-hi);
  overflow:hidden;
}
.stat-tile .v{font-family:"IBM Plex Mono"; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat-tile .l{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.hist-item{
  border:1px solid var(--glass-border); border-radius:16px; padding:12px 14px; overflow:hidden;
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.hist-item .top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.hist-item .date{font-weight:600; font-size:14px;}
.hist-detail{margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; display:none; font-size:12.5px; color:var(--ink-soft);}
.hist-detail.show{display:block;}
.hist-detail .exname{font-weight:600; color:var(--ink); margin-top:6px;}
.hist-detail .exname:first-child{margin-top:0;}
.hist-detail .exline{display:flex; justify-content:space-between; padding:2px 0 2px 10px;}

select, input[type=number], input[type=text], input[type=password]{
  background:rgba(255,255,255,.05); border:1px solid var(--glass-border); color:var(--ink); border-radius:10px; padding:9px 10px; font-size:14px;
}

.profile-block{padding:6px 0;}
.profile-block + .profile-block{border-top:1px solid var(--glass-border); margin-top:4px;}
.profile-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px;}
.pf-field{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--ink-soft);}
.pf-field select, .pf-field input{width:100%;}
.profile-block.p2 .section-title, .profile-block.p2 .pf-name{color:var(--p2);}

.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; margin:2px 0 0;}

.chart-wrap{
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:18px; padding:14px 12px 8px; box-shadow:inset 0 1px 0 var(--glass-hi);
  overflow:hidden;
}
svg text{font-family:"IBM Plex Mono",monospace; font-size:9.5px; fill:var(--ink-faint);}

.settings-ex{border:1px solid var(--glass-border); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px; background:rgba(255,255,255,.03);}
.settings-ex .top{display:flex; gap:8px; align-items:center;}
.settings-ex input[type=text]{flex:1; min-width:0;}
.icon-btn{background:rgba(255,255,255,.07); border:none; border-radius:10px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink-soft);}
.icon-btn svg{width:15px;height:15px; stroke:currentColor; fill:none; stroke-width:2;}
.info-btn{width:22px; height:22px; border-radius:50%; flex-shrink:0;}
.info-btn svg{width:13px; height:13px;}
.def-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.def-cell{border:1px solid var(--glass-border); border-radius:10px; padding:6px 8px; display:flex; flex-direction:column; gap:4px; background:rgba(0,0,0,.15);}
.def-cell .pname{font-size:11px; font-weight:600; color:var(--p1);}
.def-cell.p2 .pname{color:var(--p2);}
.def-cell .inline{display:flex; gap:6px;}
.def-cell input{width:100%; padding:5px 4px; font-size:12.5px; text-align:center;}

.overlay{
  position:fixed; inset:0; background:rgba(6,8,9,.5); display:flex; align-items:flex-end; justify-content:center; z-index:20;
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  opacity:0; pointer-events:none; transition:opacity .22s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  background:var(--ios27-sheet-bg); backdrop-filter:var(--ios27-sheet-blur); -webkit-backdrop-filter:var(--ios27-sheet-blur);
  border:1px solid var(--ios27-tab-rim); border-radius:24px; padding:22px 18px; max-width:480px; width:100%;
  box-shadow:var(--ios27-tab-shadow), inset 0 1px 0 var(--ios27-tab-hi), inset 0 -6px 10px -6px var(--ios27-tab-lo);
  max-height:85vh; overflow-y:auto;
  transform:translateY(28px) scale(.97); opacity:0; transition:transform .3s cubic-bezier(.2,.9,.25,1.1), opacity .25s ease;
}
.overlay.show .sheet{ transform:translateY(0) scale(1); opacity:1; }
@media (prefers-reduced-motion: reduce){
  .overlay, .sheet{ transition:none; }
  .sheet{ transform:none; }
}
.sheet h2{margin:0 0 4px; font-size:20px;}
.pr-line{display:flex; align-items:center; gap:8px; background:var(--accent-soft); color:var(--accent); border-radius:9px; padding:8px 10px; font-size:13px; font-weight:600; margin-top:6px;}

.empty{text-align:center; padding:40px 10px; color:var(--ink-faint); font-size:13.5px;}

.theme-swatches{display:flex; gap:14px; flex-wrap:wrap; padding-top:2px;}
.theme-swatch{width:42px; height:42px; border-radius:50%; border:none; position:relative; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.35);}
.theme-swatch.active::after{
  content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--ink);
}
.theme-swatch svg{width:16px; height:16px; stroke:#fff; fill:none; stroke-width:3; position:absolute; inset:0; margin:auto; opacity:0; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
.theme-swatch.active svg{opacity:1;}
.theme-label{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:5px;}

.workout-toggle{
  display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none;
  padding:2px 0; color:var(--ink); text-align:left; gap:10px;
}
.workout-toggle h3{margin:0;}
.workout-toggle .wt-meta{font-size:12px; color:var(--ink-faint); font-weight:500; text-transform:none; letter-spacing:0; font-family:"IBM Plex Sans"; flex-shrink:0;}
.chevron{color:var(--ink-faint); flex-shrink:0; transition:transform .18s; display:flex;}
.chevron.open{transform:rotate(180deg);}
.chevron svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2;}
</style>
</head>
<body>


<div id="app">
  <div id="topbar">
    <h1><span class="dot"></span> Sport <span id="build-badge" style="font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink-faint); background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:6px; padding:2px 6px; margin-left:2px;"></span></h1>
    <pre id="debug-info" hidden style="position:fixed; left:8px; right:8px; top:calc(env(safe-area-inset-top,0px) + 46px); z-index:999; background:#000; color:#5f5; font-size:10px; line-height:1.5; padding:8px 10px; border-radius:8px; white-space:pre-wrap; font-family:'IBM Plex Mono',monospace; border:1px solid #5f5;"></pre>
    <div id="resume-banner"><span><b>Séance en cours</b> — <span id="resume-name"></span></span><button id="resume-btn">Reprendre</button></div>
  </div>
  <div id="view"></div>

    <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>Progrès</button>
    <button data-tab="nutrition"><svg viewBox="0 0 24 24"><path d="M5 3v6M7 3v6M9 3v6M7 9v12"/><path d="M17 3c-2 0-3 2-3 5s1 5 3 5v8"/></svg>Nutrition</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.07-.4.1-.8.1-1.2Z"/></svg>Réglages</button>
  </nav>
</div>

<div class="overlay" id="summary-overlay"><div class="sheet" id="summary-sheet"></div></div>
<input type="file" id="import-input" accept="application/json" hidden>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "carnet-fonte-v2";
  var CONTENT_VERSION = 13; // bump this whenever the built-in exercise data below changes
  // Small on-screen build tag (next to the "Sport" title) so a screenshot always shows,
  // beyond doubt, which deployed version is actually rendering — bump this string every
  // time index.html is redeployed, independently of CACHE_VERSION/CONTENT_VERSION above.
  var BUILD_VERSION = "b96";
  (function(){ var el = document.getElementById("build-badge"); if(el) el.textContent = BUILD_VERSION; })();

  // Tap the build badge to show real on-device measurements instead of guessing from
  // screenshots — innerHeight/visualViewport, the safe-area insets the browser is actually
  // reporting, and the live pixel position of #app and the nav bar. Tap again to hide.
  (function(){
    var badge = document.getElementById("build-badge");
    var panel = document.getElementById("debug-info");
    if(!badge || !panel) return;
    function readInset(prop){
      var probe = document.createElement("div");
      probe.style.position = "fixed";
      probe.style[prop] = "env(safe-area-inset-" + prop + ", -1px)";
      document.body.appendChild(probe);
      var v = getComputedStyle(probe)[prop];
      probe.remove();
      return v;
    }
    function refresh(){
      var app = document.getElementById("app");
      var tabs = document.getElementById("tabs");
      var ar = app ? app.getBoundingClientRect() : null;
      var tr = tabs ? tabs.getBoundingClientRect() : null;
      var lines = [
        "window.innerHeight: " + window.innerHeight,
        "visualViewport.height: " + (window.visualViewport ? window.visualViewport.height : "n/a"),
        "visualViewport.offsetTop: " + (window.visualViewport ? window.visualViewport.offsetTop : "n/a"),
        "screen.height/width: " + (window.screen ? (window.screen.height + "/" + window.screen.width) : "n/a"),
        "--vvh var: " + getComputedStyle(document.documentElement).getPropertyValue("--vvh"),
        "safe-area-inset-top: " + readInset("top"),
        "safe-area-inset-bottom: " + readInset("bottom"),
        "html computed height: " + getComputedStyle(document.documentElement).height,
        "body computed height: " + getComputedStyle(document.body).height,
        "body padding-bottom: " + getComputedStyle(document.body).paddingBottom,
        "#app rect: top=" + (ar?ar.top.toFixed(1):"?") + " bottom=" + (ar?ar.bottom.toFixed(1):"?") + " h=" + (ar?ar.height.toFixed(1):"?"),
        "#tabs rect: top=" + (tr?tr.top.toFixed(1):"?") + " bottom=" + (tr?tr.bottom.toFixed(1):"?") + " h=" + (tr?tr.height.toFixed(1):"?"),
        "gap tabs-bottom to screen-bottom: " + (tr ? (window.innerHeight - tr.bottom).toFixed(1) : "?"),
        "standalone: " + (window.navigator.standalone === true)
      ];
      panel.textContent = lines.join("\n");
    }
    badge.style.cursor = "pointer";
    badge.addEventListener("click", function(){
      panel.hidden = !panel.hidden;
      if(!panel.hidden) refresh();
    });
    window.addEventListener("resize", function(){ if(!panel.hidden) refresh(); });
  })();
  function uid(){ return Math.random().toString(36).slice(2,10); }

  function ex(id, name, machine, trackWeight, sets, p1w, p1r, p2w, p2r, howTo, videoClip){
    return { id:id, name:name, machine:machine, trackWeight:trackWeight, sets:sets, howTo:howTo||"",
      videoClip:videoClip||"",
      defaults:{ p1:{weight:p1w, reps:p1r}, p2:{weight:p2w, reps:p2r} } };
  }

  function defaultState(){
    return {
      contentVersion: CONTENT_VERSION,
      theme: "orange",
      restDurationDefault: 90,
      people: [{id:"p1", name:"Am"}, {id:"p2", name:"Jab"}],
      bodyWeights: { p1:65, p2:78 },
      // Optional per-person profile used to estimate daily calorie & protein targets
      // (Mifflin-St Jeor BMR × activity level). Empty age/heightCm means "not filled in
      // yet" — the nutrition card in Progrès just asks for them instead of guessing.
      bodyProfiles: { p1:{sex:"f", age:null, heightCm:null, activity:"mod", goal:"maintien"},
                       p2:{sex:"m", age:null, heightCm:null, activity:"mod", goal:"maintien"} },
      // Dated log of body-weight readings per person (see logBodyWeight) — bodyWeights above
      // stays the single "current" number everything else (calorie burn, nutrition targets)
      // reads, this is purely the history for the Progrès chart.
      bodyWeightLog: { p1:[], p2:[] },
      // Meal cards you cook/eat regularly ("mes plats") + the day-by-day log of what was
      // actually eaten (see the NUTRITION LOG section) — kept separate from sessions/workouts,
      // and from the BMR/TDEE targets above which stay purely computed, never stored.
      dishes: [],
      foodLog: [],
      // Your own Gemini API key, pasted once in Réglages — never shipped in the app's source
      // (this repo is public; a key committed to git would be found by scanners within
      // minutes). It lives here so it syncs to both phones the same way everything else does.
      geminiApiKey: "",
      currentTab: "home",
      currentPerson: "p1",
      activeSession: null,
      lastBackupAt: null,
      lastCloudSyncAt: null,
      // Simple logical clock (wall-clock ms) bumped on every real local edit, stored
      // alongside the data pushed to the shared cloud doc — this is how a device knows
      // whether what it just pulled is actually newer than what it already has, across
      // several iPhones sharing the same backup (see adoptRemoteState/checkCloudForUpdates).
      syncVersion: 0,
      sessions: [],
      workouts: [
        { id:"haut", name:"Haut du corps", met:5.3, location:"salle", exercises:[
          ex("haut-tirage", "Tirage vertical (Lat Pulldown)", "Poulie haute", true, 4, 30,9, 70,9),
          ex("haut-rowing", "Rowing assis machine", "Low row", true, 3, 30,10, 55,10),
          ex("haut-chest", "Chest Press (développé poitrine)", "Machine convergente", true, 4, 15,9, 50,9),
          ex("haut-shoulder", "Shoulder Press machine", "Machine épaules", true, 3, 7.5,12, 32.5,10),
          ex("haut-curlmachine", "Curl biceps machine", "Machine biceps", true, 3, 2.5,12, 15,12),
          ex("haut-curlbanc", "Curl biceps (banc, haltères)", "Banc + haltères", true, 3, 4,12, 10,12),
          ex("haut-tricepspoulie", "Extension triceps poulie", "Poulie haute, corde", true, 3, 5,12, 12.5,12,
            "Debout face à la poulie haute, corde en main, coudes collés au corps et épaules basses. Bras fixes (seuls les avant-bras bougent), tends la corde jusqu'en bas puis contrôle la remontée sans laisser les coudes s'écarter.",
            "haut-tricepspoulie.mp4"),
          ex("haut-tricepsmachine", "Extension triceps (machine soutien)", "Machine assise, appui poitrine", true, 3, 28,12, 0,12),
        ]},
        { id:"bas", name:"Bas du corps", met:5.5, location:"salle", exercises:[
          ex("bas-presse", "Presse à cuisses", "Pieds hauts (recrute + fessiers)", true, 4, 50,11, 90,11,

  // Merges freshly-shipped exercise data (names/weights/reps you gave me in chat) into whatever
  // is already saved on the phone, without touching sessions history or anything you've hand-edited
  // in Réglages (marked _custom). This is what lets me update the app for you without you having
  // to re-type your weights by hand every time.
  function migrateContent(st){
    if(!st.contentVersion) st.contentVersion = 0;
    if(st.contentVersion >= CONTENT_VERSION) return st;
    var fresh = defaultState();
    fresh.workouts.forEach(function(fw){
      var sw = st.workouts.find(function(w){ return w.id === fw.id; });
      if(!sw){ st.workouts.push(fw); return; }
      sw.name = fw.name; sw.location = fw.location; sw.met = fw.met;
      // A video course's player can switch source (local file <-> YouTube embed, e.g. for
      // better quality) — the generic per-field copy above doesn't touch
      // type/videoId/videoFile/videoDurationMin, so refresh them explicitly and drop
      // whichever of videoId/videoFile the fresh definition no longer sets.
      if(fw.type === "video"){
        sw.type = fw.type; sw.videoDurationMin = fw.videoDurationMin;
        sw.videoId = fw.videoId; sw.videoFile = fw.videoFile;
        if(!fw.videoId) delete sw.videoId;
        if(!fw.videoFile) delete sw.videoFile;
        return;
      }
      // A "quicklog" workout (Five, Danse...) has no exercises to merge either — refresh its
      // met/type here, but never defaultDurationMin, which is a personal setting (edited in
      // Réglages) rather than shipped content.
      if(fw.type === "quicklog"){
        sw.type = fw.type;
        return;
      }
      fw.exercises.forEach(function(fe){
        var se = sw.exercises.find(function(e){ return e.id === fe.id; });
        if(!se){ sw.exercises.push(fe); return; }
        if(!se._custom){
          se.name = fe.name; se.machine = fe.machine; se.trackWeight = fe.trackWeight;
          se.sets = fe.sets; se.howTo = fe.howTo; se.videoClip = fe.videoClip;
          // defaults (poids/reps de départ) volontairement JAMAIS repris d'ici : c'est la
          // progression réelle de la personne, mise à jour par finishSession après chaque
          // séance — pas une donnée éditoriale à rafraîchir avec le reste du contenu. Un bump
          // de CONTENT_VERSION ne doit jamais faire régresser un poids/nombre de reps déjà
          // atteint (bug remonté : "je refaisais 12 reps alors que j'étais passé à 13").
        }
      });
      // Un exercice qui a disparu de la définition fraîche (ancien id d'une séance Abdo
      // reconstruite, par ex.) n'a plus lieu d'être — mais seulement s'il n'a pas été
      // personnalisé, même logique que le reste de cette fonction.
      sw.exercises = sw.exercises.filter(function(se){
        return se._custom || fw.exercises.some(function(fe){ return fe.id === se.id; });
      });
    });
    st.contentVersion = CONTENT_VERSION;
    return st;
  }

  function migrateBasicFoods(st){

      var existing = st.dishes.find(function(d){ return d.id === fd.id; });
      if(!existing){
        var dish = JSON.parse(JSON.stringify(fd));
        dish.createdAt = new Date().toISOString();
        st.dishes.push(dish);
        return;
      }
      if(!existing._custom){
        existing.name = fd.name; existing.basis = fd.basis; existing.tag = fd.tag;
        if(fd.basis === "composite"){
          existing.ingredients = JSON.parse(JSON.stringify(fd.ingredients));
          delete existing.kcal; delete existing.protein; delete existing.carbs; delete existing.fat; delete existing.unit;
        } else {
          existing.kcal = fd.kcal; existing.protein = fd.protein; existing.carbs = fd.carbs; existing.fat = fd.fat;
          existing.unit = fd.unit || null;
          delete existing.ingredients;
        }
      }
    });
    st.foodContentVersion = FOOD_CONTENT_VERSION;
    return st;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.workouts || !parsed.people) return defaultState();
      return parsed;
    }catch(e){ return defaultState(); }
  }
  // Every real local edit bumps syncVersion — this is the logical clock that lets another
  // iPhone tell "is what I just pulled actually newer than what I already have" (see
  // checkCloudForUpdates below). Adopting a remote pull is NOT a local edit, so it goes
  // through persistLocally() directly instead of save(), to avoid re-stamping the version
  // (and re-pushing straight back up what we only just pulled down).
  function save(){ state.syncVersion = Date.now(); persistLocally(); scheduleCloudSync(); }
  function persistLocally(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  // Device identity is deliberately NOT part of `state` — it must survive adoptRemoteState()
  // wholesale-replacing `state` with whatever another iPhone last pushed, so it lives in its
  // own localStorage key instead.
  var DEVICE_NAME_KEY = "sport-device-name";
  function getDeviceName(){ try{ return localStorage.getItem(DEVICE_NAME_KEY) || ""; }catch(e){ return ""; } }
  function setDeviceName(name){ try{ localStorage.setItem(DEVICE_NAME_KEY, name); }catch(e){} }

  // Cache of "who last touched the shared cloud doc, and when" — refreshed whenever this
  // device talks to Firestore (push or pull), shown in Réglages so you can confirm a session
  // logged on another iPhone actually made it up. Not part of `state`: it describes the
  // cloud doc, not this device's own data.
  var lastRemoteInfo = null;
  function refreshRemoteStatusUI(){
    var el = document.getElementById("cloud-remote-status");
    if(!el) return;
    if(!lastRemoteInfo) { el.textContent = "Dernière synchro : inconnue"; return; }
    var age = lastRemoteInfo.updatedAtMs ? fmtBackupAge(new Date(lastRemoteInfo.updatedAtMs).toISOString()) : "à l’instant";
    el.textContent = "Dernière synchro : " + (lastRemoteInfo.device || "un appareil") + ", " + age;
  }

  // Debounced so a burst of stepper taps doesn't fire a write per tap — the cloud module
  // (loaded further down the page) may not be ready yet on the very first save() of a
  // session, hence the guard; scheduleCloudSync() just gets called again on the next save().
  var cloudSyncTimer = null;
  function scheduleCloudSync(){
    if(!window.__cloudSync) return;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(function(){
      window.__cloudSync.save(state, getDeviceName()).then(function(){
        state.lastCloudSyncAt = new Date().toISOString();
        persistLocally();
        lastRemoteInfo = { device: getDeviceName(), updatedAtMs: Date.now() };
        var el = document.getElementById("cloud-sync-status");
        if(el) el.textContent = "Sauvegarde cloud : " + fmtBackupAge(state.lastCloudSyncAt);
        refreshRemoteStatusUI();
      }).catch(function(err){ console.warn("cloud sync failed", err); });
    }, 1500);
  }

  // Adopts a full state object fetched from the shared cloud doc — a true wholesale replace,
  // used ONLY for the manual "Restaurer" button, which explicitly tells the person it replaces
  // every bit of local data with the cloud's copy. Never called for our own edits, so it
  // deliberately does NOT go through save() (that would re-stamp syncVersion with Date.now()
  // and immediately push the exact thing we just pulled straight back up).
  function adoptRemoteState(remote){
    state = ensureRestDuration(ensureBodyWeightLog(ensureBodyProfiles(migrateContent(remote))));
    persistLocally();
  }

  // Union-merges two arrays of {id, ...} records — local's own records first (untouched),
  // then any record that only exists on the other side appended. Doesn't try to resolve a
  // genuine edit/edit conflict on the very same id (rare — this device and the other one
  // editing the identical record at the same moment), but it NEVER drops a record that only
  // one side knows about, which is what actually happened in the reported bug: Am logged
  // "Haut du corps", Jab's phone pushed its own state before pulling hers, and the automatic
  // pull on her phone afterwards wholesale-replaced her local sessions with his — silently
  // deleting a session that both phones should have kept.
  function mergeArraysById(localArr, remoteArr){
    localArr = (localArr||[]).filter(function(r){ return r && r.id; });
    remoteArr = (remoteArr||[]).filter(function(r){ return r && r.id; });
    var knownIds = {};
    localArr.forEach(function(r){ knownIds[r.id] = true; });
    return localArr.concat(remoteArr.filter(function(r){ return !knownIds[r.id]; }));
  }
  // Same idea for a body-weight log, which has no id — a day's entry is already naturally
  // keyed by its own date (logBodyWeight dedupes same-day entries the exact same way).
  function mergeWeightLog(localLog, remoteLog){
    localLog = localLog || []; remoteLog = remoteLog || [];
    var knownDays = {};
    localLog.forEach(function(e){ knownDays[e.date.slice(0,10)] = true; });
    return localLog.concat(remoteLog.filter(function(e){ return !knownDays[e.date.slice(0,10)]; }))
      .sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
  }
  // Adopted on an AUTOMATIC background pull (checkCloudForUpdates) instead of
  // adoptRemoteState's wholesale replace: merges the append-mostly logs (sessions, foodLog,
  // dishes, each person's body-weight log) by union rather than letting whichever device's
  // syncVersion happens to be numerically larger silently drop everything the other device
  // logged since its own last push. Everything else (profiles, settings, targets...) still
  // takes the remote's value outright — "which side is newer" is a meaningful question there,
  // it just isn't for an array of independently-appended records. The merged result isn't
  // pushed back up immediately (same reasoning as adoptRemoteState) — it goes out whole and
  // already-repaired on the next real local edit's save().
  function mergeRemoteState(remote){
    var merged = ensureRestDuration(ensureBodyWeightLog(ensureBodyProfiles(migrateContent(remote))));
    merged.sessions = mergeArraysById(state.sessions, merged.sessions);
    merged.foodLog = mergeArraysById(state.foodLog, merged.foodLog);
    merged.dishes = mergeArraysById(state.dishes, merged.dishes);
    state.people.forEach(function(pl){
      merged.bodyWeightLog[pl.id] = mergeWeightLog((state.bodyWeightLog||{})[pl.id], merged.bodyWeightLog[pl.id]);
    });
    state = merged;
    persistLocally();
  }

  // Runs on load and whenever the app comes back to the foreground (another iPhone may have
  // pushed a session in the meantime) — pulls the shared doc and merges it in only if its
  // syncVersion is actually ahead of what's already here. Skipped mid-workout so a pull
  // racing an in-progress set can't yank the screen out from under you; the next natural
  // check (leaving the session, or reopening later) catches up instead.
  function checkCloudForUpdates(){
    if(!window.__cloudSync || state.activeSession) return;
    window.__cloudSync.restore().then(function(result){
      if(!result) return;
      lastRemoteInfo = { device: result.device, updatedAtMs: result.updatedAtMs };
      refreshRemoteStatusUI();
      if((result.state.syncVersion||0) > (state.syncVersion||0)){
        mergeRemoteState(result.state);
        applyTheme(); render();
      }
    }).catch(function(err){ console.warn("cloud pull failed", err); });
  }

  var ACCENT_THEMES = {
    orange: { label:"Orange", accent:"#ff5a33", ink:"#1a0f06" },
    braise: { label:"Rouge braise", accent:"#e5484d", ink:"#1c0507" },
    ambre:  { label:"Or / Ambre", accent:"#f2b134", ink:"#1f1400" },
    lime:   { label:"Vert lime", accent:"#8fd13f", ink:"#101a04" },
    violet: { label:"Violet électrique", accent:"#a855f7", ink:"#1c0a29" }
  };
  function applyTheme(){
    var t = ACCENT_THEMES[state.theme] || ACCENT_THEMES.orange;
    document.documentElement.style.setProperty("--accent", t.accent);
    document.documentElement.style.setProperty("--accent-ink", t.ink);

  function workoutColor(id){ return WORKOUT_COLORS[id] || "#ff5a33"; }
  function findWorkout(id){ return state.workouts.find(function(w){return w.id===id;}); }
  // Video courses and "quicklog" sport activities (Five, Danse...) both have no per-exercise
  // entries and no weight lifted — used wherever a "0/0 exercices" or exercise-editing UI
  // would just be noise for one of these.
  function isNoExerciseWorkout(w){ return !!w && (w.type === "video" || w.type === "quicklog"); }
  function findExercise(workout, exId){ return workout.exercises.find(function(e){return e.id===exId;}); }
  // A progress item added on the fly mid-session (via "+ Ajouter un exercice") carries its own
  // exercise definition inline (p.adhocExercise) instead of living in the workout's template,
  // since it's meant for just this once — findExercise alone wouldn't find it.
  function exerciseFor(workout, p){ return p.adhocExercise || findExercise(workout, p.exId); }
  function personName(pid){ if(pid==="both") return "Nous deux"; var p = state.people.find(function(p){return p.id===pid;}); return p ? p.name : pid; }
  // "both" (the "Nous deux" pill) isn't a real person id anywhere else in state — this is the
  // one place it resolves to the actual ids to aggregate over, so every stat that needs to
  // sum/union across people goes through here instead of re-special-casing "both" itself.
  function personIdsFor(pid){ return pid === "both" ? state.people.map(function(p){return p.id;}) : [pid]; }
  // "Nous deux" reads fine as a section title ("Calories brûlées — Nous deux") but awkwardly
  // mid-sentence ("de Nous deux dans Réglages") — this spells out the two names instead for
  // that use ("de Am et Jab dans Réglages").
  function personNamesJoined(pid){ return pid === "both" ? state.people.map(function(p){return p.name;}).join(" et ") : personName(pid); }
  // True if `s` (a session or food-log-ish record with .participants, or a plain personId
  // check via `includesId`) involves at least one of `ids` — the "union" semantics "Nous deux"
  // uses for session counts (a joint session counts once, not twice).
  function participantsInclude(participants, ids){ return ids.some(function(id){ return participants.indexOf(id) !== -1; }); }

  // ---------- NUTRITION (BMR / TDEE / protein targets) ----------
  // Mifflin-St Jeor is the formula most nutrition apps (MyFitnessPal, Cronometer...) use for
  // BMR — more accurate across body types than the older Harris-Benedict equation.
  var ACTIVITY_LEVELS = {
    sed:  { mult:1.2,   label:"Sédentaire (peu ou pas de sport)" },
    light:{ mult:1.375, label:"Légère (1-3x / semaine)" },
    mod:  { mult:1.55,  label:"Modérée (3-5x / semaine)" },
    active:{mult:1.725, label:"Élevée (6-7x / semaine)" },
    veryactive:{mult:1.9, label:"Très élevée (sport + travail physique)" }
  };
  var GOALS = {
    perte: { label:"Perte de gras", kcalAdj:-450, proteinPerKg:2.0 },
    maintien: { label:"Maintien", kcalAdj:0, proteinPerKg:1.8 },
    prise: { label:"Prise de masse", kcalAdj:350, proteinPerKg:2.0 }
  };
  function calcBMR(pid){
    var pr = state.bodyProfiles[pid], w = state.bodyWeights[pid];
    if(!pr || !pr.age || !pr.heightCm || !w) return null;
    return 10*w + 6.25*pr.heightCm - 5*pr.age + (pr.sex==="f" ? -161 : 5);
  }
  function calcTDEE(pid){
    var bmr = calcBMR(pid); if(!bmr) return null;
    var pr = state.bodyProfiles[pid];
    var lvl = ACTIVITY_LEVELS[pr.activity] || ACTIVITY_LEVELS.mod;
    return bmr * lvl.mult;
  }
  function calcNutritionTargets(pid){
    var tdee = calcTDEE(pid); if(!tdee) return null;
    var pr = state.bodyProfiles[pid];
    var goal = GOALS[pr.goal] || GOALS.maintien;
    var w = state.bodyWeights[pid];
    return {
      bmr: Math.round(calcBMR(pid)),
      tdee: Math.round(tdee),
      calories: Math.round(tdee + goal.kcalAdj),
      protein: Math.round(w * goal.proteinPerKg)
    };
  }
  // Objectif calories brûlées / jour — TDEE - BMR = la part de la dépense due à l'activité
  // (pas le métabolisme de repos), donc ça dépend du poids/taille/âge/sexe (via le BMR) ET
  // du niveau d'activité (via le TDEE), ajustée par l'objectif : un peu plus si perte de gras
  // (on veut brûler plus), un peu moins si prise de masse (pas intérêt à trop cramer).
  var BURN_GOAL_MULT_BY_GOAL = { perte: 1.15, maintien: 1.0, prise: 0.85 };
  function calcBurnGoal(pid){
    var tdee = calcTDEE(pid), bmr = calcBMR(pid);
    if(!tdee || !bmr) return null;
    var pr = state.bodyProfiles[pid];
    var mult = BURN_GOAL_MULT_BY_GOAL[pr.goal] || BURN_GOAL_MULT_BY_GOAL.maintien;
    return Math.round((tdee - bmr) * mult);
  }
  function otherPersonId(pid){ return pid==="p1" ? "p2" : "p1"; }

  function fmtDate(iso){ var d=new Date(iso); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}); }
  function fmtDateFull(iso){ var d=new Date(iso); return d.toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long"}); }
  // <input type="datetime-local">'s value format ("YYYY-MM-DDTHH:mm", local time, no
  // timezone) — round-trips with `new Date(thatString)`, which browsers parse as local time
  // for this exact shape, same as the input itself interprets what you type into it.
  function toDatetimeLocalValue(iso){
    var d = new Date(iso);
    function pad(n){ return String(n).padStart(2,"0"); }
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtDur(min){ var m=Math.round(min); if(m<60) return m+" min"; return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"); }
  function round1(n){ return Math.round(n*10)/10; }
  function isoWeekKey(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - day);
    return date.toISOString().slice(0,10);
  }
  function escapeAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

  // Long-press (hold without moving, default ~500ms) — the mobile equivalent of a right-click,
  // used for the "skip this exercise" action so no permanent button has to sit on the card,
  // and (with a longer thresholdMs) for deleting a dish card without a permanent "x" on it.
  // Pointer events unify touch and mouse; a small movement tolerance cancels the press if it
  // turns into a scroll, and the visible dimming while held is the only on-screen trace it
  // leaves. Sets el._longPressFired when it fires, so a click handler sharing the same element
  // (e.g. tap-to-log vs. hold-to-delete on a dish card) can tell the two apart and skip its own
  // action on the click that follows the long-press release.
  function attachLongPress(el, onLongPress, thresholdMs){
    var timer = null, startX = 0, startY = 0;
    var THRESHOLD_MS = thresholdMs || 500, MOVE_TOLERANCE = 10;
    function clear(){ if(timer){ clearTimeout(timer); timer = null; } el.classList.remove("pressing"); }
    el.addEventListener("pointerdown", function(ev){
      if(ev.pointerType === "mouse" && ev.button !== 0) return;
      startX = ev.clientX; startY = ev.clientY;
      el.classList.add("pressing");
      timer = setTimeout(function(){
        timer = null; el.classList.remove("pressing"); el._longPressFired = true; onLongPress();
      }, THRESHOLD_MS);
    });
    el.addEventListener("pointermove", function(ev){
      if(timer && (Math.abs(ev.clientX-startX) > MOVE_TOLERANCE || Math.abs(ev.clientY-startY) > MOVE_TOLERANCE)) clear();
    });
    ["pointerup","pointercancel","pointerleave"].forEach(function(evt){ el.addEventListener(evt, clear); });
    el.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });
  }

  // Closes the shared overlay/sheet. Centralised because the exercise-info sheet can contain
  // a playing <video> — pausing it here (instead of leaving it to keep decoding off-screen)
  // and re-running the same lock/unlock scroll fix as onResume() (see the head script) is
  // what stops the session view's scroll from getting stuck right after you back out of a
  // video: WKWebView leaves its momentum-scroll engine sluggish on whichever container was
  // "active" the same way it does after the phone locks, but closing an in-page modal never
  // fires visibilitychange/pageshow/focus, so nothing else would catch it.
  function closeOverlay(overlay, sheet){
    overlay.classList.remove("show");
    if(sheet){
      var vid = sheet.querySelector("video");
      if(vid){
        try{
          vid.pause();
          // Pausing alone leaves iOS's hardware video-decode session for this <video> open,
          // and THAT (not just the momentary background-like state) is what was keeping
          // the scroll view degraded even after the kickScroll reflow — confirmed still
          // reproducing with pause() alone. Dropping the src and reloading fully releases
          // the decoder.
          vid.removeAttribute("src");
          vid.load();
        }catch(e){}
      }
    }
    if(window.__kickScrollAfterOverlay) window.__kickScrollAfterOverlay();
  }

  // Native confirm()/alert() dialogs are unreliable inside a sandboxed page like this one, so every
  // "are you sure?" and every message in this app uses this in-page sheet instead of the browser's.
  function showConfirm(title, message, confirmLabel, onYes, danger){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<h2 class="disp">' + escapeAttr(title) + '</h2>' +
      '<div class="muted" style="margin-bottom:18px;">' + escapeAttr(message) + '</div>' +
      '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="confirm-no">Non</button>' +
        '<button class="btn ' + (danger?"btn-danger":"btn-accent") + ' btn-block" id="confirm-yes">' + escapeAttr(confirmLabel) + '</button>' +
      '</div>';
    overlay.classList.add("show");
    document.getElementById("confirm-no").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
    document.getElementById("confirm-yes").addEventListener("click", function(){ closeOverlay(overlay, sheet); onYes(); });
  }
  function showInfo(title, text, videoClip){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    // videoClip points at a file shipped alongside index.html (videos/<clip>.mp4).
    var videoHtml = videoClip ? (
      '<video class="info-video" src="videos/' + escapeAttr(videoClip) + '" controls playsinline preload="metadata" ' +
        'style="width:100%; border-radius:14px; margin-bottom:14px; background:#000; display:block;" ' +
        'onerror="this.style.display=\'none\'"></video>'
    ) : '';
    sheet.innerHTML = '<h2 class="disp">' + escapeAttr(title) + '</h2>' +
      videoHtml +
      (text ? '<div class="muted" style="margin-bottom:18px; line-height:1.5;">' + escapeAttr(text) + '</div>' : '') +
      '<button class="btn btn-accent btn-block" id="info-ok">Compris</button>';
    overlay.classList.add("show");
    document.getElementById("info-ok").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
  }
  function showAlert(message){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<div class="muted" style="margin-bottom:18px;">' + escapeAttr(message) + '</div>' +
      '<button class="btn btn-accent btn-block" id="alert-ok">OK</button>';
    overlay.classList.add("show");
    document.getElementById("alert-ok").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
