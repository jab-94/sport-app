<!doctype html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<script>
// Neither 100% nor 100dvh survives Safari's own toolbar hiding/showing reliably on every
// device — dvh is supposed to track it live but doesn't always repaint in time, which is
// what left a blank (black) gap below the tab bar. Measuring the real visible height in JS
// and writing it as a custom property is the classic, reliable fix: it reacts to the same
// events Safari's chrome animation fires, so the app frame is always sized to what's
// actually on screen right now.
//
// Confirmed via on-device measurement: in this standalone (home-screen) PWA, WebKit's
// visualViewport.height/innerHeight under-report the true screen height by exactly the
// top safe-area inset (873px reported vs 932px real, a 59px shortfall == the 59px status
// bar/notch height) even though viewport-fit=cover lets the page paint the FULL screen.
// That's what left a genuine, un-fillable 59px dead strip at the very bottom — no CSS
// margin/padding can reach space our own layout was never told exists. window.screen.height
// is the physical device resolution and isn't affected by this viewport-measurement bug,
// so in standalone mode we use it (whichever is taller) as the source of truth instead.
(function(){
  // Locking/dimming the phone mid-session and coming back can (a) fire a resize event with
  // a bogus transient height while the screen is mid-animation, which then gets baked into
  // --vvh and never gets corrected, silently shrinking the scrollable area, and (b) leave
  // WKWebView's own momentum-scrolling engine "stuck" sluggish on whatever scroll container
  // was active when it got backgrounded — a known WKWebView bug, unrelated to our CSS. A
  // sane-value guard fixes (a); forcing a reflow on the scroll container when the page
  // becomes visible again fixes (b).
  var MIN_VALID_H = 200;
  function setVVH(){
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    if (window.navigator.standalone && window.screen && window.screen.height > h) {
      h = window.screen.height;
    }
    if (h < MIN_VALID_H) return; // ignore a bogus mid-transition reading, keep the last good one
    document.documentElement.style.setProperty("--vvh", (h * 0.01) + "px");
  }
  function kickScroll(){
    var el = document.getElementById("view");
    if(!el) return;
    el.style.webkitOverflowScrolling = "auto";
    void el.offsetHeight; // force layout to actually apply the change before flipping it back
    requestAnimationFrame(function(){
      el.style.webkitOverflowScrolling = "touch";
      // The overflow-scrolling toggle above is the original (iOS 8-10 era) fix and is
      // close to a no-op on current iOS — it's the reflow it forces that helps, not the
      // property itself. Nudging scrollTop by a pixel and back is what actually forces
      // WKWebView's separate scrolling thread to resync with the main thread on modern
      // versions, which the toggle alone wasn't reliably doing (see closeOverlay for the
      // video-modal case, where this alone still wasn't enough).
      var prev = el.scrollTop;
      el.scrollTop = prev + 1;
      el.scrollTop = prev;
    });
  }
  function onResume(){
    // The screen doesn't finish settling the instant visibilitychange/pageshow fires, so
    // re-measure a couple of times shortly after rather than trusting the very first tick.
    setVVH(); kickScroll();
    setTimeout(function(){ setVVH(); kickScroll(); }, 60);
    setTimeout(function(){ setVVH(); kickScroll(); }, 350);
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) onResume(); });
  window.addEventListener("pageshow", onResume);
  window.addEventListener("focus", onResume);
  // Exposed so the app script (further down the page) can trigger the same fix after closing
  // the exercise-video modal — playing an inline <video> and dismissing it leaves WKWebView's
  // scroll engine in the exact same "stuck" state as a lock/unlock, but that doesn't fire
  // visibilitychange/pageshow/focus (the page was never actually backgrounded), so nothing
  // above would otherwise catch it.
  window.__kickScrollAfterOverlay = onResume;
  setVVH();
  window.addEventListener("resize", setVVH);
  window.addEventListener("orientationchange", setVVH);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", setVVH);
    window.visualViewport.addEventListener("scroll", setVVH);
  }
})();
</script>

<style>
/* Deliberately dark-only: this is a gym log meant to be read under bad lighting and
   glanced at mid-set, so the palette is fixed regardless of the phone's system theme. */
:root{
  --bg:#0d0f10; --surface:#181d1e; --surface-2:#212728; --surface-3:#2a3132;
  --ink:#f1f4f2; --ink-soft:#9aa4a3; --ink-faint:#616b6a;
  --accent:#ff5a33; --accent-ink:#181005;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg));
  --accent-dim: color-mix(in srgb, var(--accent) 48%, var(--bg));
  --p1:#e2677c; --p1-soft:#2a1620;
  --p2:#5fb2ea; --p2-soft:#122430;
  --good:#57d68a; --good-soft:#0f2a1c;
  --line:#2a3132; --line-soft:#20262728;
  --shadow: 0 2px 4px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
  /* "liquid glass" surface tokens: translucent panels that let the glowing background
     show through, blurred, with a thin bright rim to catch the light like real glass. */
  --glass-bg: color-mix(in srgb, var(--surface) 62%, transparent);
  --glass-bg-strong: color-mix(in srgb, var(--surface) 78%, transparent);
  --glass-border: rgba(255,255,255,.09);
  --glass-hi: rgba(255,255,255,.14);
  --glass-blur: blur(22px) saturate(170%);
  /* iOS 27 "Liquid Glass - Regular - Small" material, dark mode, as measured from Apple's
     official Figma UI kit (see ios27-design-system project) — used for the floating tab bar,
     which is exactly the "toolbars, tab bars, floating controls" use-case that material spec
     calls out. Much lighter tint + lighter blur than our old hand-tuned --glass-* tokens:
     real Liquid Glass barely tints the surface, the see-through + saturation boost carry it. */
  --ios27-tab-bg: rgba(118,118,128,.16);
  --ios27-tab-blur: blur(4px) saturate(180%);
  --ios27-tab-rim: rgba(230,230,230,.22);
  --ios27-tab-hi: rgba(230,230,230,.5);
  --ios27-tab-lo: rgba(26,26,26,.4);
  --ios27-tab-shadow: 0 8px 20px rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
/* The claude.ai artifact preview silently injects this reset for us; a plain self-hosted
   page doesn't get it for free. Without it, [hidden] and a class like .stack{display:flex}
   have equal CSS specificity, so the LAST one written wins the cascade regardless of which
   is "more correct" — here that was .stack, which made toggling `hidden` on the workout
   accordion's exercise list a no-op visually (only the chevron icon actually flipped). */
[hidden]{display:none!important;}
button, .card, .ex-card, .workout-tile, .theme-swatch, .icon-btn, .check{ transition:transform .12s ease; }
button:active, .theme-swatch:active, .icon-btn:active{ transform:scale(.93); }
.workout-tile:active{ transform:scale(.97); }
.check:active{ transform:scale(.85); }
@keyframes enterFade{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.enter-anim{ animation:enterFade .32s cubic-bezier(.2,.8,.3,1); }
@media (prefers-reduced-motion: reduce){
  button, .card, .ex-card, .workout-tile, .theme-swatch, .icon-btn, .check{ transition:none; }
  button:active, .theme-swatch:active, .icon-btn:active, .workout-tile:active, .check:active{ transform:none; }
  .enter-anim{ animation:none; }
}
/* Only ONE element paints the app's background: body. Two earlier attempts split the
   gradient across html (for the safe-area strips) AND body, kept in sync only by
   background-attachment:fixed — that mostly lined up, but iOS still rendered a visibly
   flatter, seam-bounded patch in the bottom strip (confirmed by pixel-sampling a real
   screenshot: the safe-area region came out as flat --bg with none of the radial glow,
   while the area just above it clearly had it). Two independently-painted boxes can
   always drift apart like this. The robust fix is to not have two boxes: html carries
   no background and no padding at all, body is sized to the FULL device screen (not to
   html's inset-reduced box) and puts the safe-area insets on its own padding instead —
   so the exact same paint operation that colors the visible content also colors the
   notch and home-indicator strips, with no possible seam. */
html{ color-scheme:dark; }
/* --vvh is set by the inline script in <head> from the real, live visible height (see the
   comment there) — calc() with it is the authoritative value; the 100%/100dvh chain before
   it is only there so the page isn't unstyled for the one frame before that script runs.
   Both html and body now share the same full-device-height sizing (see comment above:
   body owns the background and the safe-area padding, so it has to be exactly as tall as
   html, not merely 100% of a padded box). */
html{ height:100%; height:100dvh; height:calc(var(--vvh, 1vh) * 100); overflow:hidden; }
body{
  height:100%; height:100dvh; height:calc(var(--vvh, 1vh) * 100);
  overflow:hidden; overscroll-behavior:none;
  margin:0; color:var(--ink);
  background:
    radial-gradient(900px circle at 15% -8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 60%),
    radial-gradient(800px circle at 100% 15%, color-mix(in srgb, var(--p2) 16%, transparent), transparent 55%),
    radial-gradient(700px circle at 30% 110%, color-mix(in srgb, var(--good) 10%, transparent), transparent 55%),
    var(--bg);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:16px; padding-right:16px;
  display:flex; flex-direction:column;
  -webkit-text-size-adjust:100%;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3,.disp{font-family:"Oswald",system-ui,sans-serif; text-transform:uppercase; letter-spacing:.02em; text-wrap:balance;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
a{color:var(--accent);}

/* #app is the whole screen: a static flex column, not a scrolling document. Only #view (the
   middle section) scrolls. Nothing here uses position:sticky — sticky elements are what caused
   the bottom nav to vanish when this was added to the iPhone home screen: in that standalone
   mode the browser's own viewport bookkeeping is unreliable, so a bar's position is pinned by
   flex layout (it simply never has anywhere else to be) instead of by scroll tracking. */
#app{
  display:flex; flex-direction:column;
  height:100%;
  max-width:520px; width:100%; margin:0 auto;
}
#topbar{ flex:0 0 auto; padding:14px 0 8px; }
#topbar h1{font-size:21px; margin:0; color:var(--ink); display:flex; align-items:center; gap:9px;}
#topbar h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block; box-shadow:0 0 0 4px var(--accent-soft);}
#resume-banner{
  display:none; align-items:center; gap:10px; color:var(--ink);
  background:color-mix(in srgb, var(--accent) 20%, var(--glass-bg));
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--accent-dim); border-radius:16px; padding:11px 13px; margin-top:10px; font-size:13px;
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
#resume-banner.show{display:flex}
#resume-banner b{color:var(--accent)}
#resume-banner button{
  margin-left:auto; background:var(--accent); color:var(--accent-ink); border:none;
  padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; flex-shrink:0;
}

#view{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; padding-bottom:18px;
}

nav#tabs{
  position:relative;
  flex:0 0 auto; display:flex; gap:2px;
  background:var(--ios27-tab-bg); backdrop-filter:var(--ios27-tab-blur); -webkit-backdrop-filter:var(--ios27-tab-blur);
  border:1px solid var(--ios27-tab-rim); border-radius:26px;
  box-shadow:var(--ios27-tab-shadow), inset 0 1px 0 var(--ios27-tab-hi), inset 0 -1px 0 var(--ios27-tab-lo);
  padding:6px; margin:0 0 8px;
}
/* The floating "glass pill" that slides under whichever tab is active — its own little
   raised capsule of Liquid Glass, tinted with the accent colour and catching light on top,
   the way the selected tab lifts off the bar in Apple's own apps (Music, App Store, ...). */
#tab-highlight{
  position:absolute; top:6px; left:6px; height:calc(100% - 12px); width:0; border-radius:18px;
  /* Neutral "Liquid Glass — Regular Small — Active" material, measured (bg #999 @ .17) —
     no accent tint here, just a brighter, slightly raised patch of the same glass so it
     reads as "this piece of the bar is pressed/lit", not as a coloured badge. */
  background:rgba(153,153,153,.17);
  box-shadow:
    0 4px 14px rgba(0,0,0,.35),
    0 1px 0 rgba(0,0,0,.2),
    inset 0 1px 0 rgba(230,230,230,.45),
    inset 0 -6px 10px -6px rgba(0,0,0,.4);
  border:1px solid rgba(230,230,230,.22);
  transition:transform .38s cubic-bezier(.34,1.28,.64,1), width .38s cubic-bezier(.34,1.28,.64,1), opacity .2s ease;
  opacity:0; pointer-events:none;
}
#tab-highlight.show{opacity:1;}
nav#tabs button{
  position:relative; z-index:1;
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:8px 2px; color:var(--ink-faint); font-size:10.5px; font-weight:500; border-radius:18px;
  transition:color .2s;
}
nav#tabs button svg{width:21px;height:21px;stroke:var(--ink-faint); fill:none; stroke-width:1.8; transition:stroke .2s;}
nav#tabs button.active{color:var(--accent);}
nav#tabs button.active svg{stroke:var(--accent);}

.card{
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:20px;
  padding:16px; box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
}
.stack{display:flex; flex-direction:column; gap:12px;}
.row{display:flex; align-items:center; gap:10px;}
.between{justify-content:space-between;}
.muted{color:var(--ink-soft); font-size:13px;}
.faint{color:var(--ink-faint); font-size:12px;}

.workout-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
.workout-tile{
  grid-column:span 1; background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:22px; padding:22px 14px 18px; box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:5px;
}
.workout-tile.span2{grid-column:1 / -1; flex-direction:row; text-align:left; align-items:center; justify-content:space-between; padding:16px 18px;}
.workout-tile.span2 .wicon{margin-bottom:0;}
.workout-tile.span2 .tinfo{text-align:left; align-items:flex-start;}
.wicon{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); background:color-mix(in srgb, var(--tile-c, var(--accent)) 18%, var(--surface)); margin-bottom:4px; flex-shrink:0;
}
.wicon svg{width:22px; height:22px; stroke:var(--tile-c, var(--accent)); fill:none; stroke-width:1.8;}
.tinfo{display:flex; flex-direction:column; align-items:center; gap:2px;}
.workout-tile .name{font-size:16px; margin:0;}
.workout-tile .meta{font-size:11.5px; color:var(--ink-soft);}
.btn{border:none; border-radius:10px; padding:11px 16px; font-weight:600; font-size:14px;}
.btn-accent{background:var(--accent); color:var(--accent-ink);}
.btn-ghost{
  background:var(--glass-bg); color:var(--ink); border:1px solid var(--glass-border);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); box-shadow:inset 0 1px 0 var(--glass-hi);
}
.btn-line{background:rgba(255,255,255,.04); border:1px solid var(--glass-border); color:var(--ink);}
.btn-danger{background:#e5484d; color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:7px 10px; font-size:12.5px; border-radius:8px;}
.btn-pill{padding:8px 18px; border-radius:99px; font-size:12.5px; margin-top:8px;}
.btn:disabled{opacity:.45;}

.badge{
  display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 8px;
  border-radius:999px; background:rgba(255,255,255,.08); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;
  border:1px solid var(--glass-border);
}

.pill-group{
  display:flex; gap:6px; padding:4px; border-radius:16px;
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
}
.pill{flex:1; text-align:center; padding:9px 6px; border-radius:12px; font-size:13px; font-weight:600; border:none; background:none; color:var(--ink-soft); transition:background .2s, color .2s;}
.pill.active{background:rgba(255,255,255,.1); color:var(--p1); box-shadow:inset 0 1px 0 var(--glass-hi);}
.pill.active.p2{color:var(--p2);}
.pill.active.neutral{color:var(--accent);}

.ex-card{
  border:1px solid var(--glass-border); border-radius:18px; padding:14px;
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
}
.ex-card.collapsed{
  display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer;
  background:color-mix(in srgb, var(--good) 16%, var(--glass-bg)); border-color:var(--good);
}
.ex-card.collapsed .done-badge{
  width:24px; height:24px; border-radius:7px; background:var(--good); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ex-card.collapsed .done-badge svg{width:14px; height:14px; stroke:var(--bg); fill:none; stroke-width:3.2;}
.ex-card.collapsed .ex-title{font-size:14px; margin:0;}
.ex-card.collapsed .collapsed-meta{margin-left:auto; font-size:11.5px; color:var(--ink-soft); text-align:right; flex-shrink:0;}
.ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.ex-title{font-weight:600; font-size:15px; line-height:1.3;}
.ex-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.sets-badge{flex-shrink:0; background:rgba(255,255,255,.07); border:1px solid var(--glass-border); border-radius:12px; padding:6px 10px; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
.sets-badge .n{font-family:"IBM Plex Mono"; color:var(--ink);}

.person-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.person-cols.solo{grid-template-columns:1fr; max-width:200px;}
.person-col{
  border:1px solid var(--glass-border); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px;
  background:rgba(0,0,0,.16); transition:border-color .15s, background .15s;
}
.person-col.done{border-color:var(--good); background:var(--good-soft);}
.person-col.skipped{opacity:.55;}
.skipped-note{font-size:12px; color:var(--ink-faint); padding:8px 0; text-align:center; line-height:1.6;}
.skipped-hint{font-size:9.5px; opacity:.7;}
/* Long-press target: no visible affordance at rest — just a barely-there dimming while held,
   so the gesture feels responsive without adding a permanent on-screen button. */
.person-name{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; transition:opacity .15s;}
.person-name.pressing{opacity:.45;}
.ex-card.collapsed.all-skipped{background:var(--glass-bg); border-color:var(--glass-border);}
.ex-card.collapsed.all-skipped .done-badge{background:var(--ink-faint);}
.person-col .phead{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.person-name{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft);}
.person-col.p2 .person-name{color:var(--p2);}
.person-col:not(.p2) .person-name{color:var(--p1);}
.check{
  width:26px; height:26px; border-radius:8px; border:2px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.check svg{width:14px;height:14px; stroke:var(--bg); fill:none; stroke-width:3.2; opacity:0;}
.person-col.done .check{background:var(--good); border-color:var(--good);}
.person-col.done .check svg{opacity:1;}

.stepper{display:flex; align-items:center; border:1px solid var(--glass-border); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.05); width:100%;}
.stepper button{background:none; border:none; width:30px; height:36px; font-size:17px; color:var(--ink-soft); flex-shrink:0;}
.stepper button:active{background:var(--surface-2);}
.stepper button.nudge{
  color:var(--accent); font-weight:700;
  animation:nudgeGlow 2.2s ease-in-out infinite;
}
@keyframes nudgeGlow{
  0%,100%{ text-shadow:0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); transform:scale(1); }
  50%{ text-shadow:0 0 9px color-mix(in srgb, var(--accent) 90%, transparent); transform:scale(1.18); }
}
@media (prefers-reduced-motion: reduce){ .stepper button.nudge{ animation:none; } }
.stepper input{
  width:100%; border:none; background:none; text-align:center; font-size:14px; font-weight:600; color:var(--ink); min-width:0;
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.field-line{display:flex; align-items:center; gap:6px;}
.unit{font-size:10px; color:var(--ink-faint); flex-shrink:0; width:26px;}

#session-bar{
  flex:0 0 auto; margin:0 0 10px; padding:12px 16px;
  background:var(--glass-bg-strong); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:20px; box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  display:flex; flex-direction:column; gap:10px;
}
#session-bar .prog{font-size:12.5px; color:var(--ink-soft); flex-shrink:0;}
#session-bar .time{font-size:12.5px; margin-left:auto; margin-right:2px; color:var(--ink-soft); flex-shrink:0;}
.progress-track{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; flex:1;}
.progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .2s;}
#rest-row{border-top:1px solid var(--glass-border); padding-top:10px;}
#rest-time{font-family:"IBM Plex Mono"; font-size:15px; font-weight:600; min-width:46px; text-align:center;}
#rest-time.done{ color:var(--accent); animation:nudgeGlow 1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ #rest-time.done{ animation:none; } }

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-tile{
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:16px; padding:12px 14px; box-shadow:inset 0 1px 0 var(--glass-hi);
}
.stat-tile .v{font-family:"IBM Plex Mono"; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat-tile .l{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.hist-item{
  border:1px solid var(--glass-border); border-radius:16px; padding:12px 14px;
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.hist-item .top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.hist-item .date{font-weight:600; font-size:14px;}
.hist-detail{margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; display:none; font-size:12.5px; color:var(--ink-soft);}
.hist-detail.show{display:block;}
.hist-detail .exname{font-weight:600; color:var(--ink); margin-top:6px;}
.hist-detail .exname:first-child{margin-top:0;}
.hist-detail .exline{display:flex; justify-content:space-between; padding:2px 0 2px 10px;}

select, input[type=number], input[type=text]{
  background:rgba(255,255,255,.05); border:1px solid var(--glass-border); color:var(--ink); border-radius:10px; padding:9px 10px; font-size:14px;
}

.profile-block{padding:6px 0;}
.profile-block + .profile-block{border-top:1px solid var(--glass-border); margin-top:4px;}
.profile-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px;}
.pf-field{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--ink-soft);}
.pf-field select, .pf-field input{width:100%;}
.profile-block.p2 .section-title, .profile-block.p2 .pf-name{color:var(--p2);}

.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; margin:2px 0 0;}

.chart-wrap{
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:18px; padding:14px 12px 8px; box-shadow:inset 0 1px 0 var(--glass-hi);
}
svg text{font-family:"IBM Plex Mono",monospace; font-size:9.5px; fill:var(--ink-faint);}

.settings-ex{border:1px solid var(--glass-border); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px; background:rgba(255,255,255,.03);}
.settings-ex .top{display:flex; gap:8px; align-items:center;}
.settings-ex input[type=text]{flex:1; min-width:0;}
.icon-btn{background:rgba(255,255,255,.07); border:none; border-radius:10px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink-soft);}
.icon-btn svg{width:15px;height:15px; stroke:currentColor; fill:none; stroke-width:2;}
.info-btn{width:22px; height:22px; border-radius:50%; flex-shrink:0;}
.info-btn svg{width:13px; height:13px;}
.def-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.def-cell{border:1px solid var(--glass-border); border-radius:10px; padding:6px 8px; display:flex; flex-direction:column; gap:4px; background:rgba(0,0,0,.15);}
.def-cell .pname{font-size:11px; font-weight:600; color:var(--p1);}
.def-cell.p2 .pname{color:var(--p2);}
.def-cell .inline{display:flex; gap:6px;}
.def-cell input{width:100%; padding:5px 4px; font-size:12.5px; text-align:center;}

.overlay{
  position:fixed; inset:0; background:rgba(6,8,9,.5); display:flex; align-items:flex-end; justify-content:center; z-index:20;
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  opacity:0; pointer-events:none; transition:opacity .22s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  background:var(--glass-bg-strong); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:24px; padding:22px 18px; max-width:480px; width:100%;
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi); max-height:85vh; overflow-y:auto;
  transform:translateY(28px) scale(.97); opacity:0; transition:transform .3s cubic-bezier(.2,.9,.25,1.1), opacity .25s ease;
}
.overlay.show .sheet{ transform:translateY(0) scale(1); opacity:1; }
@media (prefers-reduced-motion: reduce){
  .overlay, .sheet{ transition:none; }
  .sheet{ transform:none; }
}
.sheet h2{margin:0 0 4px; font-size:20px;}
.pr-line{display:flex; align-items:center; gap:8px; background:var(--accent-soft); color:var(--accent); border-radius:9px; padding:8px 10px; font-size:13px; font-weight:600; margin-top:6px;}

.empty{text-align:center; padding:40px 10px; color:var(--ink-faint); font-size:13.5px;}

.theme-swatches{display:flex; gap:14px; flex-wrap:wrap; padding-top:2px;}
.theme-swatch{width:42px; height:42px; border-radius:50%; border:none; position:relative; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.35);}
.theme-swatch.active::after{
  content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--ink);
}
.theme-swatch svg{width:16px; height:16px; stroke:#fff; fill:none; stroke-width:3; position:absolute; inset:0; margin:auto; opacity:0; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
.theme-swatch.active svg{opacity:1;}
.theme-label{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:5px;}

.workout-toggle{
  display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none;
  padding:2px 0; color:var(--ink); text-align:left; gap:10px;
}
.workout-toggle h3{margin:0;}
.workout-toggle .wt-meta{font-size:12px; color:var(--ink-faint); font-weight:500; text-transform:none; letter-spacing:0; font-family:"IBM Plex Sans"; flex-shrink:0;}
.chevron{color:var(--ink-faint); flex-shrink:0; transition:transform .18s; display:flex;}
.chevron.open{transform:rotate(180deg);}
.chevron svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2;}
</style>
</head>

</div>

<div class="overlay" id="summary-overlay"><div class="sheet" id="summary-sheet"></div></div>
<input type="file" id="import-input" accept="application/json" hidden>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "carnet-fonte-v2";
  var CONTENT_VERSION = 8; // bump this whenever the built-in exercise data below changes
  // Small on-screen build tag (next to the "Sport" title) so a screenshot always shows,
  // beyond doubt, which deployed version is actually rendering — bump this string every
  // time index.html is redeployed, independently of CACHE_VERSION/CONTENT_VERSION above.
  var BUILD_VERSION = "b37";
  (function(){ var el = document.getElementById("build-badge"); if(el) el.textContent = BUILD_VERSION; })();

  // Tap the build badge to show real on-device measurements instead of guessing from
  // screenshots — innerHeight/visualViewport, the safe-area insets the browser is actually
  // reporting, and the live pixel position of #app and the nav bar. Tap again to hide.
  (function(){
    var badge = document.getElementById("build-badge");
    var panel = document.getElementById("debug-info");
    if(!badge || !panel) return;
    function readInset(prop){
      var probe = document.createElement("div");
      probe.style.position = "fixed";
      probe.style[prop] = "env(safe-area-inset-" + prop + ", -1px)";
      document.body.appendChild(probe);
      var v = getComputedStyle(probe)[prop];
      probe.remove();
      return v;
    }
    function refresh(){
      var app = document.getElementById("app");
      var tabs = document.getElementById("tabs");
      var ar = app ? app.getBoundingClientRect() : null;
      var tr = tabs ? tabs.getBoundingClientRect() : null;
      var lines = [
        "window.innerHeight: " + window.innerHeight,
        "visualViewport.height: " + (window.visualViewport ? window.visualViewport.height : "n/a"),
        "visualViewport.offsetTop: " + (window.visualViewport ? window.visualViewport.offsetTop : "n/a"),
        "screen.height/width: " + (window.screen ? (window.screen.height + "/" + window.screen.width) : "n/a"),
        "--vvh var: " + getComputedStyle(document.documentElement).getPropertyValue("--vvh"),
        "safe-area-inset-top: " + readInset("top"),
        "safe-area-inset-bottom: " + readInset("bottom"),
        "html computed height: " + getComputedStyle(document.documentElement).height,
        "body computed height: " + getComputedStyle(document.body).height,
        "body padding-bottom: " + getComputedStyle(document.body).paddingBottom,
        "#app rect: top=" + (ar?ar.top.toFixed(1):"?") + " bottom=" + (ar?ar.bottom.toFixed(1):"?") + " h=" + (ar?ar.height.toFixed(1):"?"),
        "#tabs rect: top=" + (tr?tr.top.toFixed(1):"?") + " bottom=" + (tr?tr.bottom.toFixed(1):"?") + " h=" + (tr?tr.height.toFixed(1):"?"),
        "gap tabs-bottom to screen-bottom: " + (tr ? (window.innerHeight - tr.bottom).toFixed(1) : "?"),
        "standalone: " + (window.navigator.standalone === true)
      ];
      panel.textContent = lines.join("\n");
    }
    badge.style.cursor = "pointer";
    badge.addEventListener("click", function(){
      panel.hidden = !panel.hidden;
      if(!panel.hidden) refresh();
    });
    window.addEventListener("resize", function(){ if(!panel.hidden) refresh(); });
  })();
  function uid(){ return Math.random().toString(36).slice(2,10); }

  function ex(id, name, machine, trackWeight, sets, p1w, p1r, p2w, p2r, howTo, videoClip){

      bodyWeightLog: { p1:[], p2:[] },
      currentTab: "home",
      currentPerson: "p1",
      activeSession: null,

      syncVersion: 0,
      sessions: [],
      workouts: [
        { id:"haut", name:"Haut du corps", met:5.3, location:"salle", exercises:[
          ex("haut-tirage", "Tirage vertical (Lat Pulldown)", "Poulie haute", true, 4, 30,9, 70,9),
          ex("haut-rowing", "Rowing assis machine", "Low row", true, 3, 30,10, 55,10),
          ex("haut-chest", "Chest Press (développé poitrine)", "Machine convergente", true, 4, 15,9, 50,9),
          ex("haut-shoulder", "Shoulder Press machine", "Machine épaules", true, 3, 7.5,12, 32.5,10),
          ex("haut-curlmachine", "Curl biceps machine", "Machine biceps", true, 3, 2.5,12, 15,12),
          ex("haut-curlbanc", "Curl biceps (banc, haltères)", "Banc + haltères", true, 3, 4,12, 10,12),
          ex("haut-tricepspoulie", "Extension triceps poulie", "Poulie haute, corde", true, 3, 5,12, 12.5,12,
            "Debout face à la poulie haute, corde en main, coudes collés au corps et épaules basses. Bras fixes (seuls les avant-bras bougent), tends la corde jusqu'en bas puis contrôle la remontée sans laisser les coudes s'écarter.",

          ex("haut-tricepsmachine", "Extension triceps (machine soutien)", "Machine assise, appui poitrine", true, 3, 28,12, 0,12),
        ]},
        { id:"bas", name:"Bas du corps", met:5.5, location:"salle", exercises:[
          ex("bas-presse", "Presse à cuisses", "Pieds hauts (recrute + fessiers)", true, 4, 50,11, 90,11,
            "Pieds placés hauts sur le plateau pour bien recruter les fessiers et ischios. Pousse dans les talons, descends profondément en gardant le bas du dos plaqué, sans verrouiller les genoux en haut du mouvement.",
            "bas-presse.mp4"),
          ex("bas-hipthrust", "Hip Thrust machine", "Glute Bridge — pause 1 sec en haut", true, 4, 40,11, 60,11),
          ex("bas-legcurl", "Leg Curl (ischios)", "Allongé ou assis", true, 3, 17.5,12, 27.5,12,
            "Allongé sur le ventre, talons vers les fessiers, bassin plaqué contre le banc (ne pas le décoller). Fléchis les genoux pour ramener les talons vers les fessiers, puis contrôle la descente sans relâcher d'un coup.",

          ex("bas-legext", "Leg Extension (quadriceps)", "Machine quadriceps", true, 3, 27.5,12, 37.5,12),

            "Assis, buste penché en arrière à environ 45°, mains posées au sol derrière toi pour t'équilibrer. Jambes fléchies, pieds décollés du sol. Ramène les genoux vers la poitrine puis retends les jambes, sans reposer les pieds au sol entre les répétitions.",
            "abdo-kneetuck.mp4"),
          ex("abdo-scissors", "Ciseaux (flutter kick)", "Au sol", false, 3, 0,12, 0,12,
            "Allongé sur le dos, bas du dos plaqué au sol, mains sous les fessiers ou le long du corps. Jambes tendues et légèrement décollées du sol, fais un battement vertical alterné (une jambe monte pendant que l'autre descend), sans les laisser toucher le sol.",
            "abdo-scissors.mp4"),
          ex("abdo-vup", "V-up", "Au sol", false, 3, 0,12, 0,12,
            "Allongé sur le dos, bras tendus au-dessus de la tête. Redresse le buste et les jambes tendues en même temps pour venir toucher tes pieds avec tes mains, en formant un V, puis redescends en contrôlant le mouvement.",

          ex("abdo-twist", "Torsion assise (punch crunch)", "Au sol", false, 3, 0,12, 0,12,
            "Assis, buste penché en arrière à environ 45°, jambes tendues et légèrement décollées du sol. Poings serrés devant la poitrine, envoie alternativement un poing de chaque côté comme un jab de boxe, sans reposer les pieds au sol.",
            "abdo-twist.mp4"),
          ex("abdo-bicycle", "Bicycle crunch", "Au sol", false, 3, 0,12, 0,12,
            "Allongé sur le dos, mains derrière la tête. Ramène un genou vers la poitrine en tournant le buste pour amener le coude opposé vers ce genou, pendant que l'autre jambe reste tendue et décollée du sol. Alterne des deux côtés dans un mouvement de pédalage.",
            "abdo-bicycle.mp4"),
          ex("abdo-jackknife", "Toe touch (jackknife)", "Au sol", false, 3, 0,12, 0,12,
            "Allongé sur le dos, jambes tendues à la verticale. Décolle les épaules du sol et tends les bras vers le haut pour venir toucher tes orteils en contractant le haut des abdos, puis redescends sans reposer la tête au sol.",
