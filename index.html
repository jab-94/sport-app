          ex("abdo-pikewalk", "Pike walk (bear crawl)", "Au sol", false, 3, 0,12, 0,12,
            "En position de planche, mains et pieds au sol, hanches légèrement relevées. Avance et recule en petits pas avec les mains, en gardant le dos plat et le gainage actif tout du long.",
            "abdo-pikewalk.mp4"),
          ex("abdo-walkout", "Plank walkout / mountain climber", "Au sol", false, 3, 0,12, 0,12,
            "En position de planche haute, mains sous les épaules. Ramène un genou vers l'avant en gardant le dos plat et le bassin stable, puis alterne rapidement d'un côté à l'autre.",
            "abdo-walkout.mp4"),
        ]},
      ]
    };
  }

  // Merges freshly-shipped exercise data (names/weights/reps you gave me in chat) into whatever
  // is already saved on the phone, without touching sessions history or anything you've hand-edited
  // in Réglages (marked _custom). This is what lets me update the app for you without you having
  // to re-type your weights by hand every time.
  function migrateContent(st){
    if(!st.contentVersion) st.contentVersion = 0;
    if(st.contentVersion >= CONTENT_VERSION) return st;
    var fresh = defaultState();
    fresh.workouts.forEach(function(fw){
      var sw = st.workouts.find(function(w){ return w.id === fw.id; });
      if(!sw){ st.workouts.push(fw); return; }
      sw.name = fw.name; sw.location = fw.location; sw.met = fw.met;
      // The Abdo session was completely rebuilt around the coach's video (new exercises,
      // new ids) — old abdo-* exercises no longer correspond to anything, so replace the
      // whole list wholesale instead of merging id-by-id.
      if(fw.id === "abdo"){
        sw.exercises = fw.exercises.map(function(fe){ return JSON.parse(JSON.stringify(fe)); });
        return;
      }
      fw.exercises.forEach(function(fe){
        var se = sw.exercises.find(function(e){ return e.id === fe.id; });
        if(!se){ sw.exercises.push(fe); return; }
        if(!se._custom){
          se.name = fe.name; se.machine = fe.machine; se.trackWeight = fe.trackWeight;
          se.sets = fe.sets; se.defaults = fe.defaults; se.howTo = fe.howTo; se.videoClip = fe.videoClip;
        }
      });
    });
    st.contentVersion = CONTENT_VERSION;
    return st;
  }

  var state = ensureRestDuration(ensureBodyWeightLog(ensureBodyProfiles(migrateContent(load()))));
  // Older saves (before the nutrition feature) have no bodyProfiles at all, or are missing
  // an entry for a person added since. Patch defaults in rather than bumping CONTENT_VERSION,
  // which would also touch workouts/exercises the person may have hand-edited.
  function ensureBodyProfiles(st){
    if(!st.bodyProfiles) st.bodyProfiles = {};
    st.people.forEach(function(pl){
      if(!st.bodyProfiles[pl.id]) st.bodyProfiles[pl.id] = {sex:"m", age:null, heightCm:null, activity:"mod", goal:"maintien"};
    });
    return st;
  }
  // Same idea for saves made before the body-weight log existed.
  function ensureBodyWeightLog(st){
    if(!st.bodyWeightLog) st.bodyWeightLog = {};
    st.people.forEach(function(pl){ if(!st.bodyWeightLog[pl.id]) st.bodyWeightLog[pl.id] = []; });
    return st;
  }
  // Same idea for saves made before the rest timer's default duration was configurable.
  function ensureRestDuration(st){
    if(!st.restDurationDefault) st.restDurationDefault = 90;
    return st;
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.workouts || !parsed.people) return defaultState();
      return parsed;
    }catch(e){ return defaultState(); }
  }
  // Every real local edit bumps syncVersion — this is the logical clock that lets another
  // iPhone tell "is what I just pulled actually newer than what I already have" (see
  // checkCloudForUpdates below). Adopting a remote pull is NOT a local edit, so it goes
  // through persistLocally() directly instead of save(), to avoid re-stamping the version
  // (and re-pushing straight back up what we only just pulled down).
  function save(){ state.syncVersion = Date.now(); persistLocally(); scheduleCloudSync(); }
  function persistLocally(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  // Device identity is deliberately NOT part of `state` — it must survive adoptRemoteState()
  // wholesale-replacing `state` with whatever another iPhone last pushed, so it lives in its
  // own localStorage key instead.
  var DEVICE_NAME_KEY = "sport-device-name";
  function getDeviceName(){ try{ return localStorage.getItem(DEVICE_NAME_KEY) || ""; }catch(e){ return ""; } }
  function setDeviceName(name){ try{ localStorage.setItem(DEVICE_NAME_KEY, name); }catch(e){} }

  // Cache of "who last touched the shared cloud doc, and when" — refreshed whenever this
  // device talks to Firestore (push or pull), shown in Réglages so you can confirm a session
  // logged on another iPhone actually made it up. Not part of `state`: it describes the
  // cloud doc, not this device's own data.
  var lastRemoteInfo = null;
  function refreshRemoteStatusUI(){
    var el = document.getElementById("cloud-remote-status");
    if(!el) return;
    if(!lastRemoteInfo) { el.textContent = "Dernière synchro : inconnue"; return; }
    var age = lastRemoteInfo.updatedAtMs ? fmtBackupAge(new Date(lastRemoteInfo.updatedAtMs).toISOString()) : "à l’instant";
    el.textContent = "Dernière synchro : " + (lastRemoteInfo.device || "un appareil") + ", " + age;
  }

  // Debounced so a burst of stepper taps doesn't fire a write per tap — the cloud module
  // (loaded further down the page) may not be ready yet on the very first save() of a
  // session, hence the guard; scheduleCloudSync() just gets called again on the next save().
  var cloudSyncTimer = null;
  function scheduleCloudSync(){
    if(!window.__cloudSync) return;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(function(){
      window.__cloudSync.save(state, getDeviceName()).then(function(){
        state.lastCloudSyncAt = new Date().toISOString();
        persistLocally();
        lastRemoteInfo = { device: getDeviceName(), updatedAtMs: Date.now() };
        var el = document.getElementById("cloud-sync-status");
        if(el) el.textContent = "Sauvegarde cloud : " + fmtBackupAge(state.lastCloudSyncAt);
        refreshRemoteStatusUI();
      }).catch(function(err){ console.warn("cloud sync failed", err); });
    }, 1500);
  }

  // Adopts a full state object fetched from the shared cloud doc (pulled automatically from
  // another device, or via the manual "Restaurer" button) — never called for our own edits,
  // so it deliberately does NOT go through save() (that would re-stamp syncVersion with
  // Date.now() and immediately push the exact thing we just pulled straight back up).
  function adoptRemoteState(remote){
    state = ensureRestDuration(ensureBodyWeightLog(ensureBodyProfiles(migrateContent(remote))));
    persistLocally();
  }

  // Runs on load and whenever the app comes back to the foreground (another iPhone may have
  // pushed a session in the meantime) — pulls the shared doc and adopts it only if its
  // syncVersion is actually ahead of what's already here. Skipped mid-workout so a pull
  // racing an in-progress set can't yank the screen out from under you; the next natural
  // check (leaving the session, or reopening later) catches up instead.
  function checkCloudForUpdates(){
    if(!window.__cloudSync || state.activeSession) return;
    window.__cloudSync.restore().then(function(result){
      if(!result) return;
      lastRemoteInfo = { device: result.device, updatedAtMs: result.updatedAtMs };
      refreshRemoteStatusUI();
      if((result.state.syncVersion||0) > (state.syncVersion||0)){
        adoptRemoteState(result.state);
        applyTheme(); render();
      }
    }).catch(function(err){ console.warn("cloud pull failed", err); });
  }

  var ACCENT_THEMES = {
    orange: { label:"Orange", accent:"#ff5a33", ink:"#1a0f06" },
    braise: { label:"Rouge braise", accent:"#e5484d", ink:"#1c0507" },
    ambre:  { label:"Or / Ambre", accent:"#f2b134", ink:"#1f1400" },
    lime:   { label:"Vert lime", accent:"#8fd13f", ink:"#101a04" },
    violet: { label:"Violet électrique", accent:"#a855f7", ink:"#1c0a29" }
  };
  function applyTheme(){
    var t = ACCENT_THEMES[state.theme] || ACCENT_THEMES.orange;
    document.documentElement.style.setProperty("--accent", t.accent);
    document.documentElement.style.setProperty("--accent-ink", t.ink);
  }

  var WORKOUT_COLORS = { haut:"#ff5a33", bas:"#f2b134", abdo:"#3ecf8e" };
  var WORKOUT_ICONS = {
    haut: '<path d="M3 12h2M19 12h2M6 9v6M18 9v6M8 8v8M16 8v8M8 12h8"/>',
    bas: '<path d="M9 3v7l-3 11h4l2-8 2 8h4l-3-11V3"/>',
    abdo: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'
  };
  function workoutColor(id){ return WORKOUT_COLORS[id] || "#ff5a33"; }
  function findWorkout(id){ return state.workouts.find(function(w){return w.id===id;}); }
  function findExercise(workout, exId){ return workout.exercises.find(function(e){return e.id===exId;}); }
  // A progress item added on the fly mid-session (via "+ Ajouter un exercice") carries its own
  // exercise definition inline (p.adhocExercise) instead of living in the workout's template,
  // since it's meant for just this once — findExercise alone wouldn't find it.
  function exerciseFor(workout, p){ return p.adhocExercise || findExercise(workout, p.exId); }
  function personName(pid){ var p = state.people.find(function(p){return p.id===pid;}); return p ? p.name : pid; }

  // ---------- NUTRITION (BMR / TDEE / protein targets) ----------
  // Mifflin-St Jeor is the formula most nutrition apps (MyFitnessPal, Cronometer...) use for
  // BMR — more accurate across body types than the older Harris-Benedict equation.
  var ACTIVITY_LEVELS = {
    sed:  { mult:1.2,   label:"Sédentaire (peu ou pas de sport)" },
    light:{ mult:1.375, label:"Légère (1-3x / semaine)" },
    mod:  { mult:1.55,  label:"Modérée (3-5x / semaine)" },
    active:{mult:1.725, label:"Élevée (6-7x / semaine)" },
    veryactive:{mult:1.9, label:"Très élevée (sport + travail physique)" }
  };
  var GOALS = {
    perte: { label:"Perte de gras", kcalAdj:-450, proteinPerKg:2.0 },
    maintien: { label:"Maintien", kcalAdj:0, proteinPerKg:1.8 },
    prise: { label:"Prise de masse", kcalAdj:350, proteinPerKg:2.0 }
  };
  function calcBMR(pid){
    var pr = state.bodyProfiles[pid], w = state.bodyWeights[pid];
    if(!pr || !pr.age || !pr.heightCm || !w) return null;
    return 10*w + 6.25*pr.heightCm - 5*pr.age + (pr.sex==="f" ? -161 : 5);
  }
  function calcTDEE(pid){
    var bmr = calcBMR(pid); if(!bmr) return null;
    var pr = state.bodyProfiles[pid];
    var lvl = ACTIVITY_LEVELS[pr.activity] || ACTIVITY_LEVELS.mod;
    return bmr * lvl.mult;
  }
  function calcNutritionTargets(pid){
    var tdee = calcTDEE(pid); if(!tdee) return null;
    var pr = state.bodyProfiles[pid];
    var goal = GOALS[pr.goal] || GOALS.maintien;
    var w = state.bodyWeights[pid];
    return {
      bmr: Math.round(calcBMR(pid)),
      tdee: Math.round(tdee),
      calories: Math.round(tdee + goal.kcalAdj),
      protein: Math.round(w * goal.proteinPerKg)
    };
  }
  function otherPersonId(pid){ return pid==="p1" ? "p2" : "p1"; }

  function fmtDate(iso){ var d=new Date(iso); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}); }
  function fmtDateFull(iso){ var d=new Date(iso); return d.toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long"}); }
  function fmtDur(min){ var m=Math.round(min); if(m<60) return m+" min"; return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"); }
  function round1(n){ return Math.round(n*10)/10; }
  function isoWeekKey(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - day);
    return date.toISOString().slice(0,10);
  }
  function escapeAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

  // Long-press (hold ~500ms without moving) — the mobile equivalent of a right-click, used for
  // the "skip this exercise" action so no permanent button has to sit on the card. Pointer
  // events unify touch and mouse; a small movement tolerance cancels the press if it turns into
  // a scroll, and the visible dimming while held is the only on-screen trace it leaves.
  function attachLongPress(el, onLongPress){
    var timer = null, startX = 0, startY = 0;
    var THRESHOLD_MS = 500, MOVE_TOLERANCE = 10;
    function clear(){ if(timer){ clearTimeout(timer); timer = null; } el.classList.remove("pressing"); }
    el.addEventListener("pointerdown", function(ev){
      if(ev.pointerType === "mouse" && ev.button !== 0) return;
      startX = ev.clientX; startY = ev.clientY;
      el.classList.add("pressing");
      timer = setTimeout(function(){ timer = null; el.classList.remove("pressing"); onLongPress(); }, THRESHOLD_MS);
    });
    el.addEventListener("pointermove", function(ev){
      if(timer && (Math.abs(ev.clientX-startX) > MOVE_TOLERANCE || Math.abs(ev.clientY-startY) > MOVE_TOLERANCE)) clear();
    });
    ["pointerup","pointercancel","pointerleave"].forEach(function(evt){ el.addEventListener(evt, clear); });
    el.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });
  }

  // Closes the shared overlay/sheet. Centralised because the exercise-info sheet can contain
  // a playing <video> — pausing it here (instead of leaving it to keep decoding off-screen)
  // and re-running the same lock/unlock scroll fix as onResume() (see the head script) is
  // what stops the session view's scroll from getting stuck right after you back out of a
  // video: WKWebView leaves its momentum-scroll engine sluggish on whichever container was
  // "active" the same way it does after the phone locks, but closing an in-page modal never
  // fires visibilitychange/pageshow/focus, so nothing else would catch it.
  function closeOverlay(overlay, sheet){
    overlay.classList.remove("show");
    if(sheet){
      var vid = sheet.querySelector("video");
      if(vid){
        try{
          vid.pause();
          // Pausing alone leaves iOS's hardware video-decode session for this <video> open,
          // and THAT (not just the momentary background-like state) is what was keeping
          // the scroll view degraded even after the kickScroll reflow — confirmed still
          // reproducing with pause() alone. Dropping the src and reloading fully releases
          // the decoder.
          vid.removeAttribute("src");
          vid.load();
        }catch(e){}
      }
    }
    if(window.__kickScrollAfterOverlay) window.__kickScrollAfterOverlay();
  }

  // Native confirm()/alert() dialogs are unreliable inside a sandboxed page like this one, so every
  // "are you sure?" and every message in this app uses this in-page sheet instead of the browser's.
  function showConfirm(title, message, confirmLabel, onYes, danger){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<h2 class="disp">' + escapeAttr(title) + '</h2>' +
      '<div class="muted" style="margin-bottom:18px;">' + escapeAttr(message) + '</div>' +
      '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="confirm-no">Non</button>' +
        '<button class="btn ' + (danger?"btn-danger":"btn-accent") + ' btn-block" id="confirm-yes">' + escapeAttr(confirmLabel) + '</button>' +
      '</div>';
    overlay.classList.add("show");
    document.getElementById("confirm-no").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
    document.getElementById("confirm-yes").addEventListener("click", function(){ closeOverlay(overlay, sheet); onYes(); });
  }
  function showInfo(title, text, videoClip){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    // videoClip points at a file shipped alongside index.html (videos/<clip>.mp4).
    var videoHtml = videoClip ? (
      '<video class="info-video" src="videos/' + escapeAttr(videoClip) + '" controls playsinline preload="metadata" ' +
        'style="width:100%; border-radius:14px; margin-bottom:14px; background:#000; display:block;" ' +
        'onerror="this.style.display=\'none\'"></video>'
    ) : '';
    sheet.innerHTML = '<h2 class="disp">' + escapeAttr(title) + '</h2>' +
      videoHtml +
      (text ? '<div class="muted" style="margin-bottom:18px; line-height:1.5;">' + escapeAttr(text) + '</div>' : '') +
      '<button class="btn btn-accent btn-block" id="info-ok">Compris</button>';
    overlay.classList.add("show");
    document.getElementById("info-ok").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
  }
  function showAlert(message){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<div class="muted" style="margin-bottom:18px;">' + escapeAttr(message) + '</div>' +
      '<button class="btn btn-accent btn-block" id="alert-ok">OK</button>';
    overlay.classList.add("show");
    document.getElementById("alert-ok").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
  }

  var $view = document.getElementById("view");
  var $tabs = document.getElementById("tabs");
  var $resumeBanner = document.getElementById("resume-banner");
  var $resumeName = document.getElementById("resume-name");

  // Tapping the dimmed backdrop (not the sheet itself) closes any open modal without taking
  // its action — same as picking "Non" on a confirm, or just deciding not to start after all.
  document.getElementById("summary-overlay").addEventListener("click", function(e){
    if(e.target === this){ closeOverlay(this, document.getElementById("summary-sheet")); render(); }
  });

  document.getElementById("resume-btn").addEventListener("click", function(){ state.currentTab="session"; render(); });
  $tabs.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    state.currentTab = btn.getAttribute("data-tab");
    render();
  });

  // Slides the little glass pill (#tab-highlight) under whichever nav button is currently
  // active, sizing/positioning it from that button's own layout box so it always lines up
  // exactly — no matter how many tabs there are or how wide the screen is.
  function moveTabHighlight(){
    var $hl = document.getElementById("tab-highlight");
    var active = $tabs.querySelector("button.active");
    if(!$hl || !active){ if($hl) $hl.classList.remove("show"); return; }
    var navRect = $tabs.getBoundingClientRect();
    var btnRect = active.getBoundingClientRect();
    $hl.style.width = btnRect.width + "px";
    $hl.style.transform = "translateX(" + (btnRect.left - navRect.left - 6) + "px)";
    $hl.classList.add("show");
  }
  window.addEventListener("resize", moveTabHighlight);

  function render(){
    if(!state.activeSession){
      var leftoverBar = document.getElementById("session-bar");
      if(leftoverBar) leftoverBar.remove();
    }
    Array.prototype.forEach.call($tabs.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === (state.currentTab==="session"?"home":state.currentTab));
    });
    moveTabHighlight();
    if(state.activeSession && state.currentTab!=="session"){
      $resumeBanner.classList.add("show");
      $resumeName.textContent = findWorkout(state.activeSession.workoutId).name;
    } else { $resumeBanner.classList.remove("show"); }
    var tab = state.currentTab;
    if(tab==="session" && !state.activeSession) tab="home";
    if(tab==="home") renderHome();
    else if(tab==="session") renderSession();
    else if(tab==="history") renderHistory();
    else if(tab==="progress") renderProgress();
    else if(tab==="settings") renderSettings();
    // Local-only: just remembers which tab you're on across a relaunch. Using the
    // version-bumping save() here instead would count every tab switch (and every
    // adopted cloud pull, which also ends in a render()) as a "real edit" and re-push
    // to the shared cloud doc on every navigation — harmless but wasteful, and it would
    // blur syncVersion's actual meaning (see save()/checkCloudForUpdates).
    persistLocally();
  }

  // ---------- HOME ----------
  var LOCATION_LABELS = { salle:"Salle", maison:"À la maison" };
  function renderHome(){
    var groups = [];
    state.workouts.forEach(function(w){
      var loc = w.location || "salle";
      var g = groups.find(function(g){ return g.loc === loc; });
      if(!g){ g = { loc:loc, items:[] }; groups.push(g); }
      g.items.push(w);
    });
    var html = '<div class="enter-anim">';
    groups.forEach(function(g){
      html += '<div class="section-title" style="margin:' + (groups.indexOf(g)===0?"2px":"18px") + ' 0 8px;">' + (LOCATION_LABELS[g.loc]||g.loc) + '</div>';
      html += '<div class="workout-grid">';
      g.items.forEach(function(w, i){
        var last = lastSessionFor(w.id);
        var color = workoutColor(w.id);
        var span2 = (i === g.items.length - 1 && g.items.length % 2 === 1);
        html += '<div class="workout-tile' + (span2?" span2":"") + '" style="--tile-c:' + color + ';">' +
          '<div class="wicon">' + '<svg viewBox="0 0 24 24">' + (WORKOUT_ICONS[w.id]||"") + '</svg></div>' +
          '<div class="tinfo">' +
            '<div class="name disp">' + w.name + '</div>' +
            '<div class="meta">' + w.exercises.length + ' exercices' + (last ? ' · ' + fmtDate(last.date) : ' · jamais fait') + '</div>' +
            '<button class="btn btn-accent btn-pill" data-start="' + w.id + '">Commencer</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    $view.innerHTML = html;
    $view.querySelectorAll("[data-start]").forEach(function(btn){
      btn.addEventListener("click", function(){ openStartModal(btn.getAttribute("data-start")); });
    });
  }

  function openStartModal(workoutId){
    var w = findWorkout(workoutId);
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<h2 class="disp">' + w.name + '</h2>' +
      '<div class="muted" style="margin-bottom:14px;">Qui fait la séance ?</div>' +
      '<div class="stack" style="gap:8px;">' + state.people.map(function(pl){
        return '<label class="row" style="gap:10px; background:var(--surface-2); padding:13px; border-radius:11px;">' +
          '<input type="checkbox" class="participant-check" data-pid="' + pl.id + '" checked style="width:19px;height:19px; flex-shrink:0; accent-color:var(--accent);">' +
          '<span style="font-weight:600;">' + escapeAttr(pl.name) + '</span></label>';
      }).join("") + '</div>' +
      '<button class="btn btn-accent btn-block" style="margin-top:16px;" id="start-confirm">Commencer</button>';
    overlay.classList.add("show");
    document.getElementById("start-confirm").addEventListener("click", function(){
      var checked = Array.prototype.slice.call(sheet.querySelectorAll(".participant-check:checked")).map(function(c){ return c.getAttribute("data-pid"); });
      if(!checked.length){ showAlert("Sélectionne au moins une personne."); return; }
      closeOverlay(overlay, sheet);
      startSession(workoutId, checked);
    });
  }
  function lastSessionFor(workoutId){
    var list = state.sessions.filter(function(s){return s.workoutId===workoutId;});
    return list.length ? list[list.length-1] : null;
  }
  function hasDoneBefore(exId, pid){
    return state.sessions.some(function(s){
      return s.exercises.some(function(se){ return se.exId===exId && se.entries[pid] && se.entries[pid].done; });
    });
  }
  function startSession(workoutId, participantIds){
    var w = findWorkout(workoutId);
    state.activeSession = {
      workoutId: workoutId, startedAt: Date.now(), participants: participantIds,
      progress: w.exercises.map(function(e){
        var entries = {};
        participantIds.forEach(function(pid){
          entries[pid] = {
            weight:e.defaults[pid].weight, reps:e.defaults[pid].reps, done:false, skipped:false,
            // baseline = what was logged last time, used to nudge "go up" without forcing it
            baseWeight:e.defaults[pid].weight, baseReps:e.defaults[pid].reps,
            hasHistory: hasDoneBefore(e.id, pid)
          };
        });
        return { exId:e.id, sets:e.sets, entries:entries };
      })
    };
    state.currentTab = "session";
    render();
  }
  function cancelSession(){
    showConfirm("Annuler la séance ?", "Rien ne sera enregistré pour cette séance en cours.", "Annuler la séance", function(){
      clearInterval(sessionTimerHandle);
      restEndsAt = null;
      state.activeSession = null;
      state.currentTab = "home";
      save(); render();
    }, true);
  }

  // A one-off exercise added from the session screen — for "on a envie d'en faire un de plus
  // aujourd'hui" — lives only in this session's progress list, not in the workout's own
  // template, so it won't show up next time you start this workout unless also added in Réglages.
  function openAddExerciseModal(){
    var sess = state.activeSession; if(!sess) return;
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<h2 class="disp">Ajouter un exercice</h2>' +
      '<div class="stack" style="gap:10px; margin-bottom:18px;">' +
        '<input type="text" id="adhoc-name" placeholder="Nom de l’exercice" style="width:100%;">' +
        '<input type="text" id="adhoc-machine" placeholder="Machine / description (optionnel)" style="width:100%;">' +
        '<label class="row" style="font-size:12.5px; gap:6px;"><input type="checkbox" id="adhoc-trackweight" checked> Suivre un poids (décoche pour un exercice au poids du corps)</label>' +
        '<div class="row" style="gap:16px;">' + sess.participants.map(function(pid){
          var pl = state.people.find(function(p){return p.id===pid;});
          return '<label class="row" style="gap:6px; font-size:12.5px;"><input type="checkbox" class="adhoc-participant" value="' + pid + '" checked> ' + escapeAttr(pl.name) + '</label>';
        }).join("") + '</div>' +
      '</div>' +
      '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="adhoc-cancel">Annuler</button>' +
        '<button class="btn btn-accent btn-block" id="adhoc-confirm">Ajouter</button>' +
      '</div>';
    overlay.classList.add("show");
    document.getElementById("adhoc-cancel").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
    document.getElementById("adhoc-confirm").addEventListener("click", function(){
      var name = document.getElementById("adhoc-name").value.trim();
      if(!name){ showAlert("Donne un nom à l’exercice."); return; }
      var machine = document.getElementById("adhoc-machine").value.trim();
      var trackWeight = document.getElementById("adhoc-trackweight").checked;
      var chosen = Array.prototype.slice.call(document.querySelectorAll(".adhoc-participant:checked")).map(function(c){ return c.value; });
      if(chosen.length===0){ showAlert("Choisis au moins une personne."); return; }
      closeOverlay(overlay, sheet);
      addAdhocExercise(name, machine, trackWeight, chosen);
    });
  }
  function addAdhocExercise(name, machine, trackWeight, participantIds){
    var sess = state.activeSession; if(!sess) return;
    var exId = "adhoc-" + uid();
    var defaults = {}, entries = {};
    participantIds.forEach(function(pid){
      defaults[pid] = { weight:0, reps:10 };
      entries[pid] = { weight:0, reps:10, done:false, skipped:false, baseWeight:0, baseReps:10, hasHistory:false };
    });
    sess.progress.push({
      exId: exId, sets:3, entries: entries,
      adhocExercise: { id:exId, name:name, machine:machine || "Ajouté pendant la séance", trackWeight:trackWeight, howTo:"", videoClip:"", defaults:defaults }
    });
    renderSession();
  }

  // ---------- SESSION ----------
  var sessionTimerHandle = null;
  // Rest timer state lives here, not in `state` — it's throwaway UI, not data worth saving
  // or syncing. It survives renderSession()'s frequent full re-renders (tapping any check
  // or stepper rebuilds $view) because #session-bar sits outside $view in the DOM, and
  // updateSessionBar() (already ticking every second) re-hydrates its display from these
  // vars every time, rather than the DOM itself holding the countdown. The default duration
  // itself (state.restDurationDefault) DOES live in `state` — it's a shared preference,
  // set in Réglages, not per-session throwaway UI like the countdown deadline is.
  var restEndsAt = null, restBuzzed = false;
  function renderSession(){
    clearInterval(sessionTimerHandle);
    var sess = state.activeSession;
    var w = findWorkout(sess.workoutId);
    var html = '<div class="stack" style="margin-top:6px; padding-bottom:8px;">';
    html += '<div class="row between"><h2 style="margin:0;">' + w.name + '</h2>' +
      '<div class="row" style="gap:8px; flex-shrink:0;"><span class="badge">' + w.exercises.length + ' ex.</span>' +
      '<button class="btn btn-line btn-sm" id="cancel-session-btn">Annuler</button></div></div>';
    // Exercises everyone present has checked off sink to the bottom, collapsed, so they stop
    // taking up room while you're mid-set on the next one.
    var ordered = sess.progress.slice().sort(function(a,b){ return (isExerciseDone(a)?1:0) - (isExerciseDone(b)?1:0); });
    ordered.forEach(function(p){
      var e = exerciseFor(w, p);
      html += renderExerciseCard(e, p);
    });
    html += '<button class="btn btn-line btn-block" id="add-ex-session-btn" type="button">+ Ajouter un exercice</button>';
    html += '</div>';
    $view.innerHTML = html;
    document.getElementById("cancel-session-btn").addEventListener("click", cancelSession);
    document.getElementById("add-ex-session-btn").addEventListener("click", openAddExerciseModal);

    $view.querySelectorAll("[data-check]").forEach(function(el){
      el.addEventListener("click", function(){
        var exId = el.getAttribute("data-check"), pid = el.getAttribute("data-person");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        p.entries[pid].done = !p.entries[pid].done;
        p.forceOpen = false;
        renderSession();
      });
    });
    $view.querySelectorAll("[data-toggle-skip]").forEach(function(el){
      attachLongPress(el, function(){
        var exId = el.getAttribute("data-toggle-skip"), pid = el.getAttribute("data-person");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        var entry = p.entries[pid];
        entry.skipped = !entry.skipped;
        if(entry.skipped) entry.done = false;
        p.forceOpen = false;
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
        renderSession();
      });
    });
    $view.querySelectorAll("[data-expand]").forEach(function(el){
      el.addEventListener("click", function(){
        var p = sess.progress.find(function(x){return x.exId===el.getAttribute("data-expand");});
        p.forceOpen = true;
        renderSession();
      });
    });
    $view.querySelectorAll("[data-info]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var exId = el.getAttribute("data-info");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        var e = p ? exerciseFor(w, p) : findExercise(w, exId);
        showInfo(e.name, e.howTo, e.videoClip);
      });
    });
    $view.querySelectorAll("[data-field]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var exId = inp.getAttribute("data-ex"), pid = inp.getAttribute("data-person"), field = inp.getAttribute("data-field");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        var v = parseFloat(inp.value); if(isNaN(v)) v = 0;
        if(pid) p.entries[pid][field] = v; else p[field] = v;
        updateSessionBar();
      });
    });
    $view.querySelectorAll("[data-step]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var exId = btn.getAttribute("data-ex"), pid = btn.getAttribute("data-person"), field = btn.getAttribute("data-field");
        var delta = parseFloat(btn.getAttribute("data-step"));
        var p = sess.progress.find(function(x){return x.exId===exId;});
        if(pid) p.entries[pid][field] = Math.max(0, round1(p.entries[pid][field] + delta));
        else p[field] = Math.max(1, Math.round(p[field] + delta));
        renderSession();
      });
    });

    renderSessionBar();
    sessionTimerHandle = setInterval(updateSessionBar, 1000);
  }

  // Skipped counts the same as done for "is this exercise settled" purposes — the person just
  // isn't doing it this time, so it shouldn't block the card from collapsing out of the way.
  function isExerciseDone(p){
    var ids = Object.keys(p.entries);
    return ids.length > 0 && ids.every(function(pid){ var en = p.entries[pid]; return en.done || en.skipped; });
  }

  function renderExerciseCard(e, p){
    var participants = state.people.filter(function(pl){ return !!p.entries[pl.id]; });
    if(isExerciseDone(p) && !p.forceOpen){
      var allSkipped = participants.every(function(pl){ return p.entries[pl.id].skipped; });
      var meta = participants.map(function(pl){
        var entry = p.entries[pl.id];
        if(entry.skipped) return "ignoré";
        return e.trackWeight ? (entry.weight + "kg") : (entry.reps + "");
      }).join(" · ");
      var badgeIcon = allSkipped ? '<path d="M6 12h12"/>' : '<path d="M4 12l6 6L20 6"/>';
      return '<div class="ex-card collapsed' + (allSkipped?" all-skipped":"") + '" data-expand="' + e.id + '">' +
        '<div class="done-badge"><svg viewBox="0 0 24 24">' + badgeIcon + '</svg></div>' +
        '<div class="ex-title">' + e.name + '</div>' +
        '<div class="collapsed-meta">' + meta + '</div>' +
      '</div>';
    }
    var infoBtn = (e.howTo || e.videoClip) ? '<button class="icon-btn info-btn" data-info="' + e.id + '" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 8v.01"/></svg></button>' : '';
    var cols = participants.map(function(pl){
      var entry = p.entries[pl.id];
      var pClass = pl.id==="p1" ? "" : "p2";
      // Nudge to go up on weight or reps vs. last time — clears on either as soon as one improves.
      var progressed = !entry.hasHistory || (entry.weight > entry.baseWeight) || (entry.reps > entry.baseReps);
      var nudgeWeight = entry.hasHistory && !progressed && e.trackWeight;
      var nudgeReps = entry.hasHistory && !progressed;
      // No visible "skip" button — a long-press on the person's name toggles it, so the card
      // stays clean when nobody needs it. data-toggle-skip on the name itself keeps the touch
      // target small and deliberate, away from the steppers just below it.
      return '<div class="person-col ' + pClass + ' ' + (entry.done?"done":"") + (entry.skipped?" skipped":"") + '">' +
        '<div class="phead"><span class="person-name" data-toggle-skip="' + e.id + '" data-person="' + pl.id + '">' + escapeAttr(pl.name) + '</span>' +
          (entry.skipped ? '' : '<div class="check" data-check="' + e.id + '" data-person="' + pl.id + '"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></div>') +
        '</div>' +
        (entry.skipped
          ? '<div class="skipped-note">Exercice ignoré<br><span class="skipped-hint">appui long sur le nom pour annuler</span></div>'
          : ((e.trackWeight ? fieldLine(e.id, pl.id, "weight", entry.weight, 2.5, "kg", nudgeWeight) : '') +
            fieldLine(e.id, pl.id, "reps", entry.reps, 1, "reps", nudgeReps))
        ) +
      '</div>';
    }).join("");
    var colsClass = participants.length === 1 ? "person-cols solo" : "person-cols";
    return '<div class="ex-card" data-card="' + e.id + '">' +
      '<div class="ex-head">' +
        '<div><div class="ex-title" style="display:flex; align-items:center; gap:6px;">' + e.name + infoBtn + '</div><div class="ex-sub">' + e.machine + '</div></div>' +
        '<div class="sets-badge">' + p.sets + ' <span class="n" style="font-weight:400;">séries</span></div>' +
      '</div>' +
      '<div class="' + colsClass + '">' + cols + '</div>' +
    '</div>';
  }
  function fieldLine(exId, pid, key, val, step, unit, nudge){
    return '<div class="field-line"><span class="unit">' + unit + '</span><div class="stepper">' +
      '<button data-step="-' + step + '" data-ex="' + exId + '" data-person="' + pid + '" data-field="' + key + '" type="button">−</button>' +
      '<input class="num" type="number" inputmode="decimal" value="' + val + '" data-field="' + key + '" data-ex="' + exId + '" data-person="' + pid + '">' +
      '<button class="' + (nudge?"nudge":"") + '" data-step="' + step + '" data-ex="' + exId + '" data-person="' + pid + '" data-field="' + key + '" type="button" title="' + (nudge?"Essaie d’augmenter par rapport à la dernière fois":"") + '">+</button>' +
    '</div></div>';
  }

  function renderSessionBar(){
    var old = document.getElementById("session-bar"); if(old) old.remove();
    var bar = document.createElement("div");
    bar.id = "session-bar";
    bar.innerHTML =
      '<div class="row" style="gap:12px;">' +
        '<span class="prog num" id="sb-count"></span>' +
        '<div class="progress-track"><div class="progress-fill" id="sb-fill"></div></div>' +
        '<span class="time num" id="sb-time"></span>' +
        '<button class="btn btn-accent btn-sm" id="sb-finish">Terminer</button>' +
      '</div>' +
      '<div class="row between" id="rest-row">' +
        '<button class="btn btn-line btn-sm" id="rest-start" type="button">' +
          '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;margin-right:5px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
          'Repos ' + state.restDurationDefault + 's' +
        '</button>' +
        '<div class="row" id="rest-running" style="gap:8px; display:none;">' +
          '<span id="rest-time" class="num"></span>' +
          '<button class="btn btn-line btn-sm" id="rest-plus15" type="button">+15s</button>' +
          '<button class="icon-btn" id="rest-cancel" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
        '</div>' +
      '</div>';
    document.getElementById("app").insertBefore(bar, document.getElementById("tabs"));
    document.getElementById("sb-finish").addEventListener("click", finishSession);
    document.getElementById("rest-start").addEventListener("click", function(){
      restEndsAt = Date.now() + state.restDurationDefault*1000; restBuzzed = false; updateSessionBar();
    });
    document.getElementById("rest-plus15").addEventListener("click", function(){
      if(restEndsAt) restEndsAt += 15000; updateSessionBar();
    });
    document.getElementById("rest-cancel").addEventListener("click", function(){
      restEndsAt = null; updateSessionBar();
    });
    updateSessionBar();
  }
  function fmtSec(totalSec){ var s = Math.max(0, Math.round(totalSec)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  function updateSessionBar(){
    var sess = state.activeSession; if(!sess) return;
    var done=0, total=0;
    sess.progress.forEach(function(p){ Object.keys(p.entries).forEach(function(pid){ var en=p.entries[pid]; if(en.skipped) return; total++; if(en.done) done++; }); });
    var elapsedMin = (Date.now() - sess.startedAt) / 60000;
    var countEl = document.getElementById("sb-count"), fillEl = document.getElementById("sb-fill"), timeEl = document.getElementById("sb-time");
    if(countEl) countEl.textContent = done + "/" + total;
    if(fillEl) fillEl.style.width = (total? (done/total*100):0) + "%";
    if(timeEl) timeEl.textContent = fmtDur(elapsedMin);

    var startBtn = document.getElementById("rest-start"), running = document.getElementById("rest-running"), timeSpan = document.getElementById("rest-time");
    if(startBtn && running){
      if(restEndsAt){
        var remaining = (restEndsAt - Date.now()) / 1000;
        startBtn.style.display = "none"; running.style.display = "flex";
        if(remaining > 0){
          timeSpan.textContent = fmtSec(remaining); timeSpan.classList.remove("done");
        } else {
          timeSpan.textContent = "0:00"; timeSpan.classList.add("done");
          if(!restBuzzed){
            restBuzzed = true;
            if(navigator.vibrate) try{ navigator.vibrate([200,100,200,100,200]); }catch(e){}
            setTimeout(function(){ restEndsAt = null; updateSessionBar(); }, 2000);
          }
        }
      } else {
        startBtn.style.display = ""; running.style.display = "none";
      }
    }
    save();
  }

  function finishSession(){
    clearInterval(sessionTimerHandle);
    restEndsAt = null;
    var sess = state.activeSession;
    var w = findWorkout(sess.workoutId);
    var participants = sess.participants || state.people.map(function(p){return p.id;});
    var durationMin = Math.max(1, (Date.now() - sess.startedAt) / 60000);
    var caloriesByPerson = {}, volumeByPerson = {}, prsByPerson = {};
    participants.forEach(function(pid){
      caloriesByPerson[pid] = w.met * 3.5 * (state.bodyWeights[pid]||70) / 200 * durationMin;
      volumeByPerson[pid] = 0; prsByPerson[pid] = [];
    });

    var snapshot = sess.progress.map(function(p){
      var e = exerciseFor(w, p);
      var entriesOut = {};
      participants.forEach(function(pid){
        var entry = p.entries[pid];
        // Not everyone necessarily has an entry (an exercise added mid-session can be for just
        // one of you), and a skipped entry is deliberately left out entirely — it shouldn't
        // count toward volume, PRs, or become the new suggested default next time.
        if(!entry || entry.skipped) return;
        if(entry.done && e.trackWeight){
          var best = bestWeightFor(e.id, pid);
          if(entry.weight > best) prsByPerson[pid].push(e.name + " — " + entry.weight + " kg");
          volumeByPerson[pid] += entry.weight * p.sets * entry.reps;
        }
        entriesOut[pid] = { weight:entry.weight, reps:entry.reps, done:entry.done };
        e.defaults[pid] = { weight:entry.weight, reps:entry.reps };
      });
      return { exId:e.id, name:e.name, trackWeight:e.trackWeight, sets:p.sets, entries:entriesOut };
    }).filter(function(rec){ return Object.keys(rec.entries).length > 0; }); // drop exercises nobody actually did

    var record = {
      id: uid(), workoutId:w.id, workoutName:w.name, date:new Date().toISOString(), participants:participants,
      durationMin:durationMin, caloriesByPerson:caloriesByPerson, volumeByPerson:volumeByPerson, exercises:snapshot
    };
    state.sessions.push(record);
    state.activeSession = null;
    state.currentTab = "home";
    save();
    showSummary(record, prsByPerson);
  }

  function bestWeightFor(exId, pid){
    var best = 0;
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(e){
        if(e.exId===exId && e.trackWeight && e.entries[pid] && e.entries[pid].done) best = Math.max(best, e.entries[pid].weight);
      });
    });
    return best;
  }

  function showSummary(record, prsByPerson){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    var participants = record.participants || state.people.map(function(p){return p.id;});
    var doneTotal=0, total=0;
    record.exercises.forEach(function(e){ participants.forEach(function(pid){ total++; if(e.entries[pid].done) doneTotal++; }); });
    var html = '<h2 class="disp">Séance enregistrée</h2>' +
      '<div class="muted">' + record.workoutName + ' · ' + fmtDateFull(record.date) + '</div>' +
      '<div class="stat-grid" style="margin-top:14px;">' +
        stat(fmtDur(record.durationMin), "Durée") + stat(doneTotal + "/" + total, "Exercices faits");
    participants.forEach(function(pid){
      html += stat(Math.round(record.caloriesByPerson[pid]) + " kcal", personName(pid) + " · calories") +
              stat(Math.round(record.volumeByPerson[pid]) + " kg", personName(pid) + " · volume");
    });
    html += '</div>';
    participants.forEach(function(pid){
      (prsByPerson[pid]||[]).forEach(function(t){
        html += '<div class="pr-line">Record · ' + personName(pid) + ' — ' + t + '</div>';
      });
    });
    html += '<button class="btn btn-accent btn-block" style="margin-top:16px;" id="summary-close">Fermer</button>';
    sheet.innerHTML = html;
    overlay.classList.add("show");
    document.getElementById("summary-close").addEventListener("click", function(){ closeOverlay(overlay, sheet); render(); });
  }
  function stat(v,l){ return '<div class="stat-tile"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  // ---------- HISTORY ----------
  var historyFilter = "all"; // which workout type is shown — resets on reload, like settingsOpen
  function renderHistory(){
    var all = state.sessions.slice().reverse();
    if(!all.length){
      $view.innerHTML = '<div class="empty">Aucune séance enregistrée pour l’instant.<br>Commence une séance depuis l’onglet Séances.</div>';
      return;
    }
    var list = historyFilter==="all" ? all : all.filter(function(s){ return s.workoutId===historyFilter; });
    var html = '<div class="stack enter-anim" style="margin-top:6px;">';
    html += '<div class="pill-group">' +
      '<button class="pill neutral' + (historyFilter==="all"?" active":"") + '" data-hist-filter="all">Tout</button>' +
      state.workouts.map(function(w){
        return '<button class="pill neutral' + (historyFilter===w.id?" active":"") + '" data-hist-filter="' + w.id + '">' + w.name + '</button>';
      }).join("") +
    '</div>';
    if(!list.length){
      html += '<div class="empty">Aucune séance de ce type pour l’instant.</div>';
    }
    list.forEach(function(s){
      var participants = s.participants || state.people.map(function(p){return p.id;});
      var doneN=0, total=0;
      s.exercises.forEach(function(e){ participants.forEach(function(pid){ total++; if(e.entries[pid].done) doneN++; }); });
      html += '<div class="hist-item" data-hist="' + s.id + '">' +
        '<div class="top"><div><div class="date">' + s.workoutName + '</div><div class="faint">' + fmtDateFull(s.date) + '</div></div>' +
        '<div class="row" style="gap:6px; flex-shrink:0;"><span class="badge">' + fmtDur(s.durationMin) + '</span>' +
        '<button class="icon-btn" data-del-session="' + s.id + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>' +
        '<div class="row" style="margin-top:8px; gap:16px; flex-wrap:wrap;">' +
        participants.map(function(pid){
          return '<span class="faint num">' + personName(pid) + ': ' + Math.round(s.caloriesByPerson[pid]) + ' kcal · ' + Math.round(s.volumeByPerson[pid]) + ' kg</span>';
        }).join("") + '</div>' +
        '<div class="hist-detail" id="detail-' + s.id + '">' +
          s.exercises.map(function(e){
            return '<div class="exname">' + e.name + '</div>' + participants.map(function(pid){
              var en = e.entries[pid];
              return '<div class="exline"><span>' + (en.done?"✓ ":"— ") + personName(pid) + '</span><span class="num">' +
                (e.trackWeight ? en.weight + " kg × " : "") + e.sets + "×" + en.reps + '</span></div>';
            }).join("");
          }).join("") +
        '</div></div>';
    });
    html += '</div>';
    $view.innerHTML = html;
    $view.querySelectorAll("[data-hist-filter]").forEach(function(btn){
      btn.addEventListener("click", function(){ historyFilter = btn.getAttribute("data-hist-filter"); renderHistory(); });
    });
    $view.querySelectorAll("[data-hist]").forEach(function(card){
      card.addEventListener("click", function(){ document.getElementById("detail-" + card.getAttribute("data-hist")).classList.toggle("show"); });
    });
    $view.querySelectorAll("[data-del-session]").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var sid = btn.getAttribute("data-del-session");
        showConfirm("Supprimer cette séance ?", "Elle sera retirée définitivement de ton historique.", "Supprimer", function(){
          state.sessions = state.sessions.filter(function(s){ return s.id !== sid; });
          save(); renderHistory();
        }, true);
      });
    });
  }

  // ---------- PROGRESS ----------
  function renderProgress(){
    var sessions = state.sessions;
    var totalSessions = sessions.length;
    var now = new Date();
    var thisMonth = sessions.filter(function(s){ var d=new Date(s.date); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }).length;
    var streak = computeWeekStreak(sessions);
    var pid = state.currentPerson || "p1";

    var totalVolume = sessions.reduce(function(a,s){return a+(s.volumeByPerson?s.volumeByPerson[pid]||0:0);},0);
    var totalCal = sessions.reduce(function(a,s){return a+(s.caloriesByPerson?s.caloriesByPerson[pid]||0:0);},0);

    var html = '<div class="stack enter-anim" style="margin-top:6px;">';
    html += '<div class="pill-group">' + state.people.map(function(pl){
      return '<button class="pill ' + (pl.id===pid?"active":"") + ' ' + (pl.id==="p2"?"p2":"") + '" data-person-select="' + pl.id + '">' + escapeAttr(pl.name) + '</button>';
    }).join("") + '</div>';

    html += '<div class="section-title">Régularité (séances faites ensemble)</div>';
    html += '<div class="stat-grid">' + stat(totalSessions,"Séances au total") + stat(thisMonth,"Séances ce mois-ci") +
      stat(streak,"Semaines d’affilée") + '</div>';

    html += '<div class="chart-wrap">' + weeklyChartSvg(sessions) + '</div>';

    html += '<div class="section-title">' + escapeAttr(personName(pid)) + ' — calories &amp; volume</div>';
    html += '<div class="stat-grid">' + stat(Math.round(totalCal) + " kcal", "Calories cumulées (est.)") + stat(Math.round(totalVolume) + " kg", "Volume total soulevé") + '</div>';

    html += '<div class="section-title">Poids corporel — ' + escapeAttr(personName(pid)) + '</div>';
    var wlog = (state.bodyWeightLog && state.bodyWeightLog[pid]) || [];
    var wpoints = wlog.map(function(entry){ return { date:entry.date, value:entry.weight }; });
    var wsvg = renderLineChartSvg(wpoints, " kg");
    html += '<div class="chart-wrap">' + (wsvg || '<div class="faint">Enregistre quelques pesées pour voir la courbe' + (wpoints.length===1?" (poids actuel : "+wpoints[0].value+" kg)":"") + '.</div>') + '</div>';
    html += '<div class="card row" style="gap:10px;">' +
      '<input type="number" id="weight-log-input" value="' + (state.bodyWeights[pid]||"") + '" step="0.1" style="flex:1; min-width:0;">' +
      '<span class="muted">kg</span>' +
      '<button class="btn btn-accent btn-sm" id="weight-log-btn" style="flex-shrink:0;">Enregistrer</button>' +
    '</div>';

    html += '<div class="section-title">Objectifs nutrition — ' + escapeAttr(personName(pid)) + '</div>';
    var nut = calcNutritionTargets(pid);
    if(nut){
      var goalLabel = (GOALS[(state.bodyProfiles[pid]||{}).goal] || GOALS.maintien).label;
      html += '<div class="card stack" style="gap:10px;">' +
        '<div class="stat-grid">' +
          stat(nut.calories + " kcal", "À manger / jour (" + goalLabel.toLowerCase() + ")") +
          stat(nut.protein + " g", "Protéines / jour") +
        '</div>' +
        '<div class="faint">Dépense estimée (TDEE) : ' + nut.tdee + ' kcal/jour · métabolisme de base : ' + nut.bmr + ' kcal/jour.</div>' +
        '<div class="faint" style="opacity:.65;">Estimation Mifflin-St Jeor — un repère, pas une prescription médicale.</div>' +
      '</div>';
    } else {
      html += '<div class="card stack" style="gap:8px;">' +
        '<div class="faint">Renseigne la taille et l’âge de ' + escapeAttr(personName(pid)) + ' dans Réglages pour voir ses calories &amp; protéines à viser chaque jour.</div>' +
        '<button class="btn btn-line btn-sm" id="goto-settings-nutrition" style="align-self:flex-start;">Aller dans Réglages</button>' +
      '</div>';

  function computeWeekStreak(sessions){
    if(!sessions.length) return 0;
    var weeks = {};
    sessions.forEach(function(s){ weeks[isoWeekKey(new Date(s.date))] = true; });
    var streak = 0, cursor = new Date();
    while(true){
      var key = isoWeekKey(cursor);
      if(weeks[key]){ streak++; cursor.setDate(cursor.getDate()-7); } else break;
    }
    return streak;
  }

  function weeklyChartSvg(sessions){
    var H = 110, pad = 22;
    var weeks = [];
    var cursor = new Date();
    cursor.setDate(cursor.getDate() - (cursor.getDay()===0?6:cursor.getDay()-1));
    for(var i=9;i>=0;i--){
      var d = new Date(cursor); d.setDate(d.getDate() - i*7);
      weeks.push({ key: isoWeekKey(d), label:(d.getDate())+"/"+(d.getMonth()+1), count:0 });
    }
    sessions.forEach(function(s){ var w = weeks.find(function(x){return x.key===isoWeekKey(new Date(s.date));}); if(w) w.count++; });
    var max = Math.max(1, Math.max.apply(null, weeks.map(function(w){return w.count;})));
    var bw = 96/weeks.length;
    var bars = weeks.map(function(w,i){
      var h = (w.count/max) * (H - pad - 14);
      var x = 2 + i*bw, y = H - pad - h, isCurrent = i===weeks.length-1;
      return '<rect x="' + x + '%" y="' + y + '" width="' + (bw*0.62) + '%" height="' + h + '" rx="2" fill="' + (isCurrent?'var(--accent)':'var(--surface-2)') + '" stroke="var(--line)"/>' +
        (w.count>0 ? '<text x="' + (x+bw*0.31) + '%" y="' + (y-4) + '" text-anchor="middle">' + w.count + '</text>' : '') +
        '<text x="' + (x+bw*0.31) + '%" y="' + (H-4) + '" text-anchor="middle">' + w.label + '</text>';
    }).join("");
    return '<svg viewBox="0 0 400 ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" style="overflow:visible;">' +
      '<line x1="0" y1="' + (H-pad) + '" x2="400" y2="' + (H-pad) + '" stroke="var(--line)"/>' + bars + '</svg>';
  }

  // Shared by the exercise-load chart and the body-weight chart: a simple line+dots SVG
  // over dated {date, value} points, labelling only the endpoints (first/last date, last
  // value) to keep it readable at this size. Returns null when there isn't enough data to
  // draw a line, so callers can show their own "not enough data yet" message instead.
  function renderLineChartSvg(points, unitSuffix){
    if(points.length < 2) return null;
    var H=130, W=400, padL=8, padR=8, padT=14, padB=20;
    var min = Math.min.apply(null, points.map(function(p){return p.value;}));
    var max = Math.max.apply(null, points.map(function(p){return p.value;}));
    if(min===max){ min-=1; max+=1; }
    function X(i){ return padL + (i/(points.length-1)) * (W-padL-padR); }
    function Y(v){ return padT + (1 - (v-min)/(max-min)) * (H-padT-padB); }
    var path = points.map(function(p,i){ return (i===0?"M":"L") + X(i).toFixed(1) + "," + Y(p.value).toFixed(1); }).join(" ");
    var dots = points.map(function(p,i){
      var last = i===points.length-1;
      return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.value).toFixed(1) + '" r="' + (last?4:2.5) + '" fill="' + (last?'var(--accent)':'var(--ink-faint)') + '"/>' +
        (last ? '<text x="' + X(i).toFixed(1) + '" y="' + (Y(p.value)-9).toFixed(1) + '" text-anchor="end" fill="var(--accent)" font-weight="600">' + p.value + unitSuffix + '</text>' : '');
    }).join("");
    var labels = '<text x="' + X(0).toFixed(1) + '" y="' + (H-4) + '">' + fmtDate(points[0].date) + '</text>' +
      '<text x="' + X(points.length-1).toFixed(1) + '" y="' + (H-4) + '" text-anchor="end">' + fmtDate(points[points.length-1].date) + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' +
      '<line x1="' + padL + '" y1="' + (H-padB) + '" x2="' + (W-padR) + '" y2="' + (H-padB) + '" stroke="var(--line)"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2"/>' + dots + labels + '</svg>';
  }

  function drawExerciseChart(exId, pid){
    var points = [];
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(e){
        if(e.exId===exId && e.trackWeight && e.entries[pid] && e.entries[pid].done) points.push({ date:s.date, value:e.entries[pid].weight });
      });
    });
    var el = document.getElementById("ex-chart");
    var svg = renderLineChartSvg(points, " kg");
    el.innerHTML = svg || ('<div class="faint">Pas encore assez de séances enregistrées pour tracer une courbe' + (points.length===1?" (poids actuel : "+points[0].value+" kg)":"") + '.</div>');
  }

  // ---------- BODY WEIGHT LOG ----------
  // Overwrites the same day's entry rather than appending, so fixing a typo (or just
  // re-logging the same morning) doesn't create a second point for one real reading.
  function logBodyWeight(pid, weight){
    state.bodyWeights[pid] = weight;
    if(!state.bodyWeightLog) state.bodyWeightLog = {};
    var log = state.bodyWeightLog[pid] || (state.bodyWeightLog[pid] = []);
    var today = new Date().toISOString().slice(0,10);
    var idx = log.findIndex(function(entry){ return entry.date.slice(0,10) === today; });
    var entry = { date: new Date().toISOString(), weight: weight };
    if(idx >= 0) log[idx] = entry; else log.push(entry);
    log.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    save();
  }

  async function exportData(){
    var filename = "sport-" + new Date().toISOString().slice(0,10) + ".json";
    var data = JSON.stringify(state, null, 2);
    var blob = new Blob([data], {type:"application/json"});
    try{
      var downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if(downloads){ await downloads.save({ filename:filename, data:blob }); markBackedUp(); return; }
    }catch(e){}
    // On iPhone, the share sheet is what actually gets a backup OFF the device — straight to
    // iCloud Drive, Mail, Messages, AirDrop, whatever — instead of a plain download that just
    // lands quietly in the Files app's Downloads folder (still on the same phone).
    try{
      var file = new File([blob], filename, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:"Sauvegarde Sport", text:"Sauvegarde des données Sport (" + new Date().toLocaleDateString("fr-FR") + ")" });
        markBackedUp();
        return;
      }
    }catch(e){ if(e && e.name === "AbortError") return; /* user cancelled the share sheet, not an error */ }
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      markBackedUp();
    }catch(e){ showAlert("L'export a échoué sur cet appareil."); }
  }
  function markBackedUp(){ state.lastBackupAt = new Date().toISOString(); save(); }
  function daysSince(iso){ if(!iso) return Infinity; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
  function fmtBackupAge(iso){
    if(!iso) return "jamais";
    var d = daysSince(iso);
    if(d <= 0) return "aujourd’hui";
    if(d === 1) return "hier";
    return "il y a " + d + " jours";
  }
  document.getElementById("import-input").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(parsed && parsed.workouts && parsed.people){ state = ensureRestDuration(ensureBodyWeightLog(ensureBodyProfiles(parsed))); applyTheme(); save(); render(); showAlert("Données importées."); }
        else showAlert("Fichier invalide.");
      }catch(err){ showAlert("Fichier invalide."); }
    };
    reader.readAsText(file);
  });

  function boot(){ applyTheme(); render(); }
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {}; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
  } else { boot(); }

  // Pulls whatever another of your iPhones may have pushed since this device last looked —
  // on load (module is generally ready by then, see the comment on window.__cloudSync
  // further down) and every time the app comes back to the foreground.
  window.addEventListener("load", function(){ checkCloudForUpdates(); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkCloudForUpdates(); });

  // Auto-update: without this, a new deploy never reaches the phone until you delete
  // the app from the home screen and clear site data — the OS only re-checks for a new
  // service-worker.js on its own schedule, which in practice is unreliable for a
  // standalone PWA. Forcing a check on every launch/resume (visibilitychange, which the
  // scroll-fix code at the top of <head> already hooks for the same "just reopened the
  // app" moment) and reloading as soon as the new one takes over means a fresh deploy
  // shows up just by reopening the app, no manual reset needed.
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then(function(reg){
        reg.update().catch(function(){});
        document.addEventListener("visibilitychange", function(){
          if(!document.hidden) reg.update().catch(function(){});
        });
      }).catch(function(){});
    });
    var reloadingForUpdate = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloadingForUpdate) return;
      reloadingForUpdate = true;
      // Mid-workout, force-reloading would cut you off in the middle of a set — ask
      // first (your data is already saved on every change, so nothing is lost either
      // way, but the interruption itself is worth a heads-up). Otherwise just refresh.
      if(state.activeSession){
        showConfirm("Nouvelle version", "Une mise à jour de l'app est prête. Actualiser maintenant ?", "Actualiser", function(){ window.location.reload(); });
        reloadingForUpdate = false;
      } else {
        window.location.reload();
      }
    });
  }
})();
</script>

<script type="module">
  // Shared cloud backup: mirrors the same JSON export() already produces up to Firestore,
  // under ONE fixed document shared by every iPhone running this app (SHARED_DOC_ID below) —
  // that's what lets a session logged on iPhone 1 on Monday show up in the history on
  // iPhone 2 on Tuesday (see checkCloudForUpdates in the main script). Anonymous auth is
  // still used (each device signs itself in) purely so Firestore's rules can require
  // request.auth != null; it's no longer part of the document path. Since this file — and
  // the Firebase config and SHARED_DOC_ID in it — are public in the GitHub repo, the real
  // security boundary is the Firestore rule restricting reads/writes to exactly this one
  // document id, not the id being secret.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyBgjzTjhPxx5GBUFavZ_rR0aZ1QdpnmPm4",
    authDomain: "sport-app-debe7.firebaseapp.com",
    projectId: "sport-app-debe7",
    storageBucket: "sport-app-debe7.firebasestorage.app",
    messagingSenderId: "992408391096",
    appId: "1:992408391096:web:5fac245f218b2e7480934d"
  };
  var SHARED_DOC_ID = "d31a77a5-baf0-4bb1-a3e3-845de0de61cc";

  var app = initializeApp(firebaseConfig);
  var auth = getAuth(app);
  // persistentLocalCache is what lets a write made with no signal at the gym sit queued in
  // IndexedDB and go out on its own once the phone has a connection again, with no retry
  // logic of our own needed — the SDK handles that.
  var db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager({}) }) });
  var sharedDoc = doc(db, "backups", SHARED_DOC_ID);

  var authReady = new Promise(function(resolve){
    onAuthStateChanged(auth, function(user){ if(user) resolve(); });
    signInAnonymously(auth).catch(function(err){ console.warn("cloud auth failed", err); });
  });

  window.__cloudSync = {
    // deviceName is metadata ABOUT the push (who made it), stored as its own field
    // alongside the data rather than inside the JSON blob — adopting a pull overwrites
    // the whole app state, and a device's own name must never get clobbered by that.
    save: function(stateObj, deviceName){
      return authReady.then(function(){
        return setDoc(sharedDoc, { json: JSON.stringify(stateObj), updatedAt: serverTimestamp(), device: deviceName || "" });
      });
    },
    restore: function(){
      return authReady.then(function(){ return getDoc(sharedDoc); }).then(function(snap){
        if(!snap.exists()) return null;
        var data = snap.data();
        var st = null;
        try{ st = JSON.parse(data.json); }catch(e){ return null; }
        var ts = data.updatedAt && data.updatedAt.toMillis ? data.updatedAt.toMillis() : null;
        return { state: st, device: data.device || "", updatedAtMs: ts };
      });
    }
  };
</script>
