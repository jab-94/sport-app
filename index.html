  var $view = document.getElementById("view");
  var $tabs = document.getElementById("tabs");
  var $resumeBanner = document.getElementById("resume-banner");
  var $resumeName = document.getElementById("resume-name");

  // Tapping the dimmed backdrop (not the sheet itself) closes any open modal without taking
  // its action — same as picking "Non" on a confirm, or just deciding not to start after all.
  document.getElementById("summary-overlay").addEventListener("click", function(e){
    if(e.target === this){ closeOverlay(this, document.getElementById("summary-sheet")); render(); }
  });

  document.getElementById("resume-btn").addEventListener("click", function(){ state.currentTab="session"; render(); });
  $tabs.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    state.currentTab = btn.getAttribute("data-tab");
    render();
  });

  // Slides the little glass pill (#tab-highlight) under whichever nav button is currently
  // active, sizing/positioning it from that button's own layout box so it always lines up
  // exactly — no matter how many tabs there are or how wide the screen is.
  function moveTabHighlight(){
    var $hl = document.getElementById("tab-highlight");
    var active = $tabs.querySelector("button.active");
    if(!$hl || !active){ if($hl) $hl.classList.remove("show"); return; }
    var navRect = $tabs.getBoundingClientRect();
    var btnRect = active.getBoundingClientRect();
    $hl.style.width = btnRect.width + "px";
    $hl.style.transform = "translateX(" + (btnRect.left - navRect.left - 6) + "px)";
    $hl.classList.add("show");
  }
  window.addEventListener("resize", moveTabHighlight);

  // #topbar, nav#tabs and #session-bar float as absolute overlays (see the comment on #app)
  // instead of flex siblings that push #view around — so #view has to be told how much room
  // to reserve at each end itself, via these three custom properties, or content would start
  // out hidden underneath the bars instead of just scrolling behind them later. Their real
  // heights vary (a long workout name wraps to two lines, the resume banner shows or not, a
  // session bar's rest-row exists or not) so this measures the actual rendered boxes rather
  // than guessing a fixed number. Called after every render()/renderSessionBar(), on resize,
  // and — as a safety net for anything that reflows without going through either of those,
  // e.g. a system font substitution — via ResizeObserver.
  function syncBarHeights(){
    var topbar = document.getElementById("topbar"), sbar = document.getElementById("session-bar");
    var root = document.documentElement;
    root.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
    root.style.setProperty("--navbar-h", $tabs.offsetHeight + "px");
    root.style.setProperty("--sessionbar-h", sbar ? (sbar.offsetHeight + 10) + "px" : "0px");
  }
  window.addEventListener("resize", syncBarHeights);
  if(window.ResizeObserver){
    new ResizeObserver(syncBarHeights).observe(document.getElementById("topbar"));
    new ResizeObserver(syncBarHeights).observe($tabs);
  }

  function render(){
    if(!state.activeSession){
      var leftoverBar = document.getElementById("session-bar");
      if(leftoverBar) leftoverBar.remove();
    }
    Array.prototype.forEach.call($tabs.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === (state.currentTab==="session"?"home":state.currentTab));
    });
    moveTabHighlight();
    if(state.activeSession && state.currentTab!=="session"){
      $resumeBanner.classList.add("show");
      $resumeName.textContent = findWorkout(state.activeSession.workoutId).name;
    } else { $resumeBanner.classList.remove("show"); }
    var tab = state.currentTab;
    if(tab==="session" && !state.activeSession) tab="home";
    if(tab==="home") renderHome();
    else if(tab==="session") renderSession();
    else if(tab==="history") renderHistory();
    else if(tab==="progress") renderProgress();
    else if(tab==="nutrition") renderNutrition();
    else if(tab==="settings") renderSettings();
    // Local-only: just remembers which tab you're on across a relaunch. Using the
    // version-bumping save() here instead would count every tab switch (and every
    // adopted cloud pull, which also ends in a render()) as a "real edit" and re-push
    // to the shared cloud doc on every navigation — harmless but wasteful, and it would
    // blur syncVersion's actual meaning (see save()/checkCloudForUpdates).
    persistLocally();
    syncBarHeights();
  }

  // ---------- HOME ----------
  var LOCATION_LABELS = { salle:"Salle", maison:"À la maison", sport:"Sports" };
  function renderHome(){
    var groups = [];
    state.workouts.forEach(function(w){
      var loc = w.location || "salle";
      var g = groups.find(function(g){ return g.loc === loc; });
      if(!g){ g = { loc:loc, items:[] }; groups.push(g); }
      g.items.push(w);
    });
    var html = '<div class="enter-anim">';
    groups.forEach(function(g){
      html += '<div class="section-title" style="margin:' + (groups.indexOf(g)===0?"2px":"18px") + ' 0 8px;">' + (LOCATION_LABELS[g.loc]||g.loc) + '</div>';
      html += '<div class="workout-grid">';
      g.items.forEach(function(w, i){
        var last = lastSessionFor(w.id);
        var color = workoutColor(w.id);
        var span2 = (i === g.items.length - 1 && g.items.length % 2 === 1);
        html += '<div class="workout-tile' + (span2?" span2":"") + '" style="--tile-c:' + color + ';">' +
          '<div class="wicon">' + '<svg viewBox="0 0 24 24">' + (WORKOUT_ICONS[w.id]||"") + '</svg></div>' +
          '<div class="tinfo">' +
            '<div class="name disp">' + w.name + '</div>' +
            '<div class="meta">' + (w.type==="video" ? "Cours vidéo · " + w.videoDurationMin + " min" : w.type==="quicklog" ? "Sport · " + w.defaultDurationMin + " min par défaut" : w.exercises.length + ' exercices') + (last ? ' · ' + fmtDate(last.date) : ' · jamais fait') + '</div>' +
            '<button class="btn btn-accent btn-pill" data-start="' + w.id + '">Commencer</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    $view.innerHTML = html;
    $view.querySelectorAll("[data-start]").forEach(function(btn){
      btn.addEventListener("click", function(){ openStartModal(btn.getAttribute("data-start")); });
    });
  }

  function openStartModal(workoutId){
    var w = findWorkout(workoutId);
    var isQuicklog = w.type === "quicklog";
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<h2 class="disp">' + w.name + '</h2>' +
      '<div class="muted" style="margin-bottom:14px;">Qui fait la séance ?</div>' +
      '<div class="stack" style="gap:8px;">' + state.people.map(function(pl){
        return '<label class="row" style="gap:10px; background:var(--surface-2); padding:13px; border-radius:11px;">' +
          '<input type="checkbox" class="participant-check" data-pid="' + pl.id + '" checked style="width:19px;height:19px; flex-shrink:0; accent-color:var(--accent);">' +
          '<span style="font-weight:600;">' + escapeAttr(pl.name) + '</span></label>';
      }).join("") + '</div>' +
      // A quicklog activity (Five, Danse...) isn't tracked live set by set — you log it after
      // the fact with however long it actually took, pre-filled from the workout's own
      // default (itself editable in Réglages) instead of measuring real elapsed time.
      (isQuicklog ? '<label class="stack" style="gap:4px; margin-top:14px;"><span class="faint" style="font-size:12.5px;">Durée (minutes)</span>' +
        '<input type="number" id="quicklog-duration" min="1" step="5" value="' + w.defaultDurationMin + '" style="width:100%;"></label>' : '') +
      '<button class="btn btn-accent btn-block" style="margin-top:16px;" id="start-confirm">' + (isQuicklog ? "Enregistrer" : "Commencer") + '</button>';
    overlay.classList.add("show");
    document.getElementById("start-confirm").addEventListener("click", function(){
      var checked = Array.prototype.slice.call(sheet.querySelectorAll(".participant-check:checked")).map(function(c){ return c.getAttribute("data-pid"); });
      if(!checked.length){ showAlert("Sélectionne au moins une personne."); return; }
      if(isQuicklog){
        var duration = parseFloat(document.getElementById("quicklog-duration").value);
        if(!isFinite(duration) || duration <= 0){ showAlert("Renseigne une durée valide."); return; }
        closeOverlay(overlay, sheet);
        logQuickWorkout(workoutId, checked, duration);
        return;
      }
      closeOverlay(overlay, sheet);
      startSession(workoutId, checked);
    });
  }
  // Writes a finished session straight away for a quicklog activity — no active-session/
  // live-timer detour, same calorie formula (met × weight × duration) as finishSession, just
  // with a duration you typed instead of one measured from start/finish timestamps.
  function logQuickWorkout(workoutId, participantIds, durationMin){
    var w = findWorkout(workoutId);
    var caloriesByPerson = {}, volumeByPerson = {};
    participantIds.forEach(function(pid){
      caloriesByPerson[pid] = w.met * 3.5 * (state.bodyWeights[pid]||70) / 200 * durationMin;
      volumeByPerson[pid] = 0;
    });
    var record = {
      id: uid(), workoutId:w.id, workoutName:w.name, date:new Date().toISOString(), participants:participantIds,
      durationMin:durationMin, caloriesByPerson:caloriesByPerson, volumeByPerson:volumeByPerson, exercises:[]
    };
    state.sessions.push(record);
    state.currentTab = "home";
    save();
    showSummary(record, {});
  }
  function lastSessionFor(workoutId){
    var list = state.sessions.filter(function(s){return s.workoutId===workoutId;});
    return list.length ? list[list.length-1] : null;
  }
  function hasDoneBefore(exId, pid){
    return state.sessions.some(function(s){
      return s.exercises.some(function(se){ return se.exId===exId && se.entries[pid] && se.entries[pid].done; });
    });
  }
  function startSession(workoutId, participantIds){
    var w = findWorkout(workoutId);
    state.activeSession = {
      workoutId: workoutId, startedAt: Date.now(), participants: participantIds,
      progress: w.exercises.map(function(e){
        var entries = {};
        participantIds.forEach(function(pid){
          entries[pid] = {
            weight:e.defaults[pid].weight, reps:e.defaults[pid].reps, done:false, skipped:false,
            // baseline = what was logged last time, used to nudge "go up" without forcing it
            baseWeight:e.defaults[pid].weight, baseReps:e.defaults[pid].reps,
            hasHistory: hasDoneBefore(e.id, pid)
          };
        });
        return { exId:e.id, sets:e.sets, entries:entries };
      })
    };
    state.currentTab = "session";
    render();
  }
  function cancelSession(){
    showConfirm("Annuler la séance ?", "Rien ne sera enregistré pour cette séance en cours.", "Annuler la séance", function(){
      clearInterval(sessionTimerHandle);
      restEndsAt = null;
      state.activeSession = null;
      state.currentTab = "home";
      save(); render();
    }, true);
  }

  // A one-off exercise added from the session screen — for "on a envie d'en faire un de plus
  // aujourd'hui" — lives only in this session's progress list, not in the workout's own
  // template, so it won't show up next time you start this workout unless also added in Réglages.
  function openAddExerciseModal(){
    var sess = state.activeSession; if(!sess) return;
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<h2 class="disp">Ajouter un exercice</h2>' +
      '<div class="stack" style="gap:10px; margin-bottom:18px;">' +
        '<input type="text" id="adhoc-name" placeholder="Nom de l’exercice" style="width:100%;">' +
        '<input type="text" id="adhoc-machine" placeholder="Machine / description (optionnel)" style="width:100%;">' +
        '<label class="row" style="font-size:12.5px; gap:6px;"><input type="checkbox" id="adhoc-trackweight" checked> Suivre un poids (décoche pour un exercice au poids du corps)</label>' +
        '<div class="row" style="gap:16px;">' + sess.participants.map(function(pid){
          var pl = state.people.find(function(p){return p.id===pid;});
          return '<label class="row" style="gap:6px; font-size:12.5px;"><input type="checkbox" class="adhoc-participant" value="' + pid + '" checked> ' + escapeAttr(pl.name) + '</label>';
        }).join("") + '</div>' +
      '</div>' +
      '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="adhoc-cancel">Annuler</button>' +
        '<button class="btn btn-accent btn-block" id="adhoc-confirm">Ajouter</button>' +
      '</div>';
    overlay.classList.add("show");
    document.getElementById("adhoc-cancel").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
    document.getElementById("adhoc-confirm").addEventListener("click", function(){
      var name = document.getElementById("adhoc-name").value.trim();
      if(!name){ showAlert("Donne un nom à l’exercice."); return; }
      var machine = document.getElementById("adhoc-machine").value.trim();
      var trackWeight = document.getElementById("adhoc-trackweight").checked;
      var chosen = Array.prototype.slice.call(document.querySelectorAll(".adhoc-participant:checked")).map(function(c){ return c.value; });
      if(chosen.length===0){ showAlert("Choisis au moins une personne."); return; }
      closeOverlay(overlay, sheet);
      addAdhocExercise(name, machine, trackWeight, chosen);
    });
  }
  function addAdhocExercise(name, machine, trackWeight, participantIds){
    var sess = state.activeSession; if(!sess) return;
    var exId = "adhoc-" + uid();
    var defaults = {}, entries = {};
    participantIds.forEach(function(pid){
      defaults[pid] = { weight:0, reps:10 };
      entries[pid] = { weight:0, reps:10, done:false, skipped:false, baseWeight:0, baseReps:10, hasHistory:false };
    });
    sess.progress.push({
      exId: exId, sets:3, entries: entries,
      adhocExercise: { id:exId, name:name, machine:machine || "Ajouté pendant la séance", trackWeight:trackWeight, howTo:"", videoClip:"", defaults:defaults }
    });
    renderSession();
  }

  // ---------- SESSION ----------
  var sessionTimerHandle = null;
  // Rest timer state lives here, not in `state` — it's throwaway UI, not data worth saving
  // or syncing. It survives renderSession()'s frequent full re-renders (tapping any check
  // or stepper rebuilds $view) because #session-bar sits outside $view in the DOM, and
  // updateSessionBar() (already ticking every second) re-hydrates its display from these
  // vars every time, rather than the DOM itself holding the countdown. The default duration
  // itself (state.restDurationDefault) DOES live in `state` — it's a shared preference,
  // set in Réglages, not per-session throwaway UI like the countdown deadline is.
  var restEndsAt = null, restBuzzed = false;
  // navigator.vibrate does not exist on iOS Safari/WKWebView — Apple has never implemented
  // the Vibration API there, for any website or PWA, so the vibrate() calls below are a
  // no-op on iPhone (harmless on Android, where it does work). A short beep is the one
  // alert that actually works everywhere. iOS only allows sound to start from inside a
  // user-gesture handler, so the AudioContext is created/resumed on the "Repos" tap itself
  // (a real tap) rather than later inside the timer callback, which wouldn't count as one.
  var restAudioCtx = null;
  function unlockRestAudio(){
    try{
      if(!restAudioCtx) restAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(restAudioCtx.state === "suspended") restAudioCtx.resume();
    }catch(e){}
  }
  function playRestBeep(){
    if(!restAudioCtx) return;
    try{
      [0, 160].forEach(function(delayMs, i){
        var t = restAudioCtx.currentTime + delayMs/1000;
        var osc = restAudioCtx.createOscillator(), gain = restAudioCtx.createGain();
        osc.frequency.value = i===0 ? 880 : 1040;
        osc.connect(gain); gain.connect(restAudioCtx.destination);
        // Quick fade in/out rather than a hard on/off — avoids the sharp "click" pop a
        // suddenly-started/stopped tone otherwise makes.
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(.2, t + .015);
        gain.gain.linearRampToValueAtTime(0, t + .13);
        osc.start(t); osc.stop(t + .14);
      });
    }catch(e){}
  }
  function renderSession(){
    clearInterval(sessionTimerHandle);
    var sess = state.activeSession;
    var w = findWorkout(sess.workoutId);

    // A video course replaces the whole exercise-cards flow with a single player — there's
    // nothing to check off set by set, just "watch it, then tap Cours terminé" (finishSession
    // already computes calories from met × weight × duration regardless of exercises, so it
    // needs no changes to work here).
    if(w.type === "video"){
      // Two possible sources: a YouTube embed (videoId — full source quality, needs a
      // connection) or a locally hosted file (videoFile — works offline once cached).
      var playerHtml = w.videoId
        ? '<iframe src="https://www.youtube-nocookie.com/embed/' + escapeAttr(w.videoId) + '?playsinline=1&rel=0" title="' + escapeAttr(w.name) + '" ' +
            'style="width:100%; aspect-ratio:16/9; display:block; background:#000; border:0;" ' +
            'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>'
        : '<video src="videos/' + escapeAttr(w.videoFile) + '" controls playsinline preload="metadata" ' +
            'style="width:100%; display:block; background:#000;"></video>';
      $view.innerHTML = '<div class="stack" style="margin-top:6px; padding-bottom:8px;">' +
        '<div class="row between"><div class="row" style="gap:8px; align-items:center;"><h2 style="margin:0;">' + w.name + '</h2>' +
          (workoutMuscles(w.id) ? '<button class="icon-btn info-btn" id="course-muscles-btn" type="button" aria-label="Muscles travaillés">' + MUSCLE_BTN_ICON + '</button>' : '') + '</div>' +
        '<button class="btn btn-line btn-sm" id="cancel-session-btn">Annuler</button></div>' +
        '<div class="card" style="padding:0; overflow:hidden;">' + playerHtml + '</div>' +
        '<div class="faint" style="text-align:center;">Appuie sur "Cours terminé" en bas une fois la vidéo finie.</div>' +
      '</div>';
      document.getElementById("cancel-session-btn").addEventListener("click", cancelSession);
      var courseMusclesBtn = document.getElementById("course-muscles-btn");
      if(courseMusclesBtn) courseMusclesBtn.addEventListener("click", function(){
        var map = workoutMuscles(w.id);
        showMuscleSheet(w.name, "Muscles travaillés", [{ tiers: muscleMapToTiers(map) }], ["Muscle principal","Muscle secondaire","Non sollicité"], muscleNamesHtml(map));
      });
      renderSessionBar();
      sessionTimerHandle = setInterval(updateSessionBar, 1000);
      return;
    }

    var html = '<div class="stack" style="margin-top:6px; padding-bottom:8px;">';
    html += '<div class="row between"><h2 style="margin:0;">' + w.name + '</h2>' +
      '<div class="row" style="gap:8px; flex-shrink:0;"><span class="badge">' + w.exercises.length + ' ex.</span>' +
      '<button class="btn btn-line btn-sm" id="cancel-session-btn">Annuler</button></div></div>';
    // Exercises everyone present has checked off sink to the bottom, collapsed, so they stop
    // taking up room while you're mid-set on the next one.
    var ordered = sess.progress.slice().sort(function(a,b){ return (isExerciseDone(a)?1:0) - (isExerciseDone(b)?1:0); });
    ordered.forEach(function(p){
      var e = exerciseFor(w, p);
      html += renderExerciseCard(e, p);
    });
    html += '<button class="btn btn-line btn-block" id="add-ex-session-btn" type="button">+ Ajouter un exercice</button>';
    html += '</div>';
    $view.innerHTML = html;
    document.getElementById("cancel-session-btn").addEventListener("click", cancelSession);
    document.getElementById("add-ex-session-btn").addEventListener("click", openAddExerciseModal);

    $view.querySelectorAll("[data-check]").forEach(function(el){
      el.addEventListener("click", function(){
        var exId = el.getAttribute("data-check"), pid = el.getAttribute("data-person");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        p.entries[pid].done = !p.entries[pid].done;
        p.forceOpen = false;
        renderSession();
      });
    });
    $view.querySelectorAll("[data-toggle-skip]").forEach(function(el){
      attachLongPress(el, function(){
        var exId = el.getAttribute("data-toggle-skip"), pid = el.getAttribute("data-person");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        var entry = p.entries[pid];
        entry.skipped = !entry.skipped;
        if(entry.skipped) entry.done = false;
        p.forceOpen = false;
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
        renderSession();
      });
    });
    $view.querySelectorAll("[data-expand]").forEach(function(el){
      el.addEventListener("click", function(){
        var p = sess.progress.find(function(x){return x.exId===el.getAttribute("data-expand");});
        p.forceOpen = true;
        renderSession();
      });
    });
    $view.querySelectorAll("[data-info]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var exId = el.getAttribute("data-info");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        var e = p ? exerciseFor(w, p) : findExercise(w, exId);
        showInfo(e.name, e.howTo, e.videoClip);
      });
    });
    $view.querySelectorAll("[data-muscles]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var exId = el.getAttribute("data-muscles"), map = EXERCISE_MUSCLES[exId];
        var e = findExercise(w, exId);
        var names = muscleNamesHtml(map);
        showMuscleSheet(e ? e.name : "Muscles travaillés", "Muscles travaillés", [{ tiers: exerciseMuscleTiers(exId) }],
          ["Muscle principal","Muscle secondaire","Non sollicité"], names);
      });
    });
    $view.querySelectorAll("[data-field]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var exId = inp.getAttribute("data-ex"), pid = inp.getAttribute("data-person"), field = inp.getAttribute("data-field");
        var p = sess.progress.find(function(x){return x.exId===exId;});
        var v = parseFloat(inp.value); if(isNaN(v)) v = 0;
        if(pid) p.entries[pid][field] = v; else p[field] = v;
        updateSessionBar();
      });
    });
    $view.querySelectorAll("[data-step]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var exId = btn.getAttribute("data-ex"), pid = btn.getAttribute("data-person"), field = btn.getAttribute("data-field");
        var delta = parseFloat(btn.getAttribute("data-step"));
        var p = sess.progress.find(function(x){return x.exId===exId;});
        if(pid) p.entries[pid][field] = Math.max(0, round1(p.entries[pid][field] + delta));
        else p[field] = Math.max(1, Math.round(p[field] + delta));
        renderSession();
      });
    });

    renderSessionBar();
    sessionTimerHandle = setInterval(updateSessionBar, 1000);
  }

  // Skipped counts the same as done for "is this exercise settled" purposes — the person just
  // isn't doing it this time, so it shouldn't block the card from collapsing out of the way.
  function isExerciseDone(p){
    var ids = Object.keys(p.entries);
    return ids.length > 0 && ids.every(function(pid){ var en = p.entries[pid]; return en.done || en.skipped; });
  }

  function renderExerciseCard(e, p){
    var participants = state.people.filter(function(pl){ return !!p.entries[pl.id]; });
    if(isExerciseDone(p) && !p.forceOpen){
      var allSkipped = participants.every(function(pl){ return p.entries[pl.id].skipped; });
      var meta = participants.map(function(pl){
        var entry = p.entries[pl.id];
        if(entry.skipped) return "ignoré";
        return e.trackWeight ? (entry.weight + "kg") : (entry.reps + "");
      }).join(" · ");
      var badgeIcon = allSkipped ? '<path d="M6 12h12"/>' : '<path d="M4 12l6 6L20 6"/>';
      return '<div class="ex-card collapsed' + (allSkipped?" all-skipped":"") + '" data-expand="' + e.id + '">' +
        '<div class="done-badge"><svg viewBox="0 0 24 24">' + badgeIcon + '</svg></div>' +
        '<div class="ex-title">' + e.name + '</div>' +
        '<div class="collapsed-meta">' + meta + '</div>' +
      '</div>';
    }
    var infoBtn = (e.howTo || e.videoClip) ? '<button class="icon-btn info-btn" data-info="' + e.id + '" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 8v.01"/></svg></button>' : '';
    // Muscle button next to (i) on Haut/Bas/Abdo exercises: opens the same body map as Progrès,
    // colored for this one exercise only (EXERCISE_MUSCLES). Ad-hoc exercises have no mapping.
    var sessWid = state.activeSession && state.activeSession.workoutId;
    if((sessWid === "haut" || sessWid === "bas" || sessWid === "abdo") && EXERCISE_MUSCLES[e.id])
      infoBtn += '<button class="icon-btn info-btn" data-muscles="' + e.id + '" type="button" aria-label="Muscles travaillés">' + MUSCLE_BTN_ICON + '</button>';
    var cols = participants.map(function(pl){
      var entry = p.entries[pl.id];
      var pClass = pl.id==="p1" ? "" : "p2";
      // Nudge to go up on weight or reps vs. last time — clears on either as soon as one improves.
      var progressed = !entry.hasHistory || (entry.weight > entry.baseWeight) || (entry.reps > entry.baseReps);
      var nudgeWeight = entry.hasHistory && !progressed && e.trackWeight;
      var nudgeReps = entry.hasHistory && !progressed;
      // No visible "skip" button — a long-press on the person's name toggles it, so the card
      // stays clean when nobody needs it. data-toggle-skip on the name itself keeps the touch
      // target small and deliberate, away from the steppers just below it.
      return '<div class="person-col ' + pClass + ' ' + (entry.done?"done":"") + (entry.skipped?" skipped":"") + '">' +
        '<div class="phead"><span class="person-name" data-toggle-skip="' + e.id + '" data-person="' + pl.id + '">' + escapeAttr(pl.name) + '</span>' +
          (entry.skipped ? '' : '<div class="check" data-check="' + e.id + '" data-person="' + pl.id + '"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></div>') +
        '</div>' +
        (entry.skipped
          ? '<div class="skipped-note">Exercice ignoré<br><span class="skipped-hint">appui long sur le nom pour annuler</span></div>'
          : ((e.trackWeight ? fieldLine(e.id, pl.id, "weight", entry.weight, 2.5, "kg", nudgeWeight) : '') +
            fieldLine(e.id, pl.id, "reps", entry.reps, 1, "reps", nudgeReps))
        ) +
      '</div>';
    }).join("");
    var colsClass = participants.length === 1 ? "person-cols solo" : "person-cols";
    return '<div class="ex-card" data-card="' + e.id + '">' +
      '<div class="ex-head">' +
        '<div><div class="ex-title" style="display:flex; align-items:center; gap:6px;">' + e.name + infoBtn + '</div><div class="ex-sub">' + e.machine + '</div></div>' +
        '<div class="sets-badge">' + p.sets + ' <span class="n" style="font-weight:400;">séries</span></div>' +
      '</div>' +
      '<div class="' + colsClass + '">' + cols + '</div>' +
    '</div>';
  }
  function fieldLine(exId, pid, key, val, step, unit, nudge){
    return '<div class="field-line"><span class="unit">' + unit + '</span><div class="stepper">' +
      '<button data-step="-' + step + '" data-ex="' + exId + '" data-person="' + pid + '" data-field="' + key + '" type="button">−</button>' +
      '<input class="num" type="number" inputmode="decimal" value="' + val + '" data-field="' + key + '" data-ex="' + exId + '" data-person="' + pid + '">' +
      '<button class="' + (nudge?"nudge":"") + '" data-step="' + step + '" data-ex="' + exId + '" data-person="' + pid + '" data-field="' + key + '" type="button" title="' + (nudge?"Essaie d’augmenter par rapport à la dernière fois":"") + '">+</button>' +
    '</div></div>';
  }

  function renderSessionBar(){
    var old = document.getElementById("session-bar"); if(old) old.remove();
    var bar = document.createElement("div");
    bar.id = "session-bar";
    // A video course has no exercises to count and no "sets" to rest between — just the
    // elapsed time and a finish action, worded to match what you're actually ending.
    var w = findWorkout(state.activeSession.workoutId);
    var isVideo = w && w.type === "video";
    bar.innerHTML = isVideo ?
      ('<div class="row between">' +
        '<span class="time num" id="sb-time"></span>' +
        '<button class="btn btn-accent btn-sm" id="sb-finish">Cours terminé</button>' +
      '</div>')
      :
      ('<div class="row" style="gap:12px;">' +
        '<span class="prog num" id="sb-count"></span>' +
        '<div class="progress-track"><div class="progress-fill" id="sb-fill"></div></div>' +
        '<span class="time num" id="sb-time"></span>' +
        '<button class="btn btn-accent btn-sm" id="sb-finish">Terminer</button>' +
      '</div>' +
      '<div class="row between" id="rest-row">' +
        '<button class="btn btn-line btn-sm" id="rest-start" type="button">' +
          '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;margin-right:5px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
          'Repos ' + state.restDurationDefault + 's' +
        '</button>' +
        '<div class="row" id="rest-running" style="gap:8px; display:none;">' +
          '<span id="rest-time" class="num"></span>' +
          '<button class="btn btn-line btn-sm" id="rest-plus15" type="button">+15s</button>' +
          '<button class="icon-btn" id="rest-cancel" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
        '</div>' +
      '</div>');
    document.getElementById("app").insertBefore(bar, document.getElementById("tabs"));
    document.getElementById("sb-finish").addEventListener("click", finishSession);
    if(!isVideo){
      document.getElementById("rest-start").addEventListener("click", function(){
        unlockRestAudio();
        restEndsAt = Date.now() + state.restDurationDefault*1000; restBuzzed = false; updateSessionBar();
      });
      document.getElementById("rest-plus15").addEventListener("click", function(){
        if(restEndsAt) restEndsAt += 15000; updateSessionBar();
      });
      document.getElementById("rest-cancel").addEventListener("click", function(){
        restEndsAt = null; updateSessionBar();
      });
    }
    updateSessionBar();
  }
  function fmtSec(totalSec){ var s = Math.max(0, Math.round(totalSec)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  function updateSessionBar(){
    var sess = state.activeSession; if(!sess) return;
    var done=0, total=0;
    sess.progress.forEach(function(p){ Object.keys(p.entries).forEach(function(pid){ var en=p.entries[pid]; if(en.skipped) return; total++; if(en.done) done++; }); });
    var elapsedMin = (Date.now() - sess.startedAt) / 60000;
    var countEl = document.getElementById("sb-count"), fillEl = document.getElementById("sb-fill"), timeEl = document.getElementById("sb-time");
    if(countEl) countEl.textContent = done + "/" + total;
    if(fillEl) fillEl.style.width = (total? (done/total*100):0) + "%";
    if(timeEl) timeEl.textContent = fmtDur(elapsedMin);

    var startBtn = document.getElementById("rest-start"), running = document.getElementById("rest-running"), timeSpan = document.getElementById("rest-time");
    if(startBtn && running){
      if(restEndsAt){
        var remaining = (restEndsAt - Date.now()) / 1000;
        startBtn.style.display = "none"; running.style.display = "flex";
        if(remaining > 0){
          timeSpan.textContent = fmtSec(remaining); timeSpan.classList.remove("done");
        } else {
          timeSpan.textContent = "0:00"; timeSpan.classList.add("done");
          if(!restBuzzed){
            restBuzzed = true;
            playRestBeep();
            if(navigator.vibrate) try{ navigator.vibrate([200,100,200,100,200]); }catch(e){}
            setTimeout(function(){ restEndsAt = null; updateSessionBar(); }, 2000);
          }
        }
      } else {
        startBtn.style.display = ""; running.style.display = "none";
      }
    }
    save();
  }

  function finishSession(){
    clearInterval(sessionTimerHandle);
    restEndsAt = null;
    var sess = state.activeSession;
    var w = findWorkout(sess.workoutId);
    var participants = sess.participants || state.people.map(function(p){return p.id;});
    var durationMin = Math.max(1, (Date.now() - sess.startedAt) / 60000);
    var caloriesByPerson = {}, volumeByPerson = {}, prsByPerson = {};
    participants.forEach(function(pid){
      caloriesByPerson[pid] = w.met * 3.5 * (state.bodyWeights[pid]||70) / 200 * durationMin;
      volumeByPerson[pid] = 0; prsByPerson[pid] = [];
    });

    var snapshot = sess.progress.map(function(p){
      var e = exerciseFor(w, p);
      var entriesOut = {};
      participants.forEach(function(pid){
        var entry = p.entries[pid];
        // Not everyone necessarily has an entry (an exercise added mid-session can be for just
        // one of you), and a skipped entry is deliberately left out entirely — it shouldn't
        // count toward volume, PRs, or become the new suggested default next time.
        if(!entry || entry.skipped) return;
        if(entry.done && e.trackWeight){
          var best = bestWeightFor(e.id, pid);
          if(entry.weight > best) prsByPerson[pid].push(e.name + " — " + entry.weight + " kg");
          volumeByPerson[pid] += entry.weight * p.sets * entry.reps;
        }
        entriesOut[pid] = { weight:entry.weight, reps:entry.reps, done:entry.done };
        e.defaults[pid] = { weight:entry.weight, reps:entry.reps };
      });
      return { exId:e.id, name:e.name, trackWeight:e.trackWeight, sets:p.sets, entries:entriesOut };
    }).filter(function(rec){ return Object.keys(rec.entries).length > 0; }); // drop exercises nobody actually did

    var record = {
      id: uid(), workoutId:w.id, workoutName:w.name, date:new Date().toISOString(), participants:participants,
      durationMin:durationMin, caloriesByPerson:caloriesByPerson, volumeByPerson:volumeByPerson, exercises:snapshot
    };
    state.sessions.push(record);
    state.activeSession = null;
    state.currentTab = "home";
    save();
    showSummary(record, prsByPerson);
  }

  function bestWeightFor(exId, pid){
    var best = 0;
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(e){
        if(e.exId===exId && e.trackWeight && e.entries[pid] && e.entries[pid].done) best = Math.max(best, e.entries[pid].weight);
      });
    });
    return best;
  }

  // Re-derives calories/volume for a session record edited after the fact (see editSession
  // below). Calories track the workout's MET value like finishSession does — if the workout
  // was since deleted, fall back to scaling the previously stored calories by how much the
  // duration itself changed, rather than losing the number entirely.
  function recomputeSessionStats(rec, originalDurationMin, workout){
    var participants = rec.participants || state.people.map(function(p){return p.id;});
    var caloriesByPerson = {}, volumeByPerson = {};
    participants.forEach(function(pid){
      if(workout){
        caloriesByPerson[pid] = workout.met * 3.5 * (state.bodyWeights[pid]||70) / 200 * rec.durationMin;
      } else {
        var oldCal = (rec.caloriesByPerson && rec.caloriesByPerson[pid]) || 0;
        caloriesByPerson[pid] = originalDurationMin > 0 ? oldCal * (rec.durationMin / originalDurationMin) : oldCal;
      }
      volumeByPerson[pid] = 0;
    });
    (rec.exercises||[]).forEach(function(e){
      participants.forEach(function(pid){
        var en = e.entries[pid];
        if(en && en.done && e.trackWeight) volumeByPerson[pid] += (en.weight||0) * (e.sets||0) * (en.reps||0);
      });
    });
    rec.caloriesByPerson = caloriesByPerson;
    rec.volumeByPerson = volumeByPerson;
  }

  function showSummary(record, prsByPerson){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    var participants = record.participants || state.people.map(function(p){return p.id;});
    // A video course or quicklog sport has no per-exercise entries and no weight lifted —
    // "0/0 exercices" and "0 kg volume" would just be noise, so it skips straight to
    // duration + calories.
    var isVideo = isNoExerciseWorkout(findWorkout(record.workoutId));
    var html = '<h2 class="disp">Séance enregistrée</h2>' +
      '<div class="muted">' + record.workoutName + ' · ' + fmtDateFull(record.date) + '</div>' +
      '<div class="stat-grid" style="margin-top:14px;">' + stat(fmtDur(record.durationMin), "Durée");
    if(!isVideo){
      var doneTotal=0, total=0;
      // A skipped entry is left out of e.entries entirely (see finishSession) — guard against
      // it the same way recomputeSessionStats does, instead of crashing on en.done.
      record.exercises.forEach(function(e){ participants.forEach(function(pid){ var en = e.entries[pid]; if(!en) return; total++; if(en.done) doneTotal++; }); });
      html += stat(doneTotal + "/" + total, "Exercices faits");
    }
    participants.forEach(function(pid){
      html += stat(Math.round(record.caloriesByPerson[pid]) + " kcal", personName(pid) + " · calories");
      if(!isVideo) html += stat(Math.round(record.volumeByPerson[pid]) + " kg", personName(pid) + " · volume");
    });
    html += '</div>';
    participants.forEach(function(pid){
      (prsByPerson[pid]||[]).forEach(function(t){
        html += '<div class="pr-line">Record · ' + personName(pid) + ' — ' + t + '</div>';
      });
    });
    html += '<button class="btn btn-accent btn-block" style="margin-top:16px;" id="summary-close">Fermer</button>';
    sheet.innerHTML = html;
    overlay.classList.add("show");
    document.getElementById("summary-close").addEventListener("click", function(){ closeOverlay(overlay, sheet); render(); });
  }
  function stat(v,l){ return '<div class="stat-tile"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

  // ---------- HISTORY ----------
  var historyFilter = "all"; // which workout type is shown — resets on reload, like settingsOpen
  function renderHistory(){
    // Sorted by the session's actual date (not insertion order) — otherwise editing a
    // session's date to backdate it wouldn't move it to where it now belongs in the list.
    var all = state.sessions.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    if(!all.length){
      $view.innerHTML = '<div class="empty">Aucune séance enregistrée pour l’instant.<br>Commence une séance depuis l’onglet Séances.</div>';
      return;
    }
    var list = historyFilter==="all" ? all : all.filter(function(s){ return s.workoutId===historyFilter; });
    var html = '<div class="stack enter-anim" style="margin-top:6px;">';
    html += '<div class="pill-group scroll">' +
      '<button class="pill neutral' + (historyFilter==="all"?" active":"") + '" data-hist-filter="all">Tout</button>' +
      state.workouts.map(function(w){
        return '<button class="pill neutral' + (historyFilter===w.id?" active":"") + '" data-hist-filter="' + w.id + '">' + w.name + '</button>';
      }).join("") +
    '</div>';
    if(!list.length){
      html += '<div class="empty">Aucune séance de ce type pour l’instant.</div>';
    }
    list.forEach(function(s){
      var participants = s.participants || state.people.map(function(p){return p.id;});
      var isVideo = isNoExerciseWorkout(findWorkout(s.workoutId));
      html += '<div class="hist-item" data-hist="' + s.id + '">' +
        '<div class="top"><div><div class="date">' + s.workoutName + '</div><div class="faint">' + fmtDateFull(s.date) + '</div></div>' +
        '<div class="row" style="gap:6px; flex-shrink:0;"><span class="badge">' + fmtDur(s.durationMin) + '</span>' +
        '<button class="icon-btn" data-edit-session="' + s.id + '"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/><path d="M13 7l4 4"/></svg></button>' +
        '<button class="icon-btn" data-del-session="' + s.id + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>' +
        '<div class="row" style="margin-top:8px; gap:16px; flex-wrap:wrap;">' +
        participants.map(function(pid){
          return '<span class="faint num">' + personName(pid) + ': ' + Math.round(s.caloriesByPerson[pid]) + ' kcal' + (isVideo?'':' · ' + Math.round(s.volumeByPerson[pid]) + ' kg') + '</span>';
        }).join("") + '</div>' +
        '<div class="hist-detail" id="detail-' + s.id + '">' +
          (isVideo ? '<div class="faint">Pas de détail exercice par exercice pour ce type de séance.</div>' :
          s.exercises.map(function(e){
            return '<div class="exname">' + e.name + '</div>' + participants.map(function(pid){
              var en = e.entries[pid];
              // A skipped entry is left out of e.entries entirely (see finishSession) — show
              // it as ignored instead of crashing on en.done.
              if(!en) return '<div class="exline"><span>— ' + personName(pid) + '</span><span class="faint">ignoré</span></div>';
              return '<div class="exline"><span>' + (en.done?"✓ ":"— ") + personName(pid) + '</span><span class="num">' +
                (e.trackWeight ? en.weight + " kg × " : "") + e.sets + "×" + en.reps + '</span></div>';
            }).join("");
          }).join("")) +
        '</div></div>';
    });
    html += '</div>';
    $view.innerHTML = html;
    $view.querySelectorAll("[data-hist-filter]").forEach(function(btn){
      btn.addEventListener("click", function(){ historyFilter = btn.getAttribute("data-hist-filter"); renderHistory(); });
    });
    $view.querySelectorAll("[data-hist]").forEach(function(card){
      card.addEventListener("click", function(){ document.getElementById("detail-" + card.getAttribute("data-hist")).classList.toggle("show"); });
    });
    $view.querySelectorAll("[data-edit-session]").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        openEditSessionModal(btn.getAttribute("data-edit-session"));
      });
    });
    $view.querySelectorAll("[data-del-session]").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var sid = btn.getAttribute("data-del-session");
        showConfirm("Supprimer cette séance ?", "Elle sera retirée définitivement de ton historique.", "Supprimer", function(){
          state.sessions = state.sessions.filter(function(s){ return s.id !== sid; });
          save(); renderHistory();
        }, true);
      });
    });
  }

  // Lets you fix up a session after the fact (forgot to hit "Terminé" so the duration is
  // wrong, mis-entered a weight/rep count, or want to add/remove an exercise). Edits happen
  // on a clone — nothing touches state.sessions until "Enregistrer" — so cancelling, or
  // add/remove-exercise re-rendering the form, never leaves a half-applied edit lying around.
  function openEditSessionModal(sid){
    var orig = state.sessions.find(function(x){ return x.id === sid; });
    if(!orig) return;
    var clone = JSON.parse(JSON.stringify(orig));
    var originalDurationMin = orig.durationMin;
    var workout = findWorkout(clone.workoutId);
    var isVideo = isNoExerciseWorkout(workout);
    var participants = clone.participants || state.people.map(function(p){ return p.id; });
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");

    function syncFormToClone(){
      var durInput = document.getElementById("edit-duration");
      if(durInput) clone.durationMin = Math.max(1, parseFloat(durInput.value) || clone.durationMin);
      var dateInput = document.getElementById("edit-date");
      if(dateInput && dateInput.value){
        var parsed = new Date(dateInput.value);
        if(!isNaN(parsed.getTime())) clone.date = parsed.toISOString();
      }
      if(isVideo) return;
      clone.exercises.forEach(function(e, exIdx){
        var nameEl = sheet.querySelector('[data-edit-name="' + exIdx + '"]');
        if(nameEl) e.name = nameEl.value.trim();
        var twEl = sheet.querySelector('[data-edit-trackweight="' + exIdx + '"]');
        if(twEl) e.trackWeight = twEl.checked;
        var setsEl = sheet.querySelector('[data-edit-sets="' + exIdx + '"]');
        if(setsEl) e.sets = Math.max(1, parseInt(setsEl.value, 10) || e.sets);
        participants.forEach(function(pid){
          if(!e.entries[pid]) return;
          var wEl = sheet.querySelector('[data-edit-weight="' + exIdx + '"][data-edit-pid="' + pid + '"]');
          if(wEl) e.entries[pid].weight = Math.max(0, parseFloat(wEl.value) || 0);
          var rEl = sheet.querySelector('[data-edit-reps="' + exIdx + '"][data-edit-pid="' + pid + '"]');
          if(rEl) e.entries[pid].reps = Math.max(0, parseInt(rEl.value, 10) || 0);
          var dEl = sheet.querySelector('[data-edit-done="' + exIdx + '"][data-edit-pid="' + pid + '"]');
          if(dEl) e.entries[pid].done = dEl.checked;
        });
      });
    }

    function renderForm(){
      var html = '<h2 class="disp">Modifier la séance</h2>' +
        '<div class="muted" style="margin-bottom:14px;">' + escapeAttr(clone.workoutName) + '</div>';
      html += '<div class="stack" style="gap:14px; margin-bottom:18px;">';
      // Pour les fois où une séance de la veille n'a été saisie que le lendemain matin — on
      // enregistre toujours "maintenant" en finissant une séance, donc c'est ici qu'on
      // redate après coup plutôt que de forcer à ressaisir au bon moment.
      html += '<label class="stack" style="gap:4px;"><span class="faint" style="font-size:12.5px;">Date et heure</span>' +
        '<input type="datetime-local" id="edit-date" value="' + toDatetimeLocalValue(clone.date) + '" style="width:100%;"></label>';
      html += '<label class="stack" style="gap:4px;"><span class="faint" style="font-size:12.5px;">Durée (minutes)</span>' +
        '<input type="number" min="1" step="1" id="edit-duration" value="' + Math.round(clone.durationMin) + '" style="width:100%;"></label>';

      if(isVideo){
        html += '<div class="faint">Pas de détail exercice par exercice à modifier pour ce type de séance.</div>';
      } else {
        clone.exercises.forEach(function(e, exIdx){
          html += '<div class="card" style="padding:12px;">' +
            '<div class="row" style="gap:8px; margin-bottom:8px;">' +
              '<input type="text" data-edit-name="' + exIdx + '" value="' + escapeAttr(e.name) + '" placeholder="Nom de l’exercice" style="flex:1;">' +
              '<button class="icon-btn" type="button" data-remove-ex="' + exIdx + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
            '</div>' +
            '<div class="row" style="gap:14px; margin-bottom:8px; font-size:12px;">' +
              '<label class="row" style="gap:5px;"><input type="checkbox" data-edit-trackweight="' + exIdx + '" ' + (e.trackWeight?"checked":"") + '> Poids suivi</label>' +
              '<label class="row" style="gap:5px;">Séries <input type="number" min="1" step="1" data-edit-sets="' + exIdx + '" value="' + e.sets + '" style="width:48px;"></label>' +
            '</div>';
          participants.forEach(function(pid){
            var en = e.entries[pid];
            if(!en) return;
            html += '<div class="row" style="gap:8px; align-items:center; margin-bottom:6px;">' +
              '<span class="faint" style="width:42px; flex-shrink:0; font-size:12.5px;">' + escapeAttr(personName(pid)) + '</span>' +
              (e.trackWeight ? '<input type="number" min="0" step="0.5" data-edit-weight="' + exIdx + '" data-edit-pid="' + pid + '" value="' + en.weight + '" style="width:64px;" placeholder="kg">' : '') +
              '<input type="number" min="0" step="1" data-edit-reps="' + exIdx + '" data-edit-pid="' + pid + '" value="' + en.reps + '" style="width:56px;" placeholder="reps">' +
              '<label class="row" style="gap:4px; font-size:11.5px;"><input type="checkbox" data-edit-done="' + exIdx + '" data-edit-pid="' + pid + '" ' + (en.done?"checked":"") + '> fait</label>' +
            '</div>';
          });
          html += '</div>';
        });
        html += '<button class="btn btn-line btn-block" type="button" id="edit-add-ex">+ Ajouter un exercice</button>';
      }
      html += '</div>';
      html += '<div class="row" style="gap:10px;">' +
        '<button class="btn btn-ghost btn-block" id="edit-session-cancel">Annuler</button>' +
        '<button class="btn btn-accent btn-block" id="edit-session-save">Enregistrer</button>' +
      '</div>';
      sheet.innerHTML = html;

      document.getElementById("edit-session-cancel").addEventListener("click", function(){ closeOverlay(overlay, sheet); });
      document.getElementById("edit-session-save").addEventListener("click", function(){
        syncFormToClone();
        if(!isVideo) clone.exercises = clone.exercises.filter(function(e){ return e.name; });
        recomputeSessionStats(clone, originalDurationMin, workout);
        var idx = state.sessions.findIndex(function(x){ return x.id === sid; });
        if(idx !== -1) state.sessions[idx] = clone;
        save();
        closeOverlay(overlay, sheet);
        renderHistory();
      });
      if(!isVideo){
        sheet.querySelectorAll("[data-remove-ex]").forEach(function(btn){
          btn.addEventListener("click", function(){
            syncFormToClone();
            clone.exercises.splice(+btn.getAttribute("data-remove-ex"), 1);
            renderForm();
          });
        });
        document.getElementById("edit-add-ex").addEventListener("click", function(){
          syncFormToClone();
          var entries = {};
          participants.forEach(function(pid){ entries[pid] = { weight:0, reps:10, done:true }; });
          clone.exercises.push({ exId:"adhoc-" + uid(), name:"", trackWeight:true, sets:3, entries:entries });
          renderForm();
        });
      }
    }

    overlay.classList.add("show");
    renderForm();
  }

  // ---------- PROGRESS ----------
  // Which period the "Calories brûlées" section points at, and which granularity (jour/
  // semaine/mois/année) — both reset on reload, same spirit as nutritionViewDate elsewhere.
  // progressViewDate is a reference date inside that period; prev/next shift it by one whole
  // period at a time via shiftPeriod rather than always by a day.
  var progressViewDate = new Date();
  var progressPeriod = "day";
  // The default screen for Progrès is "Nous deux" in "Jour" view (asked for explicitly) — a
  // page-load-scoped var, same spirit as progressPeriod above, rather than state.currentPerson
  // (shared with the Nutrition tab, and persisted): switching this doesn't touch what Nutrition
  // remembers, and it resets to "both" on every fresh app open without forcing that choice onto
  // Nutrition too.
  var progressPerson = "both";
  // The session-count ring's granularity follows whichever period you're browsing: "Jour" and
  // "Semaine" both track the week (goal 3), "Mois" tracks the month (goal 12), "Année" tracks
  // the year (goal 140) — a weekly goal checked once a year would be meaningless, so the ring
  // always matches the timescale you're actually looking at.
  var RING_GOALS = { week:3, month:12, year:140 };
  function ringPeriodFor(period){ return period === "day" ? "week" : period; }
  // Sessions (any workout type) in the ring-period (week/month/year) containing `refDate` that
  // at least one of `ids` participated in — a joint session counts once, not twice, which is
  // why this isn't a sum of per-person counts. Used for a single person; "Nous deux" calls this
  // once per real person instead (see renderProgress) since comparing the two against the same
  // goal is the whole point, not merging them into one union count.
  function sessionCountForPeriod(pid, type, refDate){
    var start = periodStart(type, refDate), end = periodEnd(type, refDate);
    var ids = personIdsFor(pid);
    return state.sessions.filter(function(s){
      if(!inPeriod(s.date, start, end)) return false;
      return participantsInclude(s.participants || state.people.map(function(p){return p.id;}), ids);
    }).length;
  }
  // Small ring gauge, same visual idea as a watch "close your ring" goal — stroke-dasharray
  // is how an SVG circle fakes a progress arc (a dash as long as the "done" share of the
  // circumference, gap for the rest), rotated -90° so it starts at 12 o'clock. `ringArc` draws
  // just the two circles at an explicit radius so two can share one <svg> (Am/Jab concentric
  // rings in "Nous deux") instead of each being centered in their own.
  function ringArc(cx, cy, r, sw, pct, color){
    var circ = 2*Math.PI*r;
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + sw + '"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" ' +
        'stroke-dasharray="' + (circ*pct).toFixed(1) + ' ' + circ.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
  }
  function ringSvg(v, goal, size, color){
    var sw = Math.max(5, Math.round(size*0.11));
    var r = (size-sw)/2, c = size/2;
    var pct = goal>0 ? Math.min(1, v/goal) : 0;
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
      ringArc(c, c, r, sw, pct, color || "var(--accent)") +
      '<text x="' + c + '" y="' + (c+5) + '" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">' + v + '/' + goal + '</text>' +
    '</svg>';
  }
  // Two concentric rings, one color per person — "Nous deux" compares Am and Jab against
  // their OWN individual goal (same goal value each, e.g. 3/semaine chacun) rather than a
  // merged count against a doubled goal, which the goal itself never changes to reflect.
  function dualRingSvg(vA, goalA, colorA, vB, goalB, colorB, size){
    var sw = Math.max(5, Math.round(size*0.09));
    var c = size/2;
    var rOuter = c - sw/2 - 1;
    var rInner = rOuter - sw - 3;
    var pctA = goalA>0 ? Math.min(1, vA/goalA) : 0;
    var pctB = goalB>0 ? Math.min(1, vB/goalB) : 0;
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
      ringArc(c, c, rOuter, sw, pctA, colorA) +
      ringArc(c, c, rInner, sw, pctB, colorB) +
    '</svg>';
  }
  // Two horizontal progress bars, one per person, for a goal that's personal rather than
  // mergeable (calories brûlées) — half of your own goal reached fills the bar halfway,
  // regardless of how the other person is doing. `goal` null (profil incomplet) shows that
  // instead of a bar nobody could interpret.
  function dualProgressBarsHtml(valA, goalA, colorA, nameA, valB, goalB, colorB, nameB, unit){
    function row(val, goal, color, name){
      var right = goal == null ? '<span class="faint" style="font-size:11px;">profil incomplet</span>' :
        '<span class="faint num">' + Math.round(val) + ' / ' + Math.round(goal) + ' ' + unit + '</span>';
      var pct = (goal != null && goal>0) ? Math.min(100, Math.round(val/goal*100)) : 0;
      // .progress-track relies on `flex:1` to fill its container's width — that only works
      // inside a row (horizontal) flex parent, same as the session-bar's rest timer uses it.
      // Nesting it straight inside this .stack (a COLUMN flex container) makes `flex:1` target
      // height instead, collapsing it to 0 — wrapping it in its own .row restores the row
      // context so the bar is actually visible (bug: bar invisible in "Nous deux").
      return '<div class="stack" style="gap:4px;">' +
        '<div class="row between" style="font-size:12px;"><span style="color:' + color + '; font-weight:600;">' + escapeAttr(name) + '</span>' + right + '</div>' +
        '<div class="row"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%; background:' + color + ';"></div></div></div>' +
      '</div>';
    }
    return '<div class="card stack" style="gap:10px;">' + row(valA, goalA, colorA, nameA) + row(valB, goalB, colorB, nameB) + '</div>';
  }
  // Daily calories-burned total for one or both people (see personIdsFor) over the last `days`
  // days (today inclusive), for the trend chart — same shape as nutritionTrendPoints, reused
  // by renderLineChartSvg.
  function burnTrendPoints(pid, days){
    var ids = personIdsFor(pid);
    var points = [];
    for(var i=days-1; i>=0; i--){
      var d = new Date(); d.setDate(d.getDate()-i);
      var key = dayKey(d);
      var total = state.sessions.filter(function(s){
        return participantsInclude(s.participants || state.people.map(function(p){return p.id;}), ids) && dayKey(s.date) === key;
      }).reduce(function(a,s){ return a + ids.reduce(function(b,id){ return b + (s.caloriesByPerson ? (s.caloriesByPerson[id]||0) : 0); }, 0); }, 0);
      points.push({ date: d.toISOString(), value: Math.round(total) });
    }
    return points;
  }
  // calcBurnGoal/calcNutritionTargets are per-person (BMR-based) — these sum them for "Nous
  // deux", returning null (same "profil incomplet" fallback) the moment EITHER person is
  // missing data, rather than silently showing a combined number that's actually missing half
  // a couple's worth of goal.
  function calcBurnGoalFor(pid){
    var ids = personIdsFor(pid), sum = 0;
    for(var i=0;i<ids.length;i++){ var g = calcBurnGoal(ids[i]); if(g==null) return null; sum += g; }
    return sum;
  }
  function calcNutritionTargetsFor(pid){
    var ids = personIdsFor(pid), sum = { calories:0, protein:0, tdee:0, bmr:0 };
    for(var i=0;i<ids.length;i++){
      var n = calcNutritionTargets(ids[i]); if(!n) return null;
      sum.calories += n.calories; sum.protein += n.protein; sum.tdee += n.tdee; sum.bmr += n.bmr;
    }
    return sum;
  }

  // Tiers per muscle group ("primary"|"secondary", absent = never touched) for one real
  // person over `sessions` (already filtered to the period/participants by the caller) —
  // primary always wins once reached, a later secondary hit never downgrades it.
  function muscleTiersFor(sessions, pid){
    var tiers = {};
    function mark(muscles, tier){
      (muscles||[]).forEach(function(m){ if(tiers[m] !== "primary") tiers[m] = tier; });
    }
    sessions.forEach(function(s){
      var participants = s.participants || state.people.map(function(p){return p.id;});
      if(participants.indexOf(pid) === -1) return;
      if(s.exercises && s.exercises.length){
        s.exercises.forEach(function(e){
          var en = e.entries[pid];
          if(!en || !en.done) return;
          var map = EXERCISE_MUSCLES[e.exId];
          if(!map) return;
          mark(map.primary, "primary"); mark(map.secondary, "secondary");
        });
      } else {
        var wmap = workoutMuscles(s.workoutId);
        if(wmap){ mark(wmap.primary, "primary"); mark(wmap.secondary, "secondary"); }
      }
    });
    return tiers;
  }

  function muscleZoneFill(tiers, muscle){
    var t = muscle ? tiers[muscle] : null;
    return t === "primary" ? MUSCLE_COLOR_PRIMARY : t === "secondary" ? MUSCLE_COLOR_SECONDARY : MUSCLE_COLOR_UNTARGETED;
  }
  function muscleBodySvg(view, tiers, maxWidth, female, editable){
    var fig = MUSCLE_FIGURES[female ? "f" : "m"][view];
    var bun = fig.bun ? '<circle cx="' + fig.bun.cx + '" cy="' + fig.bun.cy + '" r="' + fig.bun.r + '" fill="' + MUSCLE_BODY_FILL + '" stroke="' + MUSCLE_BODY_LINE + '" stroke-width="2.6"/>' : '';
    var zones = fig.zones.map(function(z){
      var tap = (editable && z.muscle) ? ' data-muscle-tap="' + escapeAttr(z.muscle) + '" style="cursor:pointer;"' : '';
      return '<path d="' + z.d + '" fill="' + muscleZoneFill(tiers, z.muscle) + '"' + tap + '/>';
    }).join("");
    return '<svg viewBox="10 -12 180 452" width="100%" style="display:block; max-width:' + (maxWidth||125) + 'px; height:auto;" role="img" aria-label="' + (view==="front"?"Face":"Dos") + '">' +
      bun +
      '<path d="' + fig.outer + '" fill="' + MUSCLE_BODY_FILL + '" stroke="' + MUSCLE_BODY_LINE + '" stroke-width="2.6" stroke-linejoin="round"/>' +
      '<g fill="' + MUSCLE_BODY_LINE + '">' + fig.lines.map(function(d){ return '<path d="' + d + '"/>'; }).join("") + '</g>' +
      zones +
    '</svg>';
  }
  // Face + Dos side by side for one set of tiers. `maxWidth` per figure: ~150 in the zoomed
  // sheet, much smaller for the compact thumbnail in Progrès (labels dropped there too).
  function muscleMapHtml(tiers, maxWidth, compact, female, editable){
    function fig(view, label){
      return '<div class="stack" style="flex:1; align-items:center; gap:4px; min-width:0;">' +
        (compact ? '' : '<div class="faint" style="font-size:11px;">' + label + '</div>') +
        muscleBodySvg(view, tiers, maxWidth, female, editable) + '</div>';
    }
    return '<div class="row" style="gap:' + (compact?4:10) + 'px; align-items:flex-start;">' + fig("front","Face") + fig("back","Dos") + '</div>';
  }
  function muscleLegendHtml(labels, small){
    labels = labels || ["Beaucoup travaillé","Un peu travaillé","Pas travaillé"];
    function dot(color, label){
      return '<span class="row" style="gap:5px; align-items:center;"><span style="width:' + (small?8:10) + 'px; height:' + (small?8:10) + 'px; border-radius:50%; background:' + color + '; display:inline-block; flex-shrink:0;"></span>' + label + '</span>';
    }
    return '<div class="row" style="gap:' + (small?10:14) + 'px; flex-wrap:wrap; font-size:' + (small?10.5:11.5) + 'px;' + (small?' color:var(--ink-soft);':'') + '">' +
      dot(MUSCLE_COLOR_PRIMARY, labels[0]) + dot(MUSCLE_COLOR_SECONDARY, labels[1]) + dot(MUSCLE_COLOR_UNTARGETED, labels[2]) +
    '</div>';
  }
  // Full-size map in the shared bottom sheet — opened by tapping the compact map in Progrès,
  // and by the muscle button on each Haut/Bas exercise. groups: [{label, color, tiers}]
  // (label omitted when there's only one body to show).
  function showMuscleSheet(title, subtitle, groups, legendLabels, extraHtml){
    var overlay = document.getElementById("summary-overlay"), sheet = document.getElementById("summary-sheet");
    sheet.innerHTML = '<h2 class="disp">' + escapeAttr(title) + '</h2>' +
      (subtitle ? '<div class="muted" style="margin:2px 0 14px; font-size:13px;">' + escapeAttr(subtitle) + '</div>' : '') +
      '<div class="stack" style="gap:16px; margin-bottom:14px;">' +
        groups.map(function(g){

  function computeWeekStreak(sessions){
    if(!sessions.length) return 0;
    var weeks = {};
    sessions.forEach(function(s){ weeks[isoWeekKey(new Date(s.date))] = true; });
    var streak = 0, cursor = new Date();
    while(true){
      var key = isoWeekKey(cursor);
      if(weeks[key]){ streak++; cursor.setDate(cursor.getDate()-7); } else break;
    }
    return streak;
  }

  function weeklyChartSvg(sessions){
    var H = 110, pad = 22;
